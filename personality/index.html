      border-radius: 1rem;
      font-size: 1rem;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .option {
      background: #fffbf5;
      border: 1px solid #e5dbcd;
      border-radius: 1rem;
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .option:hover {
      background: #faf3e5;
      border-color: #cbb295;
    }
    .option.selected {
      background: #e7dcc8;
      border-color: #b3926c;
      font-weight: 500;
    }
    .btn-group {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    button {
      background: #e3d5c0;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 2rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.95rem;
    }
    button:hover {
      background: #cfbea2;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .nav-btns {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      margin-top: 1rem;
    }
    .report-section {
      margin-bottom: 1.8rem;
    }
    .report-section h3 {
      font-size: 1.25rem;
      margin-bottom: 0.7rem;
    }
    .badge {
      background: #e4d5bb;
      padding: 0.2rem 0.8rem;
      border-radius: 1rem;
      font-size: 0.8rem;
      margin-left: 0.5rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
    }
    th, td {
      border: 1px solid #ddd4c4;
      padding: 0.5rem;
      text-align: center;
      font-size: 0.9rem;
    }
    th {
      background: #f5ede0;
    }
    hr {
      border: 0.5px solid #ddd4c4;
      margin: 1.5rem 0;

</head>

// ========== 计分引擎(S_drive) ==========
function scoreSdrive(answers, tagMode = false) {
  let S_pool = { O:0, V:0, D:0, E:0, T:0 };
  let N_pool = { PN:0, AN:0, RN:0, IN:0, MN:0, FN:0 };
  let F_pool = { Single_S:0, Dual_S:0, Single_N:0, Dual_N:0, Chaotic:0 };

  if (tagMode) {
    const tag = answers.tag;
    const s1 = tag.S1, s2 = tag.S2, n1 = tag.N1, n2 = tag.N2;
    S_pool[s1] = 10; S_pool[s2] = 6;
    N_pool[n1] = 10; N_pool[n2] = 6;
    F_pool.Dual_S = 3; F_pool.Dual_N = 3;
  } else {
    answers.sdrive.forEach(ans => {
      const q = QUIZ_DATA.sdrive.find(q => q.id === ans.id);
      if (!q) return;
      const opt = q.options[ans.selected];
      if (opt.engine) S_pool[opt.engine] += 2;
      if (opt.sandbox) N_pool[opt.sandbox] += 2;
      if (opt.topology) {
        for (let [k,v] of Object.entries(opt.topology)) {
          F_pool[k] = (F_pool[k]||0) + v * 2;
        }
      }
    });
  }

  const sortedS = Object.entries(S_pool).sort((a,b) => b[1]-a[1]);
  const S1 = sortedS[0][0], S2 = sortedS[1] ? sortedS[1][0] : null;
  const sortedN = Object.entries(N_pool).sort((a,b) => b[1]-a[1]);
  const N1 = sortedN[0][0], N2 = sortedN[1] ? sortedN[1][0] : null;

  const dualS = F_pool.Dual_S || 0, singleS = F_pool.Single_S || 0;
  const dualN = F_pool.Dual_N || 0, singleN = F_pool.Single_N || 0;
  const chaotic = F_pool.Chaotic || 0;

  let archetype, complexityLabel, complexityText;
  if (chaotic > dualS && chaotic > dualN && chaotic > singleS && chaotic > singleN) {
    archetype = 'Chaotic';
    complexityLabel = '潜能未定型';
    complexityText = '目前的系统尚未形成稳定的功耗结构，仍缺乏承重能力与持续做功的闭合机制。你正处于一种高能但散乱的叠加态，急需在现实中寻找到一个坚固的锚点。';
  } else {
    const activateS2 = (dualS >= singleS) && (dualS > chaotic);
    const activateN2 = (dualN >= singleN) && (dualN > chaotic);
    const sPart = activateS2 ? `${S1}+${S2}` : S1;
    const nPart = activateN2 ? `${N1}+${N2}` : N1;
    archetype = `${sPart} x ${nPart}`;
    if (!activateS2 && !activateN2) {
      complexityLabel = '深度穿透型'; complexityText = '专注于单一维度的单线击穿，抗干扰能力极强。你像一柄精准的手术刀，在选定的单点上实现极致的穿透与深度。';
    } else if (activateS2 && !activateN2) {
      complexityLabel = '专项攻坚型'; complexityText = '在单一领域内调动多重逻辑的厚度，适合处理重型高难度复杂项目。';
    } else if (!activateS2 && activateN2) {
      complexityLabel = '跨界串联型'; complexityText = '用一套底层逻辑打通多个现实场域，是天生的中台调度者与跨部门协调者。';
    } else {
      complexityLabel = '多维调度型'; complexityText = '具备同时处理异构任务的高阶算力，系统调度能力极强。但必须警惕极度耗能引发的系统性宕机。';
    }
  }

  const engineLabels = {
    O: 'O-金-收束（结构）', V: 'V-土-承载（锚定）', D: 'D-火-突破（动力）',
    E: 'E-水-漫延（扩张）', T: 'T-木-穿透（超越）'
  };
  const sandboxLabels = {
    PN: 'PN 物理底盘（硬件基座）', AN: 'AN 能力进化（单机OS）', RN: 'RN 深度连接（局域网）',
    IN: 'IN 社会舞台（广域网）', MN: 'MN 意义导航（统摄层）', FN: 'FN 系统运转（共识层）'
  };
  const engineDesc = {
    O: '你的一生都在追求秩序对混乱的物理统治。你不满足于简单的顺从，而是致力于亲手打造一个精密、可预测且严丝合缝的闭环世界。',
    V: '你是系统在动荡与变局中的最后支点。你重视历史连接与安全底座，守住那一分归属感与最后的安全防线。',
    D: '你拒绝平庸的温吞维持，生命力在强力的碰撞中才达到巅峰。擅长在僵局中制造剧烈的系统位移。',
    E: '你对已知的存量版图毫无眷恋，嗅觉永远锚定在未知的增量边界。持续扩大系统做功的吞吐量与影响力上限。',
    T: '你并不住在现成的规则里，你住在逻辑之上的云端。习惯抽离一切现实表象的约束，直击核心的第一性原理。'
  };
  const sandboxDesc = {
    PN: '你的力量必须降落在物理底盘上才能真正生效。你是一个现实世界的建造者，只在乎看得见、摸得着的物质安全与空间秩序。',
    AN: '你的力量必须降落在个人演化上才能真正生效。你将人生看作一场永不停歇的升级游戏。',
    RN: '你的力量必须降落于人际连接上才能真正生效。你的影响力通过他人的信任、回应与深度协作来传递。',
    IN: '你的力量必须降落在社会网络上才能真正生效。你擅长在错综复杂的社会洋流中导航。',
    MN: '你的力量必须降落在精神范式上才能真正生效。你是一个火种的守护者，在意义的高海拔地带做功。',
    FN: '你的力量必须降落在抽象架构上才能真正生效。你是一个逻辑的工程师，确保整个世界像钟表一样分秒不差地运行。'
  };

  // 心腹标签
  const confidantPriority = [
    { cond: (s) => [s.S1,s.S2].some(e=>e==='T'||e==='O') && [s.N1,s.N2].some(n=>['FN','MN','AN'].includes(n)), label: '谋臣型心腹', desc: '你最核心的价值在于提供超越现状的判断力，系统应当授予你全局诊断与长期战略规划的重权。' },
    { cond: (s) => s.S1==='O' && ![s.S2].some(e=>e==='T'||e==='D'||e==='E') && [s.N1,s.N2].some(n=>['FN','PN'].includes(n)), label: '守门型心腹', desc: '你是系统规则与底线的最后屏障，适合授权风控审计、合规审查与边界管理。' },
    { cond: (s) => [s.S1,s.S2].some(e=>e==='D'||e==='E') && [s.N1,s.N2].some(n=>['IN','PN'].includes(n)), label: '开疆型心腹', desc: '你是打破存量僵局的利刃，适合市场突破、资源置换与圈层扩张。' },
    { cond: (s) => s.S1==='V' || (s.S1==='O'&&s.S2==='V') || (s.S2==='V'&&s.S1==='O'), label: '维稳型心腹', desc: '你是系统抵御风险的防火墙，适合底盘维护、关系调停与风险兜底。' },
    { cond: (s) => [s.S1,s.S2].some(e=>e==='T'||e==='E') && [s.N1,s.N2].some(n=>['MN','IN','RN'].includes(n)), label: '布道型心腹', desc: '你是组织共识与影响力的构建核心，适合文化建设、愿景解释与外部影响力构建。' },
    { cond: (s) => [s.S1,s.S2].some(e=>e==='O'||e==='D') && [s.N1,s.N2].some(n=>['FN','AN','PN'].includes(n)), label: '执行型心腹', desc: '你是确保目标从概念转化为现实的关键，适合流程落地与交付闭环。' },
    { cond: (s) => s.S1==='D'||s.S2==='D', label: '破局型心腹', desc: '你是系统陷入僵死状态时的强行重启键，适合危机处理与改革推进。' },
    { cond: (s) => s.N1==='FN'||s.N2==='FN', label: '系统型心腹', desc: '你是组织机制的底层设计者，适合流程架构、系统搭建与知识体系建设。' },
    { cond: (s) => s.S1==='E'||s.S2==='E', label: '资源型心腹', desc: '你是系统与外部世界的连接器，适合商务拓展与资源整合。' },
    { cond: (s) => s.S1==='V'||s.S2==='V', label: '情感型心腹', desc: '你是组织温度与信任关系的维护者，适合员工关系与社群运营。' },
    { cond: () => true, label: '镜子型心腹', desc: '你是价值罗盘的校准者，适合深度复盘、理念咨询与精神陪伴。' }
  ];
  const sData = { S1, S2, N1, N2 };
  const confidant = confidantPriority.find(c => c.cond(sData));
  const careerDirection = (confidant.label === '谋臣型心腹') ? '战略、研究、咨询、架构、顶层设计' : 
    (confidant.label === '执行型心腹') ? '项目推进、流程落地、运营交付' : '根据心腹类型匹配';
  const typicalPositions = (confidant.label === '谋臣型心腹') ? '战略顾问、管理咨询、行业研究、产品战略、创始人参谋' : '根据类型匹配';
  const unsuitable = (confidant.label === '谋臣型心腹') ? '纯执行、强应酬、低信息透明、只背锅无决策权' : '根据类型匹配';

  return {
    S1, S2, N1, N2, archetype, complexityLabel, complexityText,
    S1_label: engineLabels[S1], S2_label: engineLabels[S2]||'',
    N1_label: sandboxLabels[N1], N2_label: sandboxLabels[N2]||'',
    S1_desc: engineDesc[S1], S2_desc: engineDesc[S2]||'',
    N1_desc: sandboxDesc[N1], N2_desc: sandboxDesc[N2]||'',
    confidant_label: confidant.label, confidant_desc: confidant.desc,
    careerDirection, typicalPositions, unsuitable,
    N_pool
  };
}

// ========== DE 计分 ==========
function scoreDE(answers) {
  const gardens = { PN: [], AN: [], RN: [], IN: [], MN: [], FN: [] };
  answers.forEach(a => {
    const q = QUIZ_DATA.de.find(q => q.id === a.id);
    if (q) gardens[q.sandbox].push(a.selected);
  });

  const rules = {
    PN: (q1,q2) => {
      if (q1==='A' && (q2==='A'||q2==='C')) return {label:'封闭/防御',energy:'节点断电',type:'节点断电'};
      if (q1==='B' && q2==='B') return {label:'未受损',energy:'畅通流转'};
      return {label:'中立/未觉察',energy:'未激活'};
    },
    AN: (q1,q2) => {
      if (q1==='A' && (q2==='A'||q2==='D')) return {label:'祛魅/自建',energy:'能量改道',type:'节点断电'};
      if (q1==='B' && q2==='B') return {label:'自建（无损）',energy:'能量改道（主动型）'};
      if (q1==='C' && q2!=='A') return {label:'中立/沿用',energy:'惯性流转'};
      if (q1==='C' && q2==='A') return {label:'不采用/未建立',energy:'悬置'};
      return {label:'中立/未觉察',energy:'未激活'};
    },
    RN: (q1,q2) => {
      if ((q1==='A'||q1==='B') && (q2==='A'||q2==='B')) return {label:'封闭/防御',energy:'节点断电',type:'节点断电'};
      if (q1==='C' && q2==='C') return {label:'未受损',energy:'畅通流转'};
      if (q1==='D' || q2==='D') return {label:'胶着/被困',energy:'短路循环'};
      if (q1==='E' && q2==='E') return {label:'一直回避',energy:'节点断电',type:'预设断电'};
      return {label:'中立/未觉察',energy:'未激活'};
    },
    IN: (q1,q2) => {
      if ((q1==='A'||q1==='B') && q2==='A') return {label:'封闭/防御',energy:'节点断电',type:'节点断电'};
      if (q1==='C' && q2==='C') return {label:'未受损',energy:'畅通流转'};
      if (q1==='D' || q2==='D') return {label:'胶着/被困',energy:'短路循环'};
      if (q1==='E' && q2==='E') return {label:'一直疏离',energy:'节点断电',type:'预设断电'};
      return {label:'中立/未觉察',energy:'未激活'};
    },
    MN: (q1,q2) => {
      if ((q1==='A'||q1==='B') && q2==='A') return {label:'祛魅/自建',energy:'能量改道',type:'节点断电'};
      if ((q1==='A'||q1==='B') && q2==='B') return {label:'不采用/未建立',energy:'悬置'};
      if ((q1==='A'||q1==='B') && q2==='C') return {label:'祛魅/自建',energy:'能量改道',type:'节点断电'};
      if (q1==='D' && q2==='D') return {label:'未受损',energy:'畅通流转'};
      if (q1==='D' && q2==='A') return {label:'未受损',energy:'畅通流转'};
      if (q1==='C' && q2==='C') return {label:'一直抽离',energy:'节点断电',type:'预设断电'};
      if (q1==='C' && q2!=='C') return {label:'不采用/未建立',energy:'悬置'};
      return {label:'中立/未觉察',energy:'未激活'};
    },
    FN: (q1,q2) => {
      if ((q1==='A'||q1==='B') && q2==='A') return {label:'祛魅/自建',energy:'能量改道',type:'节点断电'};
      if ((q1==='A'||q1==='B') && q2==='B') return {label:'祛魅/自建',energy:'能量改道',type:'节点断电'};
      if ((q1==='A'||q1==='B') && q2==='C') return {label:'不采用/未建立',energy:'悬置'};
      if (q1==='C' && (q2==='B'||q2==='A')) return {label:'自建（无损）',energy:'能量改道（主动型）'};
      if (q1==='C' && q2==='D') return {label:'未受损',energy:'畅通流转'};
      if (q1==='D' && (q2==='D'||q2==='E')) return {label:'中立/未启用',energy:'未激活'};
      if (q1==='E'||q2==='E') return {label:'中立/未启用',energy:'未激活'};
      return {label:'中立/未启用',energy:'未激活'};
    }
  };

  const result = {};
  for (let [sandbox, [q1,q2]] of Object.entries(gardens)) {
    result[sandbox] = rules[sandbox](q1,q2);
  }
  return result;
}

// ========== EF 计分 ==========
function scoreEF(answers) {
  const scores = { O:0, V:0, D:0, E:0, T:0 };
  answers.forEach(a => {
    const q = QUIZ_DATA.ef.find(q => q.id === a.id);
    if (q) scores[q.engine] += (a.selected + 1);
  });
  const stateMap = (s) => s>=17?'繁茂':s>=13?'生长':s>=8?'卷缩':'被掩埋';
  const wuxingMap = { O:'金', V:'土', D:'火', E:'水', T:'木' };
  const wuxingState = (s) => s>=17?'过旺':s>=13?'平衡':s>=8?'虚弱':'枯竭';
  
  const engines = {};
  for (let [k,v] of Object.entries(scores)) {
    engines[k] = { score: v, state: stateMap(v), wuxing: wuxingMap[k], wuxingState: wuxingState(v) };
  }

  // 五行生克
  const contradictions = [];
  const wuxingLabel = { O:'O-金-收束（结构）', V:'V-土-承载（锚定）', D:'D-火-突破（动力）', E:'E-水-漫延（扩张）', T:'T-木-穿透（超越）' };
  const keMap = { T:{V:'木克土'}, O:{T:'金克木'}, E:{D:'水克火'}, D:{O:'火克金'}, V:{E:'土克水'} };
  const shengMap = { T:{D:'木生火'}, D:{V:'火生土'}, V:{O:'土生金'}, O:{E:'金生水'}, E:{T:'水生木'} };

  const addContradiction = (type, label, text) => {
    if (contradictions.length < 5) contradictions.push({type, label, text});
  };

  // 相克
  for (let [k,v] of Object.entries(keMap)) {
    for (let [target, label] of Object.entries(v)) {
      const kState = engines[k]?.wuxingState, tState = engines[target]?.wuxingState;
      if (!kState || !tState) continue;
      if (kState==='过旺' && (tState==='虚弱'||tState==='枯竭')) {
        addContradiction('ke', label, `${wuxingLabel[k]}过旺，${wuxingLabel[target]}虚弱——${label}过度压制。`);
      } else if (kState==='过旺' && tState==='过旺') {
        addContradiction('ke', label, `${wuxingLabel[k]}与${wuxingLabel[target]}同时过旺，硬碰硬。`);
      } else if ((kState==='平衡') && (tState==='虚弱'||tState==='枯竭')) {
        addContradiction('ke', label, `${wuxingLabel[target]}本就虚弱，正常克制也会松动。`);
      } else if ((kState==='虚弱'||kState==='枯竭') && tState==='过旺') {
        addContradiction('ke', label, `${wuxingLabel[k]}虚弱，克制不住${wuxingLabel[target]}的过旺。`);
      }
    }
  }
  // 相生
  for (let [k,v] of Object.entries(shengMap)) {
    for (let [target, label] of Object.entries(v)) {
      const kState = engines[k]?.wuxingState, tState = engines[target]?.wuxingState;
      if (!kState || !tState) continue;
      if (kState==='过旺') {
        addContradiction('sheng', label, `${wuxingLabel[k]}过旺，过度滋养${wuxingLabel[target]}。`);
      } else if (kState==='平衡' && tState==='过旺') {
        addContradiction('sheng', label, `${wuxingLabel[k]}正常滋养被${wuxingLabel[target]}过旺吸走——滋养偏流。`);
      } else if (kState==='平衡' && (tState==='虚弱'||tState==='枯竭')) {
        addContradiction('sheng', label, `${wuxingLabel[target]}虚弱，${wuxingLabel[k]}正常滋养无法吸收。`);
      } else if ((kState==='虚弱'||kState==='枯竭')) {
        addContradiction('sheng', label, `${wuxingLabel[k]}虚弱，无法滋养${wuxingLabel[target]}。`);
      }
    }
  }

  // 熔断
  const allLow = Object.values(scores).every(s => s <= 12);
  let meltdown = null;
  if (allLow) {
    const maxEngine = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
    meltdown = { engine: maxEngine[0], score: maxEngine[1] };
  }

  let minimalAction = '';
  if (contradictions.length > 0) {
    const first = contradictions[0];
    if (first.label.includes('木克土')) minimalAction = '找一个你仍然感到安全的人或空间，确认自己还被接住，不悬空。';
    else if (first.label.includes('金克木')) minimalAction = '设定一个“够了”的信号，立刻停止思考，去做一件完全不需要脑力的事。';
    else if (first.label.includes('木生火')) minimalAction = '选一个积压的小阻力，用最低强度推一下，只要求感受到“能动”这个事实本身。';
    else if (first.label.includes('水生木')) minimalAction = '今天只找一个新的小信息，不要求行动，只要求注意到它存在。';
    else minimalAction = '暂停向过载引擎继续投喂任务，给颓废引擎一个微小刺激。';
  }

  return { engines, contradictions, meltdown, minimalAction, scores };
}

      '能量改道': 'FN 是你系统中资源最密集的节点。当其他通道资源被切断，园丁将它们集中运到了这片花园。这是一次被迫的降维。',
      '畅通流转': '你的 FN 在历史体验中未受明显冲击。遵守好的系统并从中受益。',
      '悬置': '你的 FN 处于悬置状态。曾对外部系统失望，但既未再信外部，也未自建。',
      '未激活': '你的 FN 上的资源流动从未被启动。'
    }
  };

  const sandboxNames = { PN:'物理底盘', AN:'能力进化', RN:'深度连接', IN:'社会舞台', MN:'意义导航', FN:'系统运转' };
  let deHTML = '';
  for (let sandbox of ['PN','AN','RN','IN','MN','FN']) {
    const d = de[sandbox];
    const text = gardenTexts[sandbox][d.energy] || '';
    if (text) {
      deHTML += `<div style="margin-bottom:1rem"><strong>${sandboxNames[sandbox]}——${d.energy}</strong><br>${text}</div>`;
      if (d.type==='节点断电') deHTML += `<em>让这片花园里的种子生长的资源，并没有消失——它被园丁改道，引灌到了另一个花园。</em><br>`;
      if (d.type==='预设断电') deHTML += `<em>此处并非创伤后的废墟，而是从未被点亮过的荒原。</em><br>`;
    }
  }

  // 跨域引灌
  const n1 = s.N1;
  const shutdownGardens = Object.entries(de).filter(([k,v])=>v.type==='节点断电').map(([k])=>k);
  if (shutdownGardens.length > 0 && de[n1]?.energy==='能量改道') {
    deHTML += `<div style="margin-top:1rem"><strong>资源改道：</strong>`;
    shutdownGardens.forEach(g => {
      if (g !== n1) deHTML += `当 ${sandboxNames[g]} 的信任被削弱，园丁将此处的资源改道，引灌至 ${sandboxNames[n1]}。`;
    });
    deHTML += `</div>`;
  }

  let efHTML = `<table><tr><th>引擎</th><th>分数</th><th>状态</th></tr>`;
  const efLabels = { O:'O-金-收束（结构）', V:'V-土-承载（锚定）', D:'D-火-突破（动力）', E:'E-水-漫延（扩张）', T:'T-木-穿透（超越）' };
  for (let [k,v] of Object.entries(ef.engines)) {
    efHTML += `<tr><td>${efLabels[k]}</td><td>${v.score}</td><td>${v.state}</td></tr>`;
  }
  efHTML += `</table>`;

  let contradictionsHTML = '';
  ef.contradictions.forEach(c => {
    contradictionsHTML += `<p><strong>${c.label}：</strong>${c.text}</p>`;
  });

  let stitchingHTML = '';
  if (shutdownGardens.length > 0) {
    const S1_response = { T:'用追问穿透痛苦，用结构收束混乱', O:'用规则划清边界，用闭环锁住失控', D:'用行动冲破阻力', V:'用守护维系底线', E:'用突围绕过关卡' };
    const S1_tool = { T:'“为什么”是你最信任的追问工具，“自己建”是你最依赖的结构路径', O:'“边界线”是你最信任的防御工具', D:'“冲过去”是你最信任的破局工具', V:'“留下来”是你最信任的守护动作', E:'“绕过去”是你最信任的突围策略' };
    const N1_action = { FN:'系统搭建、逻辑追问、结构设计', PN:'身体管理、资源调度', AN:'技能积累、路径搭建', RN:'关系经营、信任维护', IN:'人脉拓展、话语权构建', MN:'信念重构、价值输出' };
    stitchingHTML = `
      <hr><h3>🔗 因果缝合：从身份到代偿到矛盾</h3>
      <p>这一切的起点，是你的 ${s.S1_label}。你习惯用${s.S1_desc?.split('。')[0]||''}——作为应对世界的主要方式。当 ${shutdownGardens.map(g=>sandboxNames[g]).join('、')} 遭遇历史冲击时，你没有选择修补那些花园，而是动用了你最擅长的手段：${S1_response[s.S1]||''}。${S1_tool[s.S1]||''}。你没有错——这是你的引擎配置在当时能做的最优解。</p>
      <p>你的主沙盒是 ${s.N1_label}，这里是你的力量最密集的节点。当那些花园的信任被历史事件切断，园丁将所有的生长需求改道，集中引灌至 ${s.N1_label?.split(' ')[0]||''}。你在 ${N1_action[s.N1]||''} 上的繁茂，不是偶然的天赋，而是资源退守后形成的代偿性繁茂。</p>
    `;
  }

  const reportHTML = `
    <h2>📋 人格深度报告</h2>
    <div class="report-section">
      <h3>🧭 一、核心身份</h3>
      <p><strong>主引擎：</strong>${s.S1_label}<br>${s.S1_desc}</p>
      ${s.S2_label ? `<p><strong>副引擎：</strong>${s.S2_label}<br>${s.S2_desc}</p>` : ''}
      <p><strong>主战场：</strong>${s.N1_label}<br>${s.N1_desc}</p>
      ${s.N2_label ? `<p><strong>副战场：</strong>${s.N2_label}<br>${s.N2_desc}</p>` : ''}
      <p><strong>思维风格：</strong>${s.archetype}｜${s.complexityLabel}<br>${s.complexityText}</p>
      <p><strong>协作角色：</strong>${s.confidant_label}<br>${s.confidant_desc}</p>
      <p><strong>职业方向：</strong>${s.careerDirection}<br>典型岗位：${s.typicalPositions}<br>不适合：${s.unsuitable}</p>
    </div>
    <div class="report-section">
      <h3>🌱 二、六片沙盒花园</h3>
      ${deHTML}
    </div>
    <div class="report-section">
      <h3>🎍 三、五颗引擎种子</h3>
      ${efHTML}
    </div>
    <div class="report-section">
      <h3>⚡ 四、引擎间的生克矛盾</h3>
      ${contradictionsHTML}
      ${ef.minimalAction ? `<p><strong>🌊 最小破局动作：</strong>${ef.minimalAction}</p>` : ''}
    </div>
    ${stitchingHTML}
    <div style="margin-top:2rem; text-align:center;">
      <button onclick="location.reload()">重新测试</button>
    </div>
  `;
  renderApp(reportHTML);
}

// ========== 启动 ==========
renderPrecheck();
</script>
</body>
</html>
