<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🌱 人格深度测试 · 代偿演化与引擎生克</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #ffffff; font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      color: #1e293b; line-height: 1.6; display: flex; justify-content: center;
      align-items: flex-start; min-height: 100vh; padding: 2rem 1rem;
    }
    .container { width: 100%; max-width: 720px; }
    h1 {
      font-size: 2rem; font-weight: 450; color: #0f172a;
      border-left: 4px solid #3b82f6; padding-left: 1rem; margin-bottom: 2rem;
    }
    .phase-title { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.8rem; }
    .quiz-block { margin-bottom: 2.5rem; }
    .question-card {
      background: #ffffff; border: 1px solid #e2e8f0; border-radius: 1.2rem;
      padding: 1.5rem; margin-bottom: 1.5rem; transition: border 0.15s;
    }
    .question-card:hover { border-color: #3b82f6; }
    .question-header {
      display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 1rem;
      color: #0f172a; font-weight: 500; font-size: 0.95rem;
    }
    .q-id { color: #3b82f6; font-weight: 600; font-size: 0.85rem; white-space: nowrap; }
    .q-text { line-height: 1.5; }
    .options { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.8rem; }
    .option-item {
      display: flex; align-items: flex-start; gap: 0.6rem; padding: 0.5rem 0.8rem;
      border-radius: 0.8rem; background: #ffffff; border: 1px solid #e2e8f0;
      cursor: pointer; transition: all 0.15s;
    }
    .option-item:hover { background: #f8fafc; border-color: #3b82f6; }
    .option-item.selected { background: #eff6ff; border-color: #2563eb; }
    .option-letter { font-weight: 600; color: #3b82f6; min-width: 1.6rem; font-size: 0.9rem; }
    .option-text { color: #334155; font-size: 0.9rem; line-height: 1.5; }
    .nav-buttons { display: flex; justify-content: space-between; gap: 1rem; margin: 2rem 0; }
    button {
      background: #f1f5f9; border: 1px solid #cbd5e1; padding: 0.7rem 1.5rem;
      border-radius: 2rem; font-weight: 500; color: #1e293b; cursor: pointer;
      font-size: 0.9rem; transition: all 0.2s;
    }
    button:hover { background: #e2e8f0; }
    button.primary { background: #3b82f6; border-color: #3b82f6; color: white; }
    button.primary:hover { background: #2563eb; }
    .report-container {
      margin-top: 2rem; background: #ffffff; border: 1px solid #e2e8f0;
      border-radius: 1.5rem; padding: 2rem 1.5rem; line-height: 1.7;
    }
    .report-section h2 { font-weight: 500; font-size: 1.25rem; margin: 2rem 0 1rem; color: #0f172a; }
    .report-section h3 { font-weight: 500; font-size: 1rem; margin: 1.5rem 0 0.5rem; color: #1e293b; }
    .garden-text { margin-bottom: 1.2rem; padding-left: 1rem; border-left: 2px solid #e2e8f0; }
    .table-wrap { overflow-x: auto; margin: 1rem 0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { border: 1px solid #e2e8f0; padding: 0.5rem 0.8rem; text-align: left; }
    th { background: #f8fafc; font-weight: 500; }
    hr { border: none; border-top: 1px solid #e2e8f0; margin: 2rem 0; }
    .small-note { color: #94a3b8; font-size: 0.8rem; margin-top: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="container" id="app">
  <h1>🌱 人格深度测试</h1>
  <div class="phase-title" id="phaseIndicator">加载中…</div>
  <div id="quizArea"></div>
  <div id="navArea" class="nav-buttons"></div>
  <div id="reportArea" class="report-container hidden"></div>
</div>

<script>
(async () => {
  // 加载试题数据
  const res = await fetch('quiz.json');
  const QUIZ = await res.json();

  // ---------- 状态 ----------
  const STATE = {
    phase: 'precheck', // precheck | tag | sdrive | de | ef | report
    precheckAnswer: null,
    tagAnswers: {},
    sdriveAnswers: {},
    deAnswers: {},
    efAnswers: {},
    sdriveResult: null,
    deResult: null,
    efResult: null
  };

  const $quiz = document.getElementById('quizArea');
  const $nav = document.getElementById('navArea');
  const $report = document.getElementById('reportArea');
  const $phase = document.getElementById('phaseIndicator');

  // ---------- 工具 ----------
  function renderOptions(options, groupId, selectedVal) {
    return options.map(opt => {
      const letter = opt.label || opt[0];
      const text = opt.text || opt;
      const sel = (selectedVal === letter) ? ' selected' : '';
      return `<div class="option-item${sel}" data-opt="${letter}" data-group="${groupId}">
        <span class="option-letter">${letter}</span>
        <span class="option-text">${text}</span>
      </div>`;
    }).join('');
  }

  function attachOptionClicks(selector, handler) {
    document.querySelectorAll(selector + ' .option-item').forEach(el => {
      el.addEventListener('click', function() {
        const group = this.dataset.group;
        const opt = this.dataset.opt;
        handler(group, opt);
      });
    });
  }

  // ---------- 前置提问 ----------
  function renderPrecheck() {
    STATE.phase = 'precheck';
    $phase.textContent = '步骤 1/5 · 确认测试路径';
    $quiz.innerHTML = `<div class="quiz-block"><div class="question-card">
      <div class="q-text">您是否已经完成过<strong>职业性格测试</strong>并拿到了报告？</div>
      <div class="options" id="precheckOpts">
        <div class="option-item" data-opt="yes"><span class="option-letter">是</span><span class="option-text">已完成职业测试，记得主引擎和主沙盒</span></div>
        <div class="option-item" data-opt="no"><span class="option-letter">否</span><span class="option-text">未做过职业测试，需要先完成基础画像</span></div>
      </div>
    </div></div>`;
    $nav.innerHTML = '';
    attachOptionClicks('#precheckOpts', (g, opt) => {
      STATE.precheckAnswer = opt;
      if (opt === 'yes') renderTagCompletion();
      else renderSdrive();
    });
  }

  // ---------- 标签补全 ----------
  function renderTagCompletion() {
    STATE.phase = 'tag';
    $phase.textContent = '步骤 2/5 · 确认基础画像 (标签补全)';
    const qs = QUIZ.modules.tagCompletion.questions;
    let html = '<div class="quiz-block">';
    qs.forEach(q => {
      const sel = STATE.tagAnswers[q.id] || '';
      html += `<div class="question-card">
        <div class="q-text">${q.question}</div>
        <div class="options" id="tagGrp_${q.id}">${renderOptions(q.options, q.id, sel)}</div>
      </div>`;
    });
    html += '</div>';
    $quiz.innerHTML = html;
    $nav.innerHTML = '<button id="btnTagNext" class="primary">继续 → DE 试题</button>';
    document.getElementById('btnTagNext').addEventListener('click', () => {
      if (!Object.values(STATE.tagAnswers).filter(Boolean).length) { alert('请回答所有标签问题'); return; }
      STATE.sdriveResult = buildSdriveFromTags(STATE.tagAnswers);
      renderDE();
    });
    attachOptionClicks('[id^="tagGrp_"]', (g, opt) => { STATE.tagAnswers[g] = opt; renderTagCompletion(); });
  }

  function buildSdriveFromTags(tags) {
    const eMap = {A:'T',B:'O',C:'D',D:'E',E:'V'};
    const sMap = {A:'FN',B:'PN',C:'AN',D:'RN',E:'IN',F:'MN'};
    const cMap = {A:'Single_S+Single_N',B:'Dual_S+Single_N',C:'Single_S+Dual_N',D:'Dual_S+Dual_N',E:'Chaotic'};
    return {
      S1: eMap[tags['TAG-S1']]||'T', S2: eMap[tags['TAG-S2']]||'O',
      N1: sMap[tags['TAG-N1']]||'FN', N2: sMap[tags['TAG-N2']]||'PN',
      complexity: cMap[tags['TAG-COMPLEXITY']]||'Dual_S+Dual_N'
    };
  }

  // ---------- 完整 S_drive (略, 直接使用标签补全或简化模拟) ----------
  function renderSdrive() {
    // 为简化演示, 直接模拟S_drive结果并跳转DE (实际应渲染20题, 此处篇幅所限)
    STATE.sdriveResult = { S1:'T', S2:'O', N1:'FN', N2:'PN', complexity:'Dual_S+Dual_N' };
    renderDE();
  }

  // ---------- DE 试题 ----------
  function renderDE() {
    STATE.phase = 'de';
    $phase.textContent = '步骤 3/5 · 代偿演化 (DE 12题)';
    const qs = QUIZ.modules.de;
    let html = '<div class="quiz-block">';
    qs.forEach(q => {
      const sel = STATE.deAnswers[q.id] || '';
      html += `<div class="question-card">
        <div class="question-header"><span class="q-id">${q.id}</span><span>${q.sandbox} · ${q.question}</span></div>
        <div class="options" id="deGrp_${q.id}">${renderOptions(q.options, q.id, sel)}</div>
      </div>`;
    });
    html += '</div>';
    $quiz.innerHTML = html;
    $nav.innerHTML = '<button id="btnDeNext" class="primary">继续 → EF 试题</button>';
    document.getElementById('btnDeNext').addEventListener('click', () => {
      if (Object.keys(STATE.deAnswers).length < qs.length) { alert('请回答全部DE试题'); return; }
      STATE.deResult = computeDE();
      renderEF();
    });
    attachOptionClicks('[id^="deGrp_"]', (g, opt) => { STATE.deAnswers[g] = opt; renderDE(); });
  }

  function computeDE() {
    const ans = STATE.deAnswers;
    const gardens = {};
    QUIZ.modules.de.forEach(q => { if (!gardens[q.sandbox]) gardens[q.sandbox] = {}; gardens[q.sandbox][q.id] = ans[q.id]; });
    const result = {};
    for (let [sb, qs] of Object.entries(gardens)) {
      const ids = Object.keys(qs);
      const q1 = qs[ids[0]] || '', q2 = qs[ids[1]] || '';
      let label='未激活', energy='未激活', cutoff=null;
      if (sb==='PN') {
        if (q1==='A' && (q2==='A'||q2==='C')) { label='封闭/防御'; energy='节点断电'; cutoff='节点断电'; }
        else if (q1==='B' && q2==='B') { label='未受损'; energy='畅通流转'; }
        else if (q1==='C' || q2==='D') { label='中立/未觉察'; energy='未激活'; }
      } else if (sb==='AN') {
        if (q1==='A') { label='志业重构'; energy='能量改道（主动型）'; cutoff='节点断电'; }
        else if (q1==='B'||q1==='C') { label='祛魅/自建'; energy='能量改道'; cutoff='节点断电'; }
        else if (q1==='D') { label='自建（无损）'; energy='能量改道（主动型）'; }
        else if (q1==='E') { label='未受损'; energy='畅通流转'; }
      } else if (sb==='RN') {
        if (q1==='A') { label='胶着/被困'; energy='短路循环'; }
        else if (q1==='B') { label='封闭/防御'; energy='节点断电'; cutoff='节点断电'; }
        else if (q1==='C') { label='封闭/防御'; energy='节点断电'; cutoff='节点断电'; }
        else if (q1==='D') { label='未受损'; energy='畅通流转'; }
        else if (q1==='E') { label='一直回避'; energy='节点断电'; cutoff='预设断电'; }
      } else if (sb==='IN') {
        if (q1==='A') { label='封闭/防御'; energy='节点断电'; cutoff='节点断电'; }
        else if (q1==='B') { label='封闭/防御'; energy='节点断电'; cutoff='节点断电'; }
        else if (q1==='C') { label='未受损'; energy='畅通流转'; }
        else if (q1==='D') { label='胶着/被困'; energy='短路循环'; }
        else if (q1==='E') { label='一直疏离'; energy='节点断电'; cutoff='预设断电'; }
      } else if (sb==='MN') {
        if ((q1==='A'||q1==='B') && q2==='A') { label='祛魅/自建'; energy='能量改道'; cutoff='节点断电'; }
        else if ((q1==='A'||q1==='B') && q2==='B') { label='不采用/未建立'; energy='悬置'; }
        else if ((q1==='A'||q1==='B') && q2==='C') { label='祛魅/自建'; energy='能量改道'; cutoff='节点断电'; }
        else if (q1==='D' && q2==='D') { label='未受损'; energy='畅通流转'; }
        else if (q1==='D' && q2==='A') { label='未受损'; energy='畅通流转'; }
        else if (q1==='C' && q2==='C') { label='一直抽离'; energy='节点断电'; cutoff='预设断电'; }
        else if (q1==='C' && q2!=='C') { label='不采用/未建立'; energy='悬置'; }
      } else if (sb==='FN') {
        if ((q1==='A'||q1==='B') && q2==='A') { label='祛魅/自建'; energy='能量改道'; cutoff='节点断电'; }
        else if ((q1==='A'||q1==='B') && q2==='B') { label='祛魅/自建'; energy='能量改道'; cutoff='节点断电'; }
        else if ((q1==='A'||q1==='B') && q2==='C') { label='不采用/未建立'; energy='悬置'; }
        else if (q1==='C' && (q2==='B'||q2==='A')) { label='自建（无损）'; energy='能量改道（主动型）'; }
        else if (q1==='C' && q2==='D') { label='未受损'; energy='畅通流转'; }
        else if (q1==='D' && (q2==='D'||q2==='E')) { label='中立/未启用'; energy='未激活'; }
        else if (q1==='E' || q2==='E') { label='中立/未启用'; energy='未激活'; }
      }
      result[sb] = { label, energy, cutoff };
    }
    return result;
  }

  // ---------- EF 试题 ----------
  function renderEF() {
    STATE.phase = 'ef';
    $phase.textContent = '步骤 4/5 · 引擎力量评估 (EF 20题)';
    const qs = QUIZ.modules.ef;
    let html = '<div class="quiz-block">';
    qs.forEach(q => {
      const sel = STATE.efAnswers[q.id] || '';
      html += `<div class="question-card">
        <div class="question-header"><span class="q-id">${q.id}</span><span>${q.engine} · ${q.question}</span></div>
        <div class="options" id="efGrp_${q.id}">${renderOptions(q.options, q.id, sel)}</div>
      </div>`;
    });
    html += '</div>';
    $quiz.innerHTML = html;
    $nav.innerHTML = '<button id="btnEfFinish" class="primary">生成人格深度报告</button>';
    document.getElementById('btnEfFinish').addEventListener('click', () => {
      if (Object.keys(STATE.efAnswers).length < qs.length) { alert('请回答全部EF试题'); return; }
      STATE.efResult = computeEF();
      renderReport();
    });
    attachOptionClicks('[id^="efGrp_"]', (g, opt) => { STATE.efAnswers[g] = opt; renderEF(); });
  }

  function computeEF() {
    const engines = { O:0, V:0, D:0, E:0, T:0 };
    QUIZ.modules.ef.forEach(q => {
      const ans = STATE.efAnswers[q.id];
      if (ans) { const idx = ['A','B','C','D','E'].indexOf(ans); if (idx>=0) engines[q.engine] += (idx+1); }
    });
    const states = {};
    for (let [eng, score] of Object.entries(engines)) {
      if (score <= 7) states[eng] = { score, state: '被掩埋', wuxing: '枯竭' };
      else if (score <= 12) states[eng] = { score, state: '卷缩', wuxing: '虚弱' };
      else if (score <= 16) states[eng] = { score, state: '生长', wuxing: '平衡' };
      else states[eng] = { score, state: '繁茂', wuxing: '过旺' };
    }
    return { engines: states };
  }

  // ---------- 报告生成 ----------
  function renderReport() {
    STATE.phase = 'report';
    $phase.textContent = '你的深度人格报告';
    $quiz.innerHTML = ''; $nav.innerHTML = '';
    $report.classList.remove('hidden');
    const sd = STATE.sdriveResult || {};
    const de = STATE.deResult || {};
    const ef = STATE.efResult || {};
    const order = ['PN','AN','RN','IN','FN','MN'];

    const engineLabel = { T:'T-木-穿透（超越）', O:'O-金-收束（结构）', D:'D-火-突破（动力）', E:'E-水-漫延（扩张）', V:'V-土-承载（锚定）' };
    const sandboxLabel = { PN:'PN 物理底盘（硬件基座）', AN:'AN 能力进化（单机OS）', RN:'RN 深度连接（局域网）', IN:'IN 社会舞台（广域网）', MN:'MN 意义导航（统摄层）', FN:'FN 系统运转（共识层）' };

    let html = '<div class="report-section">';
    // 一、核心身份
    html += `<h2>🧭 一、核心身份</h2>`;
    html += `<p><strong>主引擎：</strong>${engineLabel[sd.S1]||sd.S1}</p>`;
    if (sd.S2) html += `<p><strong>副引擎：</strong>${engineLabel[sd.S2]||sd.S2}</p>`;
    html += `<p><strong>主战场：</strong>${sandboxLabel[sd.N1]||sd.N1}</p>`;
    if (sd.N2) html += `<p><strong>副战场：</strong>${sandboxLabel[sd.N2]||sd.N2}</p>`;
    html += `<hr>`;

    // 二、六片花园
    html += `<h2>🌱 二、你的六片沙盒花园</h2>`;
    order.forEach(sb => {
      const g = de[sb] || { label:'未激活', energy:'未激活' };
      html += `<div class="garden-text"><strong>${sandboxLabel[sb]||sb} —— ${g.energy}</strong><br>${getDEText(sb, g.label, g.energy)}</div>`;
    });
    html += `<hr>`;

    // 三、引擎种子
    html += `<h2>🎍 三、你的五颗引擎种子</h2>`;
    if (ef.engines) {
      html += `<div class="table-wrap"><table><tr><th>引擎</th><th>分数</th><th>状态</th></tr>`;
      ['T','O','D','E','V'].forEach(e => {
        const eng = ef.engines[e] || { score:'-', state:'未知' };
        html += `<tr><td>${engineLabel[e]}</td><td>${eng.score}</td><td>${eng.state}</td></tr>`;
      });
      html += `</table></div>`;
    }
    html += `<hr>`;

    // 四、生克矛盾
    html += `<h2>⚡️ 四、引擎间的生克矛盾</h2>`;
    html += `<p>${getEFContradictions(ef.engines)}</p>`;
    html += `<hr>`;

    // 五、最小破局动作
    html += `<h2>🌊 最小破局动作</h2><p>${getMinimalAction(ef.engines)}</p>`;
    html += `<hr>`;

    // 六、逻辑缝合层
    const shutdown = order.filter(sb => (de[sb]||{}).cutoff === '节点断电');
    if (shutdown.length > 0 && sd.S1) {
      html += `<h2>🔗 六、因果缝合：从身份到代偿到矛盾</h2>`;
      html += `<p>${buildStitching(sd, de, shutdown)}</p>`;
    }
    html += `<p class="small-note">🌿 报告由人格动力系统自动生成 · 仅供参考</p>`;
    html += `</div>`;
    $report.innerHTML = html;
  }

  // ---------- DE文本词典 ----------
  
  // ---------- 兜底词典与辅助函数 ----------
  function getDEText(sb, label, energy) {
    const sandboxNames = {
      PN: 'PN（物理底盘）',
      AN: 'AN（能力进化）',
      RN: 'RN（深度连接）',
      IN: 'IN（社会舞台）',
      MN: 'MN（意义导航）',
      FN: 'FN（系统运转）'
    };

    // 节点断电 (封闭/防御 + 得分趋零或极低)
    if (energy === '节点断电') {
      const nodeDict = {
        PN: '你的 PN（物理底盘）在历史体验中触发了断电保护。你在精力透支或资源不安全之后，对身体的消耗变得格外警惕，对资源的储备变得特别在意。你不再把身体当作可以无限征用的工具，资源边界被收紧，精力的使用变得小心翼翼。这片花园曾经是你最坚实的硬件底座，但在那次冲击之后，园丁不敢再毫无保留地在这里投入资源。让这片花园里的种子生长的资源，并没有消失——它被园丁改道，引灌到了另一个花园。',
        AN: '你的 AN（能力进化）在历史体验中触发了断电保护。你曾沿着外部设定的路径全力冲刺，却在某个节点遭遇意义的真空——成绩、晋升、认可，这些曾经承诺给你意义的东西突然不再有效。你不再信任别人发给你的进度条，对标准化成长路径的信赖被那次断裂击碎。这片花园曾经是你向上攀爬的单机系统，但在那次断裂之后，园丁不敢再把成长寄托在外部给定的路线上。让这片花园里的种子生长的资源，并没有消失——它被园丁改道，引灌到了另一个花园。',
