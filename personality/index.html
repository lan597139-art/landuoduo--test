<body>
<div class="container" id="app">
  <h1>🌱 人格深度测试</h1>
  <div class="subtitle" id="progressArea">加载中…</div>
  <div id="dynamicContent"></div>
  <div id="reportContainer" style="display:none;"></div>
  <div class="nav-buttons" id="navButtons" style="display:none;"></div>
</div>

<script>
  (async function() {
    // ---------- 加载试题数据 ----------
    const quizRes = await fetch('personality/quiz.json');
    const quizData = await quizRes.json();

    // ---------- 全局状态 ----------
    const STATE = {
      phase: 'precheck', // precheck | tagCompletion | sdrive | de | ef | report
      precheckAnswer: null,
      tagAnswers: {},
      sdriveAnswers: {},
      deAnswers: {},
      efAnswers: {},
      // 最终计算结果
      sdriveResult: null,
      deResult: null,
      efResult: null,
      stitchingResult: null
    };

    const $dynamic = document.getElementById('dynamicContent');
    const $report = document.getElementById('reportContainer');
    const $progress = document.getElementById('progressArea');
    const $nav = document.getElementById('navButtons');

    // ---------- 工具函数 ----------
    function renderOptions(options, groupId, selectedValue, clickHandler) {
      return options.map(opt => {
        const letter = opt.label || opt[0];
        const text = opt.text || opt;
        const selected = (selectedValue === letter) ? 'selected' : '';
        return `
          <div class="option-item ${selected}" data-option="${letter}" data-group="${groupId}">
            <span class="option-letter">${letter}</span>
            <span class="option-text">${text}</span>
          </div>
        `;
      }).join('');
    }

    function attachOptionEvents(containerSelector, handler) {
      document.querySelectorAll(containerSelector + ' .option-item').forEach(el => {
        el.addEventListener('click', function(e) {
          const group = this.dataset.group;
          const option = this.dataset.option;
          handler(group, option, this);
        });
      });
    }

    // ---------- 前置提问页 ----------
    function renderPrecheck() {
      STATE.phase = 'precheck';
      $progress.textContent = '步骤 1/5 · 确认测试路径';
      $dynamic.innerHTML = `
        <div class="quiz-block">
          <div class="question-card">
            <div class="question-text">您是否已经完成过<strong>职业性格测试</strong>并拿到了报告？</div>
            <div class="options" id="precheckOptions">
              <div class="option-item" data-option="yes"><span class="option-letter">是</span><span class="option-text">我已经完成职业性格测试，记得我的主引擎和主沙盒</span></div>
              <div class="option-item" data-option="no"><span class="option-letter">否</span><span class="option-text">我还没有做过职业性格测试，需要先完成基础画像</span></div>
            </div>
          </div>
        </div>
      `;
      $nav.style.display = 'none';
      $report.style.display = 'none';
      attachOptionEvents('#precheckOptions', (group, option) => {
        STATE.precheckAnswer = option;
        if (option === 'yes') {
          renderTagCompletion();
        } else {
          renderSdriveFull();
        }
      });
    }

    // ---------- 标签补全页 ----------
    function renderTagCompletion() {
      STATE.phase = 'tagCompletion';
      $progress.textContent = '步骤 2/5 · 确认你的基础画像 (标签补全)';
      const questions = quizData.modules.tagCompletion.questions;
      let html = '<div class="quiz-block">';
      questions.forEach((q, idx) => {
        const selected = STATE.tagAnswers[q.id] || '';
        html += `
          <div class="question-card">
            <div class="question-text">${q.question}</div>
            <div class="options" id="tagGroup_${q.id}">
              ${renderOptions(q.options, q.id, selected)}
            </div>
          </div>
        `;
      });
      html += '</div>';
      $dynamic.innerHTML = html;
      $report.style.display = 'none';
      $nav.style.display = 'flex';
      $nav.innerHTML = `<button id="btnTagNext" class="primary">继续 → DE 试题</button>`;
      document.getElementById('btnTagNext').addEventListener('click', () => {
        const allAnswered = questions.every(q => STATE.tagAnswers[q.id]);
        if (!allAnswered) {
          alert('请回答所有标签问题后再继续。');
          return;
        }
        const sdriveSim = buildSdriveFromTags(STATE.tagAnswers);
        STATE.sdriveResult = sdriveSim;
        renderDE();
      });
      attachOptionEvents('[id^="tagGroup_"]', (groupId, option) => {
        STATE.tagAnswers[groupId] = option;
        renderTagCompletion();
      });
    }

    function buildSdriveFromTags(tagAnswers) {
      const mapEngine = { A:'T', B:'O', C:'D', D:'E', E:'V' };
      const mapSandbox = { A:'FN', B:'PN', C:'AN', D:'RN', E:'IN', F:'MN' };
      const mapComplexity = { A:'Single_S+Single_N', B:'Dual_S+Single_N', C:'Single_S+Dual_N', D:'Dual_S+Dual_N', E:'Chaotic' };
      const s1 = mapEngine[tagAnswers['TAG-S1']] || 'T';
      const s2 = mapEngine[tagAnswers['TAG-S2']] || 'O';
      const n1 = mapSandbox[tagAnswers['TAG-N1']] || 'FN';
      const n2 = mapSandbox[tagAnswers['TAG-N2']] || 'PN';
      const complexityKey = mapComplexity[tagAnswers['TAG-COMPLEXITY']] || 'Dual_S+Dual_N';
      return { S1: s1, S2: s2, N1: n1, N2: n2, complexity: complexityKey };
    }

    // ---------- 完整 S_drive 试题 ----------
    function renderSdriveFull() {
      STATE.phase = 'sdrive';
      $progress.textContent = '步骤 2/5 · 基础人格画像 (S-Drive 20题)';
      const questions = quizData.modules.sdrive;
      let html = '<div class="quiz-block">';
      questions.forEach((q, idx) => {
        const selected = STATE.sdriveAnswers[q.id] || '';
        html += `
          <div class="question-card">
            <div class="question-text">${q.id}｜${q.question}</div>
            <div class="options" id="sdGroup_${q.id}">
              ${renderOptions(q.options, q.id, selected)}
            </div>
          </div>
        `;
      });
      html += '</div>';
      $dynamic.innerHTML = html;
      $report.style.display = 'none';
      $nav.style.display = 'flex';
      $nav.innerHTML = `<button id="btnSdriveNext" class="primary">继续 → DE 试题</button>`;
      document.getElementById('btnSdriveNext').addEventListener('click', () => {
        const allDone = questions.every(q => STATE.sdriveAnswers[q.id]);
        if (!allDone) {
          alert('请回答全部20道S-Drive试题。');
          return;
        }
        STATE.sdriveResult = computeSdrive(STATE.sdriveAnswers, questions);
        renderDE();
      });
      attachOptionEvents('[id^="sdGroup_"]', (groupId, option) => {
        STATE.sdriveAnswers[groupId] = option;
        renderSdriveFull();
      });
    }

    function computeSdrive(answers, questions) {
      const S_pool = { O:0, V:0, D:0, E:0, T:0 };
      const N_pool = { PN:0, AN:0, RN:0, IN:0, MN:0, FN:0 };
      const F_pool = { Single_S:0, Dual_S:0, Single_N:0, Dual_N:0, Chaotic:0 };
      questions.forEach(q => {
        const ans = answers[q.id];
        if (!ans) return;
        if (q.options[0].hasOwnProperty('engine')) {
          const selected = q.options.find(o => o.label === ans);
          if (selected && selected.engine) S_pool[selected.engine] += 2;
        }
        if (q.options[0].hasOwnProperty('sandbox')) {
          const selected = q.options.find(o => o.label === ans);
          if (selected && selected.sandbox) N_pool[selected.sandbox] += 2;
        }
        if (q.options[0].hasOwnProperty('topology')) {
          const selected = q.options.find(o => o.label === ans);
          if (selected && selected.topology) {
            for (let [k,v] of Object.entries(selected.topology)) {
              if (k === 'single_S') F_pool.Single_S += v*2;
              else if (k === 'dual_S') F_pool.Dual_S += v*2;
              else if (k === 'single_N') F_pool.Single_N += v*2;
              else if (k === 'dual_N') F_pool.Dual_N += v*2;
              else if (k === 'chaotic') F_pool.Chaotic += v*2;
            }
          }
        }
      });
      const sortedS = Object.entries(S_pool).sort((a,b) => b[1]-a[1]);
      const S1 = sortedS[0][0];
      const S2 = sortedS[1] ? sortedS[1][0] : null;
      const sortedN = Object.entries(N_pool).sort((a,b) => b[1]-a[1]);
      const N1 = sortedN[0][0];
      const N2 = sortedN[1] ? sortedN[1][0] : null;
      const dualS = F_pool.Dual_S >= F_pool.Single_S && F_pool.Dual_S > F_pool.Chaotic;
      const dualN = F_pool.Dual_N >= F_pool.Single_N && F_pool.Dual_N > F_pool.Chaotic;
      const chaotic = (F_pool.Chaotic === Math.max(...Object.values(F_pool))) && (Object.values(F_pool).filter(v=>v===F_pool.Chaotic).length===1);
      let archetype = chaotic ? 'Chaotic' : `${dualS?S1+'+'+S2:S1} x ${dualN?N1+'+'+N2:N1}`;
      return { S1, S2: dualS?S2:null, N1, N2: dualN?N2:null, archetype, N_pool, S_pool };
    }

    // ---------- DE 试题 ----------
    function renderDE() {
      STATE.phase = 'de';
      $progress.textContent = '步骤 3/5 · 代偿演化 (DE 12题)';
      const questions = quizData.modules.de;
      let html = '<div class="quiz-block">';
      questions.forEach(q => {
        const selected = STATE.deAnswers[q.id] || '';
        html += `
          <div class="question-card">
            <div class="question-text">${q.id}｜${q.sandbox} · ${q.question}</div>
            <div class="options" id="deGroup_${q.id}">
              ${renderOptions(q.options, q.id, selected)}
            </div>
          </div>
        `;
      });
      html += '</div>';
      $dynamic.innerHTML = html;
      $report.style.display = 'none';
      $nav.style.display = 'flex';
      $nav.innerHTML = `<button id="btnDeNext" class="primary">继续 → EF 试题</button>`;
      document.getElementById('btnDeNext').addEventListener('click', () => {
        const allDone = questions.every(q => STATE.deAnswers[q.id]);
        if (!allDone) {
          alert('请回答全部12道DE试题。');
          return;
        }
        STATE.deResult = computeDE(STATE.deAnswers, questions, STATE.sdriveResult?.N_pool || {});
        renderEF();
      });
      attachOptionEvents('[id^="deGroup_"]', (groupId, option) => {
        STATE.deAnswers[groupId] = option;
        renderDE();
      });
    }

    function computeDE(answers, questions, N_pool) {
      const gardens = { PN:{}, AN:{}, RN:{}, IN:{}, MN:{}, FN:{} };
      questions.forEach(q => {
        gardens[q.sandbox][q.id] = answers[q.id] || '';
      });
      const result = {};
      for (let [sandbox, qs] of Object.entries(gardens)) {
        const qids = Object.keys(qs);
        const q1 = qs[qids[0]] || '';
        const q2 = qs[qids[1]] || '';
        let label = '未激活', energy = '未激活', cutoff = null;
        if (sandbox === 'PN') {
          if (q1==='A' && (q2==='A'||q2==='C')) { label='封闭/防御'; energy='节点断电'; cutoff='节点断电'; }
          else if (q1==='B' && q2==='B') { label='未受损'; energy='畅通流转'; }
          else if (q1==='C' || q2==='D') { label='中立/未觉察'; energy='未激活'; }
        } else if (sandbox === 'AN') {
          if (q1==='A' && (q2==='A'||q2==='D')) { label='祛魅/自建'; energy='能量改道'; cutoff='节点断电'; }
          else if (q1==='B' && q2==='B') { label='自建（无损）'; energy='能量改道（主动型）'; }
          else if (q1==='C' && q2!=='A') { label='中立/沿用'; energy='惯性流转'; }
          else if (q1==='C' && q2==='A') { label='不采用/未建立'; energy='悬置'; }
        } else if (sandbox === 'RN') {
          if ((q1==='A'||q1==='B') && (q2==='A'||q2==='B')) { label='封闭/防御'; energy='节点断电'; cutoff='节点断电'; }
          else if (q1==='C' && q2==='C') { label='未受损'; energy='畅通流转'; }
          else if (q1==='D' || q2==='D') { label='胶着/被困'; energy='短路循环'; }
          else if (q1==='E' && q2==='E') { label='一直回避'; energy='节点断电'; cutoff='预设断电'; }
        } else if (sandbox === 'IN') {
          if ((q1==='A'||q1==='B') && q2==='A') { label='封闭/防御'; energy='节点断电'; cutoff='节点断电'; }
          else if (q1==='C' && q2==='C') { label='未受损'; energy='畅通流转'; }
          else if (q1==='D' || q2==='D') { label='胶着/被困'; energy='短路循环'; }
          else if (q1==='E' && q2==='E') { label='一直疏离'; energy='节点断电'; cutoff='预设断电'; }
        } else if (sandbox === 'MN') {
          if ((q1==='A'||q1==='B') && q2==='A') { label='祛魅/自建'; energy='能量改道'; cutoff='节点断电'; }
          else if ((q1==='A'||q1==='B') && q2==='B') { label='不采用/未建立'; energy='悬置'; }
          else if ((q1==='A'||q1==='B') && q2==='C') { label='祛魅/自建'; energy='能量改道'; cutoff='节点断电'; }
          else if (q1==='D' && q2==='D') { label='未受损'; energy='畅通流转'; }
          else if (q1==='D' && q2==='A') { label='未受损'; energy='畅通流转'; }
          else if (q1==='C' && q2==='C') { label='一直抽离'; energy='节点断电'; cutoff='预设断电'; }
          else if (q1==='C' && q2!=='C') { label='不采用/未建立'; energy='悬置'; }
        } else if (sandbox === 'FN') {
          if ((q1==='A'||q1==='B') && q2==='A') { label='祛魅/自建'; energy='能量改道'; cutoff='节点断电'; }
          else if ((q1==='A'||q1==='B') && q2==='B') { label='祛魅/自建'; energy='能量改道'; cutoff='节点断电'; }
          else if ((q1==='A'||q1==='B') && q2==='C') { label='不采用/未建立'; energy='悬置'; }
          else if (q1==='C' && (q2==='B'||q2==='A')) { label='自建（无损）'; energy='能量改道（主动型）'; }
          else if (q1==='C' && q2==='D') { label='未受损'; energy='畅通流转'; }
          else if (q1==='D' && (q2==='D'||q2==='E')) { label='中立/未启用'; energy='未激活'; }
          else if (q1==='E' || q2==='E') { label='中立/未启用'; energy='未激活'; }
        }
        result[sandbox] = { label, energy, cutoff };
      }
      return result;
    }

    // ---------- EF 试题 ----------
    function renderEF() {
      STATE.phase = 'ef';
      $progress.textContent = '步骤 4/5 · 引擎力量评估 (EF 20题)';
      const questions = quizData.modules.ef;
      let html = '<div class="quiz-block">';
      questions.forEach(q => {
        const selected = STATE.efAnswers[q.id] || '';
        html += `
          <div class="question-card">
            <div class="question-text">${q.id}｜${q.engine} · ${q.question}</div>
            <div class="options" id="efGroup_${q.id}">
              ${renderOptions(q.options, q.id, selected)}
            </div>
          </div>
        `;
      });
      html += '</div>';
      $dynamic.innerHTML = html;
      $report.style.display = 'none';
      $nav.style.display = 'flex';
      $nav.innerHTML = `<button id="btnEfFinish" class="primary">生成人格深度报告</button>`;
      document.getElementById('btnEfFinish').addEventListener('click', () => {
        const allDone = questions.every(q => STATE.efAnswers[q.id]);
        if (!allDone) {
          alert('请回答全部20道EF试题。');
          return;
        }
        STATE.efResult = computeEF(STATE.efAnswers, questions);
        renderFullReport();
      });
      attachOptionEvents('[id^="efGroup_"]', (groupId, option) => {
        STATE.efAnswers[groupId] = option;
        renderEF();
      });
    }

    function computeEF(answers, questions) {
      const engines = { O:0, V:0, D:0, E:0, T:0 };
      questions.forEach(q => {
        const ans = answers[q.id];
        if (ans) {
          const idx = ['A','B','C','D','E'].indexOf(ans);
          if (idx >= 0) engines[q.engine] += (idx+1);
        }
      });
      const stateMap = {};
      for (let [eng, score] of Object.entries(engines)) {
        if (score <= 7) stateMap[eng] = { score, state: '被掩埋', wuxing: '枯竭' };
        else if (score <= 12) stateMap[eng] = { score, state: '卷缩', wuxing: '虚弱' };
        else if (score <= 16) stateMap[eng] = { score, state: '生长', wuxing: '平衡' };
        else stateMap[eng] = { score, state: '繁茂', wuxing: '过旺' };
      }

        for (let e of ['T','O','D','E','V']) {

    function getDEText(sb, label, energy) {
      const dict = {
        PN节点断电:'你的 PN（物理底盘）在历史体验中触发了断电保护。你在精力透支或资源不安全之后，对身体的消耗变得格外警惕，对资源的储备变得特别在意。你不再把身体当作可以无限征用的工具，资源边界被收紧，精力的使用变得小心翼翼。让这片花园里的种子生长的资源，并没有消失——它被园丁改道，引灌到了另一个花园。',
        AN节点断电:'你的 AN（能力进化）在历史体验中触发了断电保护。你曾沿着外部设定的路径全力冲刺，却在某个节点遭遇意义的真空。你不再信任别人发给你的进度条，对标准化成长路径的信赖被那次断裂击碎。让这片花园里的种子生长的资源，并没有消失——它被园丁改道，引灌到了另一个花园。',

    function getEFContradictions(engines) {
      if (!engines) return '暂无足够数据。';

    function buildStitching(sd, de, ef, shutdownGardens) {
