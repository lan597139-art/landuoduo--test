<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🌱 人格深度测试 · 代偿演化与引擎生克</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" id="app">
  <h1>🌱 人格深度测试</h1>
  <div class="phase-title" id="phaseIndicator">加载中…</div>
  <div id="quizArea"></div>
  <div id="navArea" class="nav-buttons"></div>
  <div id="reportArea" class="report-container hidden"></div>
</div>

<script>
(async () => {
  const res = await fetch('quiz.json');
  const QUIZ = await res.json();

  // ---------- 全局状态 ----------
  const STATE = {
    phase: 'precheck', precheckAnswer: null,
    tagAnswers: {}, sdriveAnswers: {}, deAnswers: {}, efAnswers: {},
    sdriveResult: null, deResult: null, efResult: null
  };

  const $quiz = document.getElementById('quizArea');
  const $nav = document.getElementById('navArea');
  const $report = document.getElementById('reportArea');
  const $phase = document.getElementById('phaseIndicator');

  // ---------- 工具函数 ----------
  function renderOptions(options, groupId, selectedVal) {
    return options.map(opt => {
      const letter = opt.label || opt[0];
      const text = opt.text || opt;
      const sel = (selectedVal === letter) ? ' selected' : '';
      return `<div class="option-item${sel}" data-opt="${letter}" data-group="${groupId}">
        <span class="option-letter">${letter}</span>
        <span class="option-text">${text}</span>
      </div>`;
    }).join('');
  }

  function attachOptionClicks(selector, handler) {
    document.querySelectorAll(selector + ' .option-item').forEach(el => {
      el.addEventListener('click', function() {
        const group = this.dataset.group;
        const opt = this.dataset.opt;
        handler(group, opt);
      });
    });
  }

  // ---------- 前置提问 ----------
  function renderPrecheck() {
    STATE.phase = 'precheck';
    $phase.textContent = '步骤 1/5 · 确认测试路径';
    $quiz.innerHTML = `<div class="quiz-block"><div class="question-card">
      <div class="q-text">您是否已经完成过<strong>职业性格测试</strong>并拿到了报告？</div>
      <div class="options" id="precheckOpts">
        <div class="option-item" data-opt="yes"><span class="option-letter">是</span><span class="option-text">已完成职业测试，记得主引擎和主沙盒</span></div>
        <div class="option-item" data-opt="no"><span class="option-letter">否</span><span class="option-text">未做过职业测试，需要先完成基础画像</span></div>
      </div>
    </div></div>`;
    $nav.innerHTML = '';
    attachOptionClicks('#precheckOpts', (g, opt) => {
      STATE.precheckAnswer = opt;
      if (opt === 'yes') renderTagCompletion();
      else renderSdrive();
    });
  }

  // ---------- 标签补全 ----------
  function renderTagCompletion() {
    STATE.phase = 'tag';
    $phase.textContent = '步骤 2/5 · 确认基础画像 (标签补全)';
    const qs = QUIZ.modules.tagCompletion.questions;
    let html = '<div class="quiz-block">';
    qs.forEach(q => {
      const sel = STATE.tagAnswers[q.id] || '';
      html += `<div class="question-card">
        <div class="q-text">${q.question}</div>
        <div class="options" id="tagGrp_${q.id}">${renderOptions(q.options, q.id, sel)}</div>
      </div>`;
    });
    html += '</div>';
    $quiz.innerHTML = html;
    $nav.innerHTML = '<button id="btnTagNext" class="primary">继续 → DE 试题</button>';
    document.getElementById('btnTagNext').addEventListener('click', () => {
      if (Object.values(STATE.tagAnswers).filter(Boolean).length !== qs.length) { alert('请回答所有标签问题'); return; }
      STATE.sdriveResult = buildSdriveFromTags(STATE.tagAnswers);
      renderDE();
    });
    attachOptionClicks('[id^="tagGrp_"]', (g, opt) => { STATE.tagAnswers[g] = opt; renderTagCompletion(); });
  }

  function buildSdriveFromTags(tags) {
    const eMap = {A:'T',B:'O',C:'D',D:'E',E:'V'};
    const sMap = {A:'FN',B:'PN',C:'AN',D:'RN',E:'IN',F:'MN'};
    const cMap = {A:'Single_S+Single_N',B:'Dual_S+Single_N',C:'Single_S+Dual_N',D:'Dual_S+Dual_N',E:'Chaotic'};
    return buildSdriveResultObject(
      eMap[tags['TAG-S1']]||'T', eMap[tags['TAG-S2']]||'O',
      sMap[tags['TAG-N1']]||'FN', sMap[tags['TAG-N2']]||'PN',
      cMap[tags['TAG-COMPLEXITY']]||'Dual_S+Dual_N'
    );
  }

  function buildSdriveResultObject(S1, S2, N1, N2, complexityRaw) {
    const engineLabel = { T:'T-木-穿透（超越）', O:'O-金-收束（结构）', D:'D-火-突破（动力）', E:'E-水-漫延（扩张）', V:'V-土-承载（锚定）' };
    const sandboxLabel = { PN:'PN 物理底盘（硬件基座）', AN:'AN 能力进化（单机OS）', RN:'RN 深度连接（局域网）', IN:'IN 社会舞台（广域网）', MN:'MN 意义导航（统摄层）', FN:'FN 系统运转（共识层）' };
    const engineDesc = {
      T: '你并不住在现成的规则里，你住在逻辑之上的云端。你习惯抽离一切现实表象的约束，直击核心的第一性原理；你从不盲从现有的结论，而是热衷于从地基处重新定义这个世界的最高解释权。为此你能够短期孤独与不被理解；慢回报；为了正确结构牺牲短期世俗舒适。',
      O: '你的一生都在追求秩序对混乱的物理统治。你不满足于简单的顺从，而是致力于亲手打造一个精密、可预测且严丝合缝的闭环世界，将一切不确定性彻底驯服为可控的铁律。为此能够牺牲短期灵活度；承担前期繁琐的搭建成本；忍受他人的不守规矩。',
      D: '你拒绝平庸的温吞维持，生命力在强力的碰撞中才达到巅峰。你像一个拒绝后退的破局者，擅长在僵局中制造剧烈的系统位移，通过直面阻力和对抗，强行点燃停滞事物的引擎，推动一切跨越障碍。为此你能够担高强度冲突；承受关系紧张；消耗大量体能与情绪。',
      E: '你对已知的存量版图毫无眷恋，嗅觉永远锚定在未知的增量边界。你像一个不停开启新接口的捕猎者，永远在嗅探外部的新机会与新连接，持续扩大系统做功的吞吐量与影响力上限。为此你能够承担资源失控的风险；承受精力被极度拉散；忍受基本盘的不稳定。',
      V: '你是系统在动荡与变局中的最后支点。你重视历史连接与安全底座，当外部环境陷入失控与悬空时，你负责守住那一分归属感与最后的安全防线，是动荡中为众人提供灵魂依托的最后防线。为此你能够牺牲扩张速度；承受长期的维持性内耗；承担拖后腿的沉没成本。'
    };
    const sandboxDesc = {
      PN: '你的力量必须降落在物理底盘（作息、健康、现金流、物资及空间秩序）上才能真正生效。你是一个现实世界的建造者，你并不相信虚无的承诺，只在乎那些看得见、摸得着、能被绝对掌控的物质安全与空间秩序。因此你拒绝纯虚拟、纯概念、无任何实物落地的空转地带。',
      AN: '你的力量必须降落在个人演化（技能训练、职业履历、项目经验及试错路径）上才能真正生效。你将人生看作一场永不停歇的升级游戏，每一次做功都在为自己的能力版图增砖添瓦，致力于将自我打造成一个不可替代的进化体。因此你拒绝机械重复、一眼望到头、毫无成长空间的流水线。',
      RN: '你的力量必须降落于人际连接（同伴、伴侣、合伙人及长期契约）上才能真正生效。你是一个灵魂与契约的编织者，你的影响力通过他人的信任、回应与深度协作来传递，在人与人的共振中实现价值的最大化。因此你拒绝纯粹冰冷的数据核算、绝对理性的杀伐决断区。',
      IN: '你的力量必须降落在社会网络（组织占位、圈层话语权、公众评价及身份标签）上才能真正生效。你擅长在错综复杂的社会洋流中导航，通过夺取核心位置与塑造群体评价，将个人的姓名转化为一种具备统治力的符号与重权。因此你拒绝无人问津、极度封闭、无需任何社交背书的孤岛。',
      MN: '你的力量必须降落在精神范式（人生愿景、价值信仰、底层观念及宏大叙事）上才能真正生效。你是一个火种的守护者，只在那些关于“意义”与“终极目标”的高海拔地带做功，通过对价值底座的修筑来决定现实世界的走向。因此你拒绝毫无意义的官僚内耗、每天朝令夕改的糊涂账区。',
      FN: '你的力量必须降落在抽象架构（商业模型、协作规则、工具链及反馈闭环）上才能真正生效。你是一个逻辑的工程师，擅长将复杂的现实编码为隐形的机制，通过对反馈闭环的极致精准操作，确保整个世界像钟表一样分秒不差地运行。因此你拒绝毫无规则、纯靠人情世故和拍脑袋做决定的混沌区。'
    };
    const complexityMap = {
      'Single_S+Single_N': { label:'深度穿透型', desc: '你像一柄精准的手术刀，专注于单一维度的单线击穿，你的复杂度上限虽然受限，但抗干扰能力极强。你拒绝一切细碎的干扰与无谓的修饰，存在的唯一目的就是在选定的单点上实现极致的穿透与深度。' },
      'Dual_S+Single_N': { label:'专项攻坚型', desc: '你像一台全副武装的攻坚战车，具备在单一领域内调动多重逻辑的厚度，极其适合处理那些重型、高难度的复杂项目。你能够吸收高压环境下的复杂矛盾，并将多重驱动力转化为击碎瓶颈的合力，实现专项领域的深度破局。' },
      'Single_S+Dual_N': { label:'跨界串联型', desc: '你像一条流动的河流，习惯用一套底层逻辑打通多个现实场域，是天生的中台调度者与跨部门协调者。你能轻易穿透不同领域的行政与规则壁垒，让看似孤立的资源在你的逻辑链条下产生化学反应，实现高效的跨界输出。' },
      'Dual_S+Dual_N': { label:'多维调度型', desc: '你像一座昼夜不停的高速运转枢纽，具备同时处理异构任务的高阶算力，系统调度能力极其强悍。你能在大规模的并发需求中保持主线不乱，通过复杂的逻辑网络实现多维覆盖，但必须警惕由于极度耗能而引发的系统性宕机。' },
      'Chaotic': { label:'潜能未定型', desc: '目前的系统尚未形成稳定的功耗结构，仍缺乏承重能力与持续做功的闭合机制。你正处于一种高能但散乱的叠加态，拥有巨大的潜能却尚未收束，急需在现实中寻找到一个坚固的锚点，来实现从自由游离到有效输出的质变。' }
    };
    const complexityInfo = complexityMap[complexityRaw] || complexityMap['Dual_S+Dual_N'];
    const confidantResult = computeConfidantAndCareer(S1, S2, N1, N2);

    return {
      S1, S2, N1, N2,
      archetype_315: complexityRaw,
      complexity_label: complexityInfo.label, complexity_description: complexityInfo.desc,
      confidant_label: confidantResult.confidant_label, confidant_description: confidantResult.confidant_description,
      career_direction: confidantResult.career_direction, typical_positions: confidantResult.typical_positions,
      unsuitable_directions: confidantResult.unsuitable_directions,
      engine_texts: {
        primary: engineLabel[S1] + '\n' + (engineDesc[S1]||''),
        secondary: S2 ? (engineLabel[S2] + '\n' + (engineDesc[S2]||'')) : null
      },
      sandbox_texts: {
        primary: sandboxLabel[N1] + '\n' + (sandboxDesc[N1]||''),
        secondary: N2 ? (sandboxLabel[N2] + '\n' + (sandboxDesc[N2]||'')) : null
      }
    };
  }

  function computeConfidantAndCareer(S1, S2, N1, N2) {
    const priorities = [
      { cond: () => (['T','O'].includes(S1) || ['T','O'].includes(S2)) && (['FN','MN','AN'].includes(N1) || ['FN','MN','AN'].includes(N2)), label: '谋臣型心腹', desc: '“我的价值不在于执行，在于能看见别人看不到的东西”\n你最核心的价值在于提供超越现状的判断力，系统应当授予你全局诊断与长期战略规划的重权。为了确保逻辑的准确性，必须为你提供完整的信息透明度。应避免将你置于追求极速变现或高压社交应酬的环境中，以免损耗你的战略带宽。你会被谨慎的深用，并制衡全责。', dir: '战略、研究、咨询、架构、顶层设计', positions: ['战略顾问','管理咨询','行业研究','政策研究','产品战略','创始人参谋','组织诊断'], unsuitable: ['纯执行','强应酬','低信息透明','只背锅无决策权'] },
      { cond: () => S1==='O' && !['T','D','E'].includes(S2) && (['FN','PN'].includes(N1) || ['FN','PN'].includes(N2)), label: '守门型心腹', desc: '“扩张可以，但有些红线不能碰，我就是那条红线”\n你是系统规则与底线的最后屏障，适合授权你负责风控审计、合规审查与边界管理。你的价值在于在扩张冲动中守住不可逾越的红线。系统需为你提供清晰的判罚标准和独立裁决权。禁止将你置于需要灰度套利或高速扩张的岗位，那将直接废掉你的核心功能。', dir: '风控、合规、财务、审计、规则、边界管理', positions: ['风控总监','合规经理','审计','财务主管','制度设计','流程管理'], unsuitable: ['灰区套利','高速扩张','规则模糊但要求背责'] },
      { cond: () => (['D','E'].includes(S1) || ['D','E'].includes(S2)) && (['IN','PN'].includes(N1) || ['IN','PN'].includes(N2)), label: '开疆型心腹', desc: '“存量没有意思，我要去打开那些还没有碰过的地方”\n你是打破存量僵局的利刃，适合授权你进行市场突破、资源置换与外部圈层扩张。由于你的做功方式通常具有破坏性，系统需配套强力的风控审计工具作为支撑。不宜将你放置在需要长期精细化维稳的岗位，那会抑制你的爆发力。你会被半核心地位使用，并接受强力的风控监管。', dir: '市场突破、资源置换、圈层扩张', positions: ['市场开拓','商务拓展','渠道建设','新业务负责人','区域总经理'], unsuitable: ['长期精细化维稳','高风险管控缺失环境'] },
      { cond: () => (S1==='V' || (S1==='O'&&S2==='V') || (['V'].includes(S2)&&S1==='O')) && (['RN','PN'].includes(N1) || ['RN','PN'].includes(N2)), label: '维稳型心腹', desc: '“你们往前冲，我在后面把一切稳住，不让系统散架”\n你是系统抵御风险的防火墙，应授权你负责底盘维护、人际关系调停与风险兜底。为了确保你的稳定性，系统必须给予你足够的资源缓冲与心理余量。严禁要求你发起具有高风险的破坏性创新，以免动摇你的防御核心。你会被深用，置于后方核心。', dir: '底盘维护、关系调停、风险兜底', positions: ['行政总监','人力资源','员工关系','危机处理','后勤保障'], unsuitable: ['高风险破坏性创新','长期孤军奋战'] },
      { cond: () => (['T','E'].includes(S1) || ['T','E'].includes(S2)) && (['MN','IN','RN'].includes(N1) || ['MN','IN','RN'].includes(N2)), label: '布道型心腹', desc: '“我需要让更多人理解这件事的意义，不然推不动”\n你是组织共识与影响力的构建核心，适合授权你负责文化建设、愿景解释与外部影响力构建。你擅长赋予行动以意义感，但系统需同步防范你的愿景构思与现实成本脱节。禁止将你锁死在低维、机械重复的流水线作业中，那将是对你认知带宽的极大浪费。你会被视为外围/影响力圈核心。', dir: '文化建设、愿景解释、外部影响力构建', positions: ['品牌总监','企业文化','公关传播','思想领袖','创意总监'], unsuitable: ['机械重复流水线','只讲执行不讲意义'] },
      { cond: () => (['O','D'].includes(S1) || ['O','D'].includes(S2)) && (['FN','AN','PN'].includes(N1) || ['FN','AN','PN'].includes(N2)), label: '执行型心腹', desc: '“别跟我谈愿景，告诉我具体怎么做，我来搞定”\n你是确保目标从概念转化为现实的关键，应授权你负责流程落地与交付闭环。为了发挥你的最高效率，系统必须搭配明确的目标指示与验收标准。禁止将你置于高度无序的环境中，你需要清晰的规则边界来完成高标准的交付。你会被即插即用般的深用。', dir: '流程落地、交付闭环、项目推进', positions: ['项目经理','运营经理','生产主管','交付负责人','执行助理'], unsuitable: ['长期无目标','频繁改口','多头指挥'] },

  function computeSdrive() {
    const qs = QUIZ.modules.sdrive;
    const S_pool = { O:0, V:0, D:0, E:0, T:0 };
    const N_pool = { PN:0, AN:0, RN:0, IN:0, MN:0, FN:0 };
    const F_pool = { Single_S:0, Dual_S:0, Single_N:0, Dual_N:0, Chaotic:0 };
    qs.forEach(q => {
      const ans = STATE.sdriveAnswers[q.id];
      if (!ans) return;
      const chosen = q.options.find(o => (o.label||o[0]) === ans);
      if (!chosen) return;
      if (chosen.engine) S_pool[chosen.engine] += 2;
      if (chosen.sandbox) N_pool[chosen.sandbox] += 2;
      if (chosen.topology) for (let [k,v] of Object.entries(chosen.topology)) F_pool[k] += v;
    });
    const sortedS = Object.entries(S_pool).sort((a,b) => b[1]-a[1]);
    const S1 = sortedS[0][0], S2_candidate = sortedS[1] ? sortedS[1][0] : null;
    const sortedN = Object.entries(N_pool).sort((a,b) => b[1]-a[1]);
    const N1 = sortedN[0][0], N2_candidate = sortedN[1] ? sortedN[1][0] : null;
    let dualS=false, dualN=false, chaoticOverride=false;
    const maxF = Math.max(F_pool.Single_S, F_pool.Dual_S, F_pool.Single_N, F_pool.Dual_N, F_pool.Chaotic);
    if (F_pool.Chaotic === maxF && F_pool.Chaotic > F_pool.Single_S && F_pool.Chaotic > F_pool.Dual_S && F_pool.Chaotic > F_pool.Single_N && F_pool.Chaotic > F_pool.Dual_N) chaoticOverride = true;
    if (!chaoticOverride) {
      if (F_pool.Dual_S >= F_pool.Single_S && F_pool.Dual_S > F_pool.Chaotic) dualS = true;
      if (F_pool.Dual_N >= F_pool.Single_N && F_pool.Dual_N > F_pool.Chaotic) dualN = true;
    }
    let complexityRaw = chaoticOverride ? 'Chaotic' : ((dualS?'Dual_S':'Single_S') + '+' + (dualN?'Dual_N':'Single_N'));
    return buildSdriveResultObject(S1, dualS ? S2_candidate : null, N1, dualN ? N2_candidate : null, complexityRaw);
  }

        else if (ker==='E'&&ked==='D') result.push(`E-水-漫延虚弱，D-火-突破过旺——扩张无力，行动力却极强。火没有水来调节，容易盲目冲锋。`);
        else if (ker==='D'&&ked==='O') result.push(`D-火-突破虚弱，O-金-收束过旺——行动力不足，规则却极其严苛。火点不着，金变成冰冷的牢笼。`);
        else if (ker==='V'&&ked==='E') result.push(`V-土-承载虚弱，E-水-漫延过旺——安全感不足，扩张冲动却极强。水没有土来约束，四处漫流。跑得越快，脚下越虚。`);
      }
    }

    const restrictPairs = [['T','V'], ['O','T'], ['E','D'], ['D','O'], ['V','E']];
    restrictPairs.forEach(([ker, ked]) => {
      const ks = wxState[ker], ds = wxState[ked];
      if (!ks || !ds) return;
      if (ks==='过旺' && (ds==='虚弱'||ds==='枯竭')) pushRestrict(ker, ked, '过度压制');
      else if (ks==='过旺' && ds==='过旺') pushRestrict(ker, ked, '硬碰硬');
      else if (ks==='平衡' && (ds==='虚弱'||ds==='枯竭')) pushRestrict(ker, ked, '正常克制但对方无力');
      else if ((ks==='虚弱'||ks==='枯竭') && ds==='过旺') pushRestrict(ker, ked, '克者无力');
    });

    // 相生（主引擎相关）
    if (sd.S1) {
      const S1 = sd.S1, sWu = wx[S1];
      const childMap = {'木':'火','火':'土','土':'金','金':'水','水':'木'};
      const child = Object.keys(wx).find(k=>wx[k]===childMap[sWu]);
      if (child && engines[child]) {
        const cs = wxState[child];
        if (cs) {
          if (wxState[S1]==='过旺') result.push(`${S1}生${child}（${sWu}生${wx[child]}）：过度滋养。${engLabel[S1]}过旺，不断向${engLabel[child]}输送燃料，思考的供给远远超过了行动的吞吐量。`);
          else if (wxState[S1]==='平衡' && cs==='过旺') result.push(`${S1}生${child}（${sWu}生${wx[child]}）：滋养偏流。${engLabel[S1]}正常但${engLabel[child]}过旺，正常的滋养被全部吸走。`);
        }
      }
    }
    return result.join('\n\n') || '当前引擎间无明显剧烈生克矛盾。';
  }

  function getMinimalAction(engines, sd) {
    if (!engines || !sd) return '保持观察自己的状态。';
    const S1 = sd.S1;
    const engState = engines[S1];
    if (!engState) return '关注主引擎的状态变化。';
    if (engState.state === '繁茂' || engState.wuxing === '过旺') {
      const actions = {
        T: '设定一个“够了”的信号——比如定时器响起、写完一页纸、或者窗外天色变暗——信号出现时立刻停止思考，去做一件完全不需要脑力的事。不要求产出，只要求中断。',
        O: '今天允许一件事不完全按计划进行，刻意留下一点不完美的空间。',
        D: '今天刻意推迟一个冲动决定，给自己10分钟冷静期。',
        E: '今天尝试缩小关注范围，只盯住最重要的三个目标。',
        V: '尝试一次小的冒险，打破一个日常习惯，体验轻微的不适。'
      };
      return actions[S1] || '留意主引擎的过度消耗，找到停下来的信号。';
    }
    return '逐步恢复引擎的自然节奏，减少强行驱动。';
  }

  function buildStitching(sd, de, shutdown, ef) {
    const engineLabelFull = { T:'T-木-穿透（超越）', O:'O-金-收束（结构）', D:'D-火-突破（动力）', E:'E-水-漫延（扩张）', V:'V-土-承载（锚定）' };
    const wuxingMap = { T:'木', O:'金', D:'火', V:'土', E:'水' };
    const S1 = sd.S1;
    const S1_label = engineLabelFull[S1];
    const S1_element = wuxingMap[S1];
    const S1_function = { T:'追问本质、穿透旧框架', O:'梳理秩序、收束闭环', D:'点燃行动、冲破阻力', V:'守护底线、提供依托', E:'拓展边界、连接资源' }[S1]||'';
    const S1_response = { T:'用追问穿透痛苦，用结构收束混乱', O:'用规则划清边界，用闭环锁住失控', D:'用行动冲破阻力，用推土机般的能量碾过障碍', V:'用守护维系底线，用陪伴托住崩塌', E:'用突围绕过关卡，用连接打开新的可能' }[S1]||'';
    const S1_tool = { T:'“为什么”是你最信任的追问工具，“自己建”是你最依赖的结构路径', O:'“边界线”是你最信任的防御工具，“闭环”是你最依赖的控制手段', D:'“冲过去”是你最信任的破局工具，“推土机”是你最依赖的行动方式', V:'“留下来”是你最信任的守护动作，“兜底”是你最依赖的安全网', E:'“绕过去”是你最信任的突围策略，“连接点”是你最依赖的拓展方式' }[S1]||'';
    const N1 = sd.N1;
    const N1_label = { PN:'PN 物理底盘（硬件基座）', AN:'AN 能力进化（单机OS）', RN:'RN 深度连接（局域网）', IN:'IN 社会舞台（广域网）', MN:'MN 意义导航（统摄层）', FN:'FN 系统运转（共识层）' }[N1]||N1;
    const N1_action = { FN:'系统搭建、逻辑追问、结构设计', PN:'身体管理、资源调度、物资储备', AN:'技能积累、路径搭建、自我升级', RN:'关系经营、信任维护、深度陪伴', IN:'人脉拓展、话语权构建、圈层经营', MN:'信念重构、价值输出、精神支点' }[N1]||'';
    const S1_growth = { T:'T-木-穿透（超越）被长期过度调用——每一次追问、每一次重构、每一次搭建，都在滋养木的生长，最终形成繁茂甚至过旺', O:'O-金-收束（结构）被长期过度调用——每一次建规则、每一次锁闭环、每一次划边界，都在磨砺金的锋利，最终形成繁茂甚至过旺', D:'D-火-突破（动力）被长期过度调用——每一次冲锋、每一次破局、每一次点火，都在助燃火的势头，最终形成繁茂甚至过旺', V:'V-土-承载（锚定）被长期过度调用——每一次兜底、每一次陪伴、每一次维系，都在加厚土的承载，最终形成繁茂甚至过旺', E:'E-水-漫延（扩张）被长期过度调用——每一次突围、每一次连接、每一次开拓，都在加大水的流量，最终形成繁茂甚至过旺' }[S1]||'';
    const neglectMap = { T:{ eng:'V', label:'V-土-承载（锚定）', func:'安全感无法从关系中自然获取、无法从群体中自然确认', comp:'只能从你自己搭建的系统中间接汲取', elem:'土'}, O:{ eng:'T', label:'T-木-穿透（超越）', func:'追问冲动被严密规则压制，不再主动穿透旧框架', comp:'只能在规则的缝隙里寻找有限的思考空间', elem:'木'}, D:{ eng:'O', label:'O-金-收束（结构）', func:'规则意识被持续冲锋践踏，不再能守住边界', comp:'只能在每次破局后的废墟上仓促重建', elem:'金'}, V:{ eng:'E', label:'E-水-漫延（扩张）', func:'扩张冲动被安全感需求压制，不再敢主动突围', comp:'只能在熟悉的范围内做有限的试探', elem:'水'}, E:{ eng:'D', label:'D-火-突破（动力）', func:'行动力被多元方向分散，不再能集中点燃', comp:'只能在众多的可能性中反复切换', elem:'火'} };
    const neglect = neglectMap[S1] || neglectMap['T'];
    const shutdown_str = shutdown.join('、');

    let text = '';
    text += `这一切的起点，是你的 ${S1_label}。你习惯用 ${S1_element} 的力量——${S1_function}——作为应对世界的主要方式。当 ${shutdown_str} 遭遇历史冲击时，你没有选择修补那些花园，而是动用了你最擅长的手段：${S1_response}。${S1_tool}。你没有错——这是你的引擎配置在当时能做的最优解。\n\n`;
    text += `你的主沙盒是 ${N1_label}，这里是你的力量最密集的节点。当 ${shutdown_str} 的信任被历史事件切断，园丁没有把资源留在原地——它将所有的生长需求改道，集中引灌至 ${N1}。你在 ${N1_action} 上的繁茂，不是偶然的天赋，而是 ${shutdown_str} 的资源退守到 ${N1} 后形成的代偿性繁茂。${N1} 上的每一层精密结构，都是别处花园凋零后汇聚过来的生长冲动。\n\n`;

    if (ef && ef.engines) {
      const mainEng = ef.engines[S1];
      const neglectEng = ef.engines[neglect.eng];
      if (mainEng && mainEng.wuxing === '过旺' && neglectEng && (neglectEng.wuxing === '虚弱'||neglectEng.wuxing==='枯竭')) {
        text += `这套代偿机制的持续运行，直接塑造了你五颗引擎种子的力量格局。${S1_growth}。而 ${neglect.label}——${neglect.func}，${neglect.comp}。${neglect.elem}得不到直接滋养，逐渐卷缩。\n\n`;
      } else {
        text += `这套代偿机制的持续运行，会逐渐塑造你引擎种子的力量格局。你最常调用的引擎，在每一次代偿性使用中被反复滋养，趋向繁茂。而那些在封闭花园中本该自然生长的引擎，由于长期得不到直接滋养，逐渐卷缩。\n\n`;
      }
    } else {
      text += `这套代偿机制的持续运行，会逐渐塑造你引擎种子的力量格局。你最常调用的引擎，在每一次代偿性使用中被反复滋养，趋向繁茂。而那些在封闭花园中本该自然生长的引擎，由于长期得不到直接滋养，逐渐卷缩。\n\n`;
    }

    // 第四段：生克必然性（通用版动态替换）
    const sWu = wuxingMap[S1];
    const neWu = neglect.elem;
    const restrictMap = {木:'金',火:'水',土:'木',金:'火',水:'土'};
    const shengMap = {木:'火',火:'土',土:'金',金:'水',水:'木'};
    const motherMap = {木:'水',火:'木',土:'火',金:'土',水:'金'};
    const restrainerWu = restrictMap[sWu];
    const childWu = shengMap[sWu];
    const motherWu = motherMap[sWu];

    text += `${sWu}旺${neWu}虚的格局一旦形成，五行生克的矛盾就不可避免。${sWu}克${neWu}：你的核心驱动力在消耗你最需要却最缺乏的功能底盘。${restrainerWu}克${sWu}的克者无力：约束的力量追不上核心驱动的速度。${sWu}生${childWu}的过度滋养：太多能量堆在传导链的下一环，吞吐量远超负荷。${motherWu}生${sWu}的滋养偏流：外部资源本该用于别处，却被你的核心驱动截流。这些不是偶然的摩擦——它们是你过去所有代偿选择在当前时刻的集中表达。`;

    return text;
  }

  // 启动
  renderPrecheck();
})();
</script>
