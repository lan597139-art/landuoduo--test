<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>职业性格测试 · 沙盒驱动力探测</title>
    <style>
        /* ═══════════════════════════════════════════
           全局样式 — 复用心理学测试的干净、克制风格
           主色调：高纯度蓝 #2563eb + 纯白 #ffffff
           支持深色模式
           ═══════════════════════════════════════════ */
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --primary-border: #bfdbfe;
            --text-main: #1e293b;
            --text-secondary: #475569;
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.05);
            --radius: 12px;
            --transition: 0.2s ease;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #3b82f6;
                --primary-light: #1e3a5f;
                --primary-border: #1e3a8a;
                --text-main: #f1f5f9;
                --text-secondary: #cbd5e1;
                --bg-page: #0f172a;
                --bg-card: #1e293b;
                --border-color: #334155;
                --shadow: 0 1px 3px rgba(0,0,0,0.3);
                --shadow-md: 0 4px 6px rgba(0,0,0,0.4);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
        }

        /* 顶部导航栏 — 复用心理学测试进度条设计 */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-card);
            border-bottom: 2px solid var(--primary-border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: var(--shadow);
            transition: background var(--transition);
        }

        .logo {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            max-width: 300px;
        }

        .progress-bar-outer {
            flex: 1;
            height: 8px;
            background: var(--border-color);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-bar-inner {
            height: 100%;
            background: var(--primary);
            border-radius: 99px;
            width: 0%;
            transition: width 0.35s ease;
        }

               .progress-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            white-space: nowrap;
        }

        .layer-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--bg-page);
            padding: 4px 12px;
            border-radius: 99px;
            white-space: nowrap;
        }
        .layer-progress {
            font-weight: 700;
            color: var(--primary);
        }

        /* 主容器 */
        .container {
            max-width: 780px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        .header-card {
            text-align: center;
            padding: 32px 20px;
            background: var(--bg-card);
            border: 2px solid var(--primary-border);
            border-radius: var(--radius);
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            transition: background var(--transition);
        }

        .header-card h1 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        /* 卡片样式 */
        .card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            transition: background var(--transition), border-color var(--transition);
        }

        .card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }
        .card.missing {
            border: 2px solid #ef4444;
            background-color: #fef2f2;
        }
        .card-num {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
            background: var(--primary-light);
            display: inline-block;
            padding: 2px 12px;
            border-radius: 99px;
        }

        .card-text {
            font-weight: 500;
            margin-bottom: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        /* 关键词提示样式 */
        .keyword-tip {
            color: inherit;
            border-bottom: 1px dashed var(--primary);
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }

        .keyword-tip:hover {
            background: var(--primary-light);
            border-bottom-style: solid;
        }

      /* 选项 */
        .option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--bg-page);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .option:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .option input[type="radio"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin-top: 2px;
            cursor: pointer;
        }

        .option.selected {
            border-color: var(--primary);
            background: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* 按钮 */
        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: var(--primary);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 99px;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: var(--transition);
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn:disabled {
            background: var(--border-color);
            cursor: not-allowed;
            filter: none;
            transform: none;
            color: var(--text-secondary);
        }
        .btn.btn-pending {
    opacity: 0.65;
    cursor: pointer;
    filter: grayscale(0.3);
}
.btn.btn-pending:hover {
    background: var(--primary);
    filter: grayscale(0.3) brightness(0.9);
}
        .caution {
    opacity: 0.55;
    font-size: 0.85em;
    display: block;
    margin-top: 2px;
}
        .caution .keyword-tip {
            opacity: 1;
        }
        .submit-wrap {
            text-align: center;
            margin-top: 30px;
        }

        .report {
            margin-top: 30px;
            background: var(--bg-card);
            border: 2px solid var(--primary-border);
            border-radius: var(--radius);
            padding: 28px 22px;
            box-shadow: var(--shadow);
            line-height: 1.8;
            display: none;
            transition: background var(--transition);
        }

        .report h2 {
            color: var(--primary);
            margin: 24px 0 12px;
            border-bottom: 2px solid var(--primary-border);
            padding-bottom: 6px;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .top-bar {
                padding: 10px 12px;
            }
            .container {
                padding: 12px 10px 40px;
            }
            .card {
                padding: 16px 12px;
            }
        }
    </style>
</head>
<body>
<!-- ═══════════ 顶部导航栏 ═══════════ -->
<div class="top-bar" id="topBar">
    <div class="logo">
        <span>🧭</span> 职业沙盘探测
    </div>
    <div class="progress-wrap">
        <div class="progress-bar-outer">
            <div class="progress-bar-inner" id="progressBarFill"></div>
        </div>
        <span class="progress-text" id="progressText">0 / 71</span>
    </div>
    <div class="layer-info" id="layerInfo">
        <span class="layer-tag">🌱 第1层 · 核心身份</span>
        <span class="layer-progress" id="layerProgress">0/20</span>
    </div>
</div>

<!-- ═══════════ 主容器 ═══════════ -->
<div class="container">

        <div id="quizArea">
                <div id="quizArea">
        <p style="text-align:center; color:var(--text-secondary); font-size:0.85rem; margin-bottom:12px;">💡 点击题干和选项中的<strong style="color:var(--primary);">下划线关键词</strong>可查看提示</p>
        <div id="quizList"></div>
        <div class="submit-wrap"><button class="btn" id="btnSubmit">提交并生成报告</button></div>
    </div>
        <div id="quizList"></div>
        <div class="submit-wrap"><button class="btn" id="btnSubmit">提交并生成报告</button></div>
    </div>

    <div class="report" id="reportBox"></div>
</div>

<script>
// ==================== 关键词提示词库 ====================
// ==================== TOOLTIPS 词库（最终定稿）====================
const TOOLTIPS = {
    "秩序": "O｜结构性 · 结晶本能：追求秩序与可预测性，本能地对抗混乱。像晶体一样冷峻，致力于把模糊变清晰。【你会定计划、理流程、建规则，让一切进入可控的轨道。混乱是你最想消灭的东西，确定的结果让你感到安全。】",
    "锚定": "V｜锚定性 · 回声本能：追求被看见与被反馈，无论是正反馈还是负反馈，以此确认坐标。像回声一样，需要外界反应证明存在。【外界对你的回应——不管是来自人、动物还是任何你信任的实体——都像一面镜子，让你知道自己的位置在哪，不至于悬浮。】",
    "动力": "D｜动力性 · 燃烧本能：追求变化与新鲜感，寻找点燃热情的燃料。像氧化剂，渴望破局和冲锋。【停滞让你窒息，你会主动寻找新的刺激、冲开阻力、点燃状态。热血和突破是你的燃料。】",
    "扩张": "E｜扩张性 · 狩猎本能：吞噬变量，对无限可能性极度饥渴，通过持续狩猎换取绝对自由与反控制。演化路径：嗅探夺取→建立规则→掌握Root权限。【你会搜罗更多资源、建立更大版图、获取更多控制权。你拒绝被困住，追求“我的地盘我说了算”的自由。】",
    "超越": "T｜超越性 · 聚变本能：追求神性与永恒，渴望与绝对真理融合。像核聚变产生极高能量，冷酷追问本质，拆解焚毁虚伪表象，看清底层逻辑。【你不满足于表面的热闹，会一直追问“为什么”，直到触达最根本的逻辑。世俗的表演和琐碎消耗让你厌倦，你渴望看到真相。】",
    "身体底盘": "PN｜生理叙事 · 物理底盘：这是你作为生物体存在的物质基础。包括作息、饮食、睡眠、居所、金钱、现金流和所有看得见摸得着的资源。【但当它出问题时，你会感到持续的疲惫、身体报警、资源紧张。】",
    "能力进化": "AN｜自我叙事 · 单机系统：你个人能力的沉淀层。记录了你学过什么、做成过什么、有哪些项目和履历。【但当它出问题时，你会感到能力焦虑、履历断层，怀疑自己“其实什么都不会”。】",
    "深度连接": "RN｜关系叙事 · 局域网：你与他人之间的深度信任网络。包括伴侣、密友、长期合伙人等。【但当它出问题时，你会感到孤独、被误解，或被困在一段消耗型关系里。】",
    "社会舞台": "IN｜社会叙事 · 广域网：你在群体中的坐标和影响力。包括身份标签、话语权、人脉圈层和公众评价。【但当它出问题时，你会感到被边缘化、被贴错标签，或被舆论裹挟。】",
    "意义导航": "MN｜宏大叙事 · 统摄层：你精神世界的顶层设计。包括你最看重的价值观、人生的终极目标。【但当它出问题时，你会感到空虚、迷茫，或发现追逐的东西毫无意义。】",
    "系统运转": "FN｜功能叙事 · 共识层：你建立起来的规则和流程。包括工作方法、协作机制、商业模式等一旦建好就能自动运行的结构。【但当它出问题时，你会感到混乱、低效，或被自己建立的规则反困住。】",
    "真来电": "不只是开心，而是整个人明显被点燃、变稳、变清醒或变有能量的时刻。",
    "掉线": "明显下头、失去动力、想抽离、想摆烂或想掀桌的状态。",
    "回稳": "状态低、压力大、内耗重、快撑不住时，最本能想做的恢复动作。",
    "重大选择": "一次会影响路径、关系、资源或身份的决定。",
    "第二股力量": "除了最主要的做功方式之外，另一个也经常出现的力量：可能是秩序、锚定、动力、扩张或超越中的一种。",
    "心力结构": "心力=心理能量的三元整合系统：由认知力、情绪力、意志力三核心构成，外加底层生理基座与顶层价值/意义锚点，决定你“想不想、能不能、稳不稳”。请回想过去一两年，你反复操心、投入、修补的事情。",
    "应对策略": "请回想一个长期反复遇到的卡点——比如某件事一直提不上去、某段关系老出问题、某个项目反复卡住。你面对它时的第一反应是什么？",
    "习惯自动扩散": "请回想你最本能的那种处理习惯——比如凡事都要先理顺（秩序）、先找安全感（锚定）、先往前冲（动力）、先扩大资源（扩张），或先跳出来看本质（超越）。这种习惯是只用在某一类事情上，还是会自动用到完全不同的事情上？",
    "复杂并发": "请回想你的日常生活，有没有长期同时维护两个都很重要的领域？比如一边管成长，一边维系关系；一边忙工作流程，一边思考人生意义。",
    "单引擎单域": "你主要用一种核心驱动力，长期集中在一个生活领域里做功。例如：一直靠“秩序”来管理自己的学习和工作。优势：极度聚焦、深耕力强、能量不散；短板：领域单一、抗风险弱、容易僵化",
    "双引擎单域": "你在同一个生活领域里，经常同时调动两种驱动力一起处理问题。例如：在工作事务上，既靠“动力”冲锋破局，又靠“秩序”收尾闭环。优势：单点战斗力最强，刚柔并济，效率最高；短板：只深耕一件事，生活维度单一。",
    "单引擎双域": "你习惯用同一种驱动力，但会稳定地把它用在两类完全不同的领域。例如：用“秩序”同时管理职业成长和亲密关系。优势：习惯可复用，做事逻辑统一；短板：精力被拆分，两个领域都难做到极致",
    "双引擎双域": "你长期同时维护两个都很重要的生活领域，共享两个核心引擎。两个引擎在两个沙盒之间是共用的。例：工作+感情两条主线，都靠「动力+秩序」两套引擎运转。优势：人生布局全面、多线发展；短板：最容易精力透支、内耗严重、两头拉扯",
    "灰区暴利": "灰色捷径快速提分、绕规则拿评价优势、绕流程拿绩效、利用组织漏洞得曝光、利用关系漏洞获得话语权。这些操作没有明确违规，但利用了规则漏洞。",
    "秩序代价": "为了维持规则、结构和可审计性必须放弃的东西：快速收益、短期暴利、别人已经拿到的好处、低成本过关机会。",
    "稳定依托": "稳定同伴圈、熟悉的学习节奏、群体归属感、稳定团队或上级的保护、伴侣或家庭的支撑、稳定的生活空间。",
    "孤立扩张": "离开熟悉的圈子、脱离原有路径、进入无人兜底的新项目、弱化家庭或伴侣支持、独自承担选择的所有后果。",
    "突破目标": "死磕难题或竞赛、冲刺新技能或新项目、公开挑战组织惯性、强推机制改革、正面谈冲突、冲破旧信念。",
    "动力代价": "睡眠下降、关系变紧、错误率上升、身体持续报警、心理持续报警、失败风险、高冲突、高消耗。",
    "资源窗口": "新课程或竞赛机会、新项目或技能入口、多线任务同时出现、更多曝光资源、新市场或渠道或投资人。",
    "承载边界": "你的精力、时间、现金流、核心产品质量、已有承诺、团队承载上限、关系边界、个人空间、家庭或伴侣的责任。",
    "底层意义": "你对事物本质的理解、学习的真正意义、职业使命、创业愿景、长期能力方向、人生方向、关系信念、人格独立。",
    "现实收益": "短期成绩、绩效、金钱、地位、外界认可、快速落地、可见成果、家庭或组织或伴侣更容易接受的选择。",
    "老一套": "固定复习计划、按PPT或往年题复习、SOP常规交付、既定增长计划、父母安排的路线、固定相处模式。",
    "黑天鹅": "事先难以预见、一旦出现就会让原有流程突然卡死的意外事件。比如期末新出的综合题、客户例外需求、渠道突然变化。",
    "穿一条裤子": "学习搭子、室友或小组队友、同事搭档、合伙人、家庭成员、伴侣。双方因为关系亲近或目标一致形成高度绑定的合作。",
    "翻车": "解题思路不同、项目署名分歧、职责边界分歧、股权或决策权分歧、生活选择差异、家务或未来规划分歧。合作从互助变成争吵、消耗或冷却。",
    "KPI": "班级积分、综测或志愿时长、OKR、增长数据或融资指标、成绩或收入或听话程度、礼物或转账或陪伴时长。",
    "为爱发电停摆": "自然互助、无记录贡献、主动承担、真实协作、情感支持、责任感、长期信任。这些对系统长期健康很重要的行为，因为不被KPI计量而逐渐减少。",
    "假装努力": "漂亮错题本、读书笔记或PPT、周报或流程图、路演材料或增长复盘、计划表或外在变好痕迹、关系复盘或仪式感。",
    "真本事": "原题仍错、无法独立分析、异常处理失败、产品或留存不稳、真实能力没建成、具体冲突反复出现。",

  {"id":"N-C01","text":"当你最想把一切理顺、稳定下来时，你的秩序驱动最常落在哪个现实领域？","options":[{"label":"A","text":"身体底盘：整理身体、作息、房间、钱和物资，让现实不失控。||底盘变化太快时，弹性调度能力需要跟上。"},{"label":"B","text":"能力进化：规划成长路径、学习节奏和能力积累，让发展不偏移。||路径突然变化时，试错和重组能力更关键。"},{"label":"C","text":"深度连接：明确关系边界、分工和互动规则，让长期连接减少消耗。||对方不按规则来时，情绪承载和灰度沟通要跟上。"},{"label":"D","text":"社会舞台：搞清群体规则、角色位置和评价标准，不乱位。||规则隐晦时，局势感和灰度判断不可或缺。"},{"label":"E","text":"意义导航：整理信念、目标和价值体系，保持内在自洽。||现实打破框架时，重构弹性的要求变高。"},{"label":"F","text":"系统运转：搭好流程、机制、工具和反馈闭环，低损耗运行。||高变动期时，快速迭代比稳定运行更关键。"}]},
  {"id":"N-C02","text":"当你最想让自己不悬空、有落点时，你的锚定驱动最常落在哪个现实领域？","options":[{"label":"A","text":"身体底盘：靠熟悉环境、稳定作息和物资储备稳住自己。||进入陌生环境后，自主适应能力要补上。"},{"label":"B","text":"能力进化：靠固定目标、持续路径和身份定位稳住成长。||原路径失效后，重新转向的能力变得重要。"},{"label":"C","text":"深度连接：靠亲密关系、陪伴和回应稳住内在。||关系需要分离时，边界感和独立承受力要求变高。"},{"label":"D","text":"社会舞台：靠群体归属、固定位置和社会身份稳住存在感。||位置被动摇时，独立站位的能力不可或缺。"},{"label":"E","text":"意义导航：靠信念、价值和人生坐标稳住意义感。||信念空窗时，自己生成意义并承受过程是考验。"},{"label":"F","text":"系统运转：靠固定方法、习惯模板和可依赖系统稳住运行。||旧系统失效时，更新和迁移能力要跟上。"}]},
  {"id":"N-C03","text":"当你最想把卡住的东西冲开时，你的动力驱动最常落在哪个现实领域？","options":[{"label":"A","text":"身体底盘：改变身体状态、作息和运动强度，让底盘活起来。||长期维持节奏时，节奏控制比爆发力更重要。"},{"label":"B","text":"能力进化：冲击能力和职业瓶颈，让成长重新推进。||突破后需沉淀积累，复盘习惯不能落下。"},{"label":"C","text":"深度连接：说开关系里的沉默和拉扯，让连接重新流动。||需低冲突维护时，温和表达比冲撞更可持续。"},{"label":"D","text":"社会舞台：表达、竞争、争取位置，让群体位置变化。||长期经营群体时，策略和耐心比一次出头更难。"},{"label":"E","text":"意义导航：质疑旧信念、重写目标，让精神系统重新点火。||意义需稳定实践时，持续落地比不断打破更考验耐力。"},{"label":"F","text":"系统运转：拆掉低效流程、重构机制，让运行不再卡死。||系统需持续运营时，标准化和维护功夫不能省。"}]},
  {"id":"N-C04","text":"当你最想把版图打开、把资源做大时，你的扩张驱动最常落在哪个现实领域？","options":[{"label":"A","text":"身体底盘：扩大金钱、物资、空间和现实控制范围。||资源过多时，收纳、聚焦和守边界的能力更关键。"},{"label":"B","text":"能力进化：扩大机会、技能、履历和成长可能性。||路径过多时，需费力筛选主线，收敛资源。"},{"label":"C","text":"深度连接：扩大关系连接、合作对象和协作系统容量。||连接过多时，亲疏边界和承诺管理要跟上。"},{"label":"D","text":"社会舞台：扩大人脉、曝光、圈层入口和话语权。||评价来源杂时，身份边界和信息过滤变得不可或缺。"},{"label":"E","text":"意义导航：扩大观念影响、传播和信念共同体覆盖。||传播大于内核时，需收敛守住根基。"},{"label":"F","text":"系统运转：扩大流程规模、工具链和复制能力。||规模超出承载时，风控和回撤纪律比继续扩张更重要。"}]},
  {"id":"N-C05","text":"当你最想跳出来重新理解这一切时，你的超越驱动最常落在哪个现实领域？","options":[{"label":"A","text":"身体底盘：跳出身体和环境限制，重新理解存在状态。||身体已报警时，及时落地处理比继续抽离更紧迫。"},{"label":"B","text":"能力进化：跳出原成长路径，重新定义发展方向。||新定义需落地时，行动拆解能力要跟上。"},{"label":"C","text":"深度连接：跳出情绪和依附，重新理解关系本质。||关系仍需回应时，具体陪伴不能缺席。"},{"label":"D","text":"社会舞台：跳出群体评价，观察权力结构和圈层逻辑。||现实位置需维护时，社交动作不能完全放下。"},{"label":"E","text":"意义导航：跳出现有信念，重构意义系统和人生方向。||意义要进入生活时，现实承诺同样不可或缺。"},{"label":"F","text":"系统运转：跳出具体流程，抽象出底层机制和第一性原理。||系统需日常运行时，细节执行不能因抽象而被忽略。"}]},
  {"id":"N-C06","text":"除了最主要的做功方式之外，你的第二股力量启动时，它最常落在哪个现实领域？","options":[{"label":"A","text":"身体底盘：身体、作息、空间、钱、物资和生活资源。||需注意现实承载、身体信号和资源边界。"},{"label":"B","text":"能力进化：成长、学习、能力、履历和职业路径。||需注意路径收敛、持续积累和阶段反馈。"},{"label":"C","text":"深度连接：亲密关系、朋友、伴侣、合作和长期连接。||需注意边界、回应和责任分配。"},{"label":"D","text":"社会舞台：群体位置、评价、圈层、人脉和社会身份。||需注意评价过滤、身份边界和局势判断。"},{"label":"E","text":"意义导航：信念、意义、价值、人生目标和精神方向。||需注意现实落地、信念收敛和承受空窗期的能力。"},{"label":"F","text":"系统运转：方法、流程、机制、工具和系统运行。||需注意维护成本、迭代节奏和异常处理。"}]},
  {"id":"C01","text":"什么最容易让你进入真来电的状态？","options":[{"label":"A","text":"秩序：混乱被理顺，事情进入可控状态。"},{"label":"B","text":"锚定：有人或支点给了回音，感到不悬空。"},{"label":"C","text":"动力：阻力冲开，节奏带起，进入突破状态。"},{"label":"D","text":"扩张：资源、空间或连接打开，能做的事变多。"},{"label":"E","text":"超越：看懂了底层逻辑或本质，精神被重新点亮。"}]},
  {"id":"C02","text":"什么最容易让你系统掉线？","options":[{"label":"A","text":"秩序：规则混乱、流程失控，到处都是不可控变量。"},{"label":"B","text":"锚定：没有回应和依托，信号发出没有回音。"},{"label":"C","text":"动力：一切太慢太钝，推进感磨光，心气熄火。"},{"label":"D","text":"扩张：手脚被绑，资源受限，完全施展不开。"},{"label":"E","text":"超越：事情变成重复表演或流水线，找不到意义。"}]},
  {"id":"C03","text":"状态低、压力大、快撑不住时，你最本能的回稳动作是什么？","options":[{"label":"A","text":"秩序：整理房间、列清单、重排计划，夺回秩序。"},{"label":"B","text":"锚定：找懂你的人聊，回熟悉环境，确认支点还在。"},{"label":"C","text":"动力：运动、出门、换节奏，让身体和思维动起来。"},{"label":"D","text":"扩张：抢回空间、拉开距离，重新拥有可支配范围。"},{"label":"E","text":"超越：抽离现实，看书、沉浸自然或宏大问题。"}]},
  {"id":"C04","text":"做重大选择时，你优先稳住什么？","options":[{"label":"A","text":"秩序：理清信息、风险、步骤和后果，确保可以把控。"},{"label":"B","text":"锚定：确认有人或底线能兜住结果，不至于彻底悬空。"},{"label":"C","text":"动力：看能不能打破现状、激活自己，带来真正突破。"},{"label":"D","text":"扩张：看能不能打开更大空间、更多资源和新可能。"},{"label":"E","text":"超越：看是否契合更深层的意义和人生底层判断。"}]},
  {"id":"F01","text":"过去一两年，你的心力结构最像哪种模式？","options":[{"label":"A","text":"我的生活重心长期集中在一个领域，处理问题的方式也一直比较固定。||单引擎单域"},{"label":"B","text":"我的生活重心主要在一个领域里，但会用两种完全不同的方式来处理这个领域的问题。||双引擎单域"},{"label":"C","text":"我习惯用一种固定的做事方式，但会把它反复用在两个不同的生活领域里。||单引擎双域"},{"label":"D","text":"我同时在经营两个重要的生活领域，每个领域里又会用到两种不同的做事方式。||双引擎双域"},{"label":"E","text":"精力比较散，没有固定的重心，哪里出问题就扑向哪里，长期处于被动应对的状态。"}]},
  {"id":"F02","text":"面对一个长期反复遇到的卡点，你的应对策略最像哪种？","options":[{"label":"A","text":"我习惯反复用同一种思路去处理。||单引擎单域"},{"label":"B","text":"我习惯同时用两种不同的思路一起处理。||双引擎单域"},{"label":"C","text":"平时以某一种思路为主，压力大时会切换到另一种。||单引擎双域"},{"label":"D","text":"我经常在两种思路之间反复拉扯。||双引擎双域"},{"label":"E","text":"没有固定习惯，多数时候先把眼前压力降下来再说。"}]},
  {"id":"F03","text":"你最习惯的那种处理方式，会不会习惯自动扩散到不同的事情上？","options":[{"label":"A","text":"这种方式我主要只用在某一类事情上。||单引擎单域"},{"label":"B","text":"它会稳定用在两类完全不同的事情上。||单引擎双域"},{"label":"C","text":"用在很多事情上，但不算稳定，哪里出问题就套过去。"},{"label":"D","text":"平时不会扩散，但压力大或机会多时会自动扩散。"},{"label":"E","text":"我没有一种特别稳定的处理习惯。"}]},
  {"id":"F04","text":"你是不是长期处于复杂并发状态，同时维护多个重要领域？","options":[{"label":"A","text":"精力集中在一类事上，处理方式也比较固定。||单引擎单域"},{"label":"B","text":"处理习惯有两种以上，但都用在同一个重要领域。||双引擎单域"},{"label":"C","text":"主要是同一种习惯，但稳定覆盖两个不同的重要领域。||单引擎双域"},{"label":"D","text":"长期同时维护两个都很重要的领域，各自靠的不止一种力量。||双引擎双域"},{"label":"E","text":"操心的领域多，但没什么固定组合，哪里出状况扑哪里。"}]},
  // 第二批：st-O01 ~ st-T01（5题）
  {"id":"st-O01","text":"你发现一个可以绕开规则获得高收益的机会，周围也有人正在这么做。坚持原规则会错过灰区暴利，绕开规则收益放大但系统进入不可审计的灰区。面对这笔秩序代价，你会怎么处理？","options":[{"label":"A","text":"不绕规则，按原结构行动，宁可错过暴利也不进入灰区。"},{"label":"B","text":"不吃灰利，但试着改造成合规通道；改不了就降低参与，减少风险。"},{"label":"C","text":"窗口短，先获取收益，事后再补结构和记录。"},{"label":"D","text":"不再管规则，只要风险低收益高就跟进，不纠结原则。"}]},
  {"id":"st-V01","text":"有一个可以快速获得更大自由和资源的机会，但要求你短期内切断原本最稳定的依托。保留稳定依托会错过窗口，进入孤立扩张则速度更快但孤军奋战。在这个结算条件下，你会怎么处理？","options":[{"label":"A","text":"不切依托，宁可变慢，也要保住安全底座和回音。"},{"label":"B","text":"不完全切断，减少依赖频率，保留关键连接，同时尝试进入窗口。"},{"label":"C","text":"先切断依托，快速进入扩张路径，事后再重建支撑系统。"},{"label":"D","text":"把没兜底当刺激，直接冲进去，是否稳定之后再说。"}]},
  {"id":"st-D01","text":"你正在推进一个让你兴奋的突破目标，但阻力越来越大，身体和心理开始持续报警。继续强推可能冲出结果也可能烧穿系统，退到低耗路线则收益变小但能保住健康和节奏。面对这笔动力代价，你会怎么处理？","options":[{"label":"A","text":"继续推进，承受高消耗，只要还有突破机会就不退回低耗路线。"},{"label":"B","text":"保留目标，但重新设节奏，插入检查点和恢复窗口，把速度降到可承受范围。"},{"label":"C","text":"暂停突破，优先恢复秩序、安全和稳定输出。"},{"label":"D","text":"在冲刺和摆烂之间反复横跳，直到结果或身体强行结算。"}]},
  {"id":"st-E01","text":"你正处在一个资源窗口里，新机会和新资源同时出现，继续扩张短期收益会明显变多。但系统已经接近承载边界，再铺开可能回撤和失控。在这个结算条件下，你会怎么处理？","options":[{"label":"A","text":"继续扩，优先抓住窗口，承受复杂度上升和回撤风险。"},{"label":"B","text":"保留扩张方向，但设止损线和回撤机制，让扩张进入可管理结构。"},{"label":"C","text":"先暂停扩张，稳住现有结构、资源边界和安全底座。"},{"label":"D","text":"跟着机会流动，不设明确主线和边界，哪里有机会就去哪。"}]},
  {"id":"st-T01","text":"你面前有两个方向：一个能带来现实收益，反馈快、外界认可。另一个更接近你的底层意义，但短期很难解释清楚，可能带来孤立感。在这个结算条件下，你会怎么处理？","options":[{"label":"A","text":"选底层意义，即使短期收益低、不被理解，也不让现实奖励改写方向。"},{"label":"B","text":"保留底层意义，但拆成阶段目标、验证路径，让意义进入可执行结构。"},{"label":"C","text":"先选更能落地、更能被认可的方向，现实收益在当下更重要。"},{"label":"D","text":"继续说愿景讲意义，但不承担低收益代价，也不转化为现实路径。"}]},
  // 第三批：SL-01 ~ SL-06（6题）
  {"id":"SL-01","text":"一个人长期按老一套行动，熟悉场景中表现稳定。但当出现此前没见过的黑天鹅时，原本稳定的执行突然卡住，无法继续推进。从解决问题的角度看，这个案例的最大死穴在哪里？","options":[{"label":"A","text":"锚定：流程缺少面对意外变量时的缓冲空间，安全底座容易被陌生情况打断。"},{"label":"B","text":"动力：平时运行太顺，缺少和未知阻力持续拉扯的训练，面对新变量没有继续推进的动能。"},{"label":"C","text":"秩序：固定流程只覆盖了熟悉任务，没有形成处理例外情况的拆解步骤和反馈闭环。"},{"label":"D","text":"扩张：输入样本和资源来源太窄，面对新变量时可调用的外部方案和替代资源不足。"},{"label":"E","text":"超越：它把稳定执行既定流程误当成真正具备处理问题的能力，把流程完成和能力形成混在了一起。"}]},
  {"id":"SL-02","text":"两个或多个人形成了穿一条裤子的合作模式，前期配合顺畅。但后期一旦出现翻车，双方都无法有效处理，合作从互助变成争吵和消耗。从解决问题的角度看，这个案例的最大死穴在哪里？","options":[{"label":"A","text":"锚定：绑定太紧，缺少各自独立判断和保留差异的安全空间，一旦分歧出现，关系底座就动摇。"},{"label":"B","text":"动力：分歧本可以成为推动协作升级的能量，但冲突没有被转化为推进力，停留在彼此消耗上。"},{"label":"C","text":"秩序：缺少处理分歧的规则，没有约定评判标准、验证方式、暂停机制或责任边界。"},{"label":"D","text":"扩张：系统太封闭，没有引入外部信息、第三方意见或替代资源来打破内部循环。"},{"label":"E","text":"超越：他们默认关系亲近就该判断一致，但独立个体本就可以有不同路径，强求同步是模型错位。"}]},
  {"id":"SL-03","text":"一个系统引入了一套明确的KPI来驱动行为，前期大家被调动，行为更可见。但一段时间后，那些未被计量但对系统长期健康很重要的行为——为爱发电停摆了。从解决问题的角度看，这个案例的最大死穴在哪里？","options":[{"label":"A","text":"锚定：系统原本需要信任和非交易性的稳定底座，指标化把自然互动变成交换，削弱了底层关系安全。"},{"label":"B","text":"动力：外部指标牵引了所有行动，自发投入和内在动能被单一奖励通道替代。"},{"label":"C","text":"秩序：指标规则只覆盖了部分行为，留下大量空白，大家围绕漏洞行动，专挑能得分的事做。"},{"label":"D","text":"扩张：额外投入没有连接到真实资源或长期收益，不能带来增量回报的行为逐渐被排除。"},{"label":"E","text":"超越：它把复杂的人际和协作系统压缩成单一数字模型，用过低维度的指标替代了复杂现实。"}]},
  {"id":"SL-04","text":"一个人投入大量时间做假装努力，结果看起来完整规范，能展示努力痕迹。但一到真本事的检验面前，仍然无法稳定解决实际问题。从解决问题的角度看，这个案例的最大死穴在哪里？","options":[{"label":"A","text":"锚定：大量精力消耗在表面整理上，真正面对问题时反而缺少脑力和注意力余量，底座被形式消耗。"},{"label":"B","text":"动力：表面整理降低了面对阻力的痛感，绕开了真正困难的部分，没有和问题正面对抗。"},{"label":"C","text":"秩序：流程没有闭环，只有记录和整理，缺少独立重做、检验、反馈和修正机制。"},{"label":"D","text":"扩张：训练样本太窄，只围绕原材料反复整理，没有扩展到变式、案例或更多应用场景。"},{"label":"E","text":"超越：它把形式完成误当成了能力形成，把记录和包装这些手段当成了真实掌握本身。"}]},
  {"id":"SL-05","text":"一个人长期按照别人给的目标努力，前期执行稳定。但在接近关键节点时，突然觉得空、失去动力，发生了空心病。从解决问题的角度看，这个案例的最大死穴在哪里？","options":[{"label":"A","text":"锚定：目标一直是外部支撑点，越接近节点越发现它无法提供真实内在安稳，稳定锚点开始松动。"},{"label":"B","text":"动力：长期在完成外部任务，不是由内部动能推动，到了需要持续燃料的阶段，自发动力不足。"},{"label":"C","text":"秩序：目标是直接继承来的，没有形成为什么做、做完通向什么、如何反馈的自洽逻辑链条。"},{"label":"D","text":"扩张：路线太单一，接近终点时意识到单靠这条路径未必能打开足够广的未来选项和生存空间。"},{"label":"E","text":"超越：外部目标只是某套系统中的筛选机制，它可以有用，但不能直接回答个人存在价值和生活意义。"}]},
  {"id":"SL-06","text":"一个小系统为了提高秩序，制定了非常细、非常严格的规则。短期看似更可控，但很快成员紧绷、互相不满，出现了集体摆烂。从解决问题的角度看，这个案例的最大死穴在哪里？","options":[{"label":"A","text":"锚定：系统本来需要休息感和安全感，过细规则让每个人都在被检查状态，空间和关系底座下降。"},{"label":"B","text":"动力：额外监督制造了新的摩擦，行动动能没有提升，反而转成抵触和消极维持。"},{"label":"C","text":"秩序：规则有惩罚条款，却缺少客观判定、执行边界和反馈机制，容易变成互相攻击和推责的工具。"},{"label":"D","text":"扩张：系统只在内部互相消耗，没有引入降低成本的外部资源、工具或分工方式。"},{"label":"E","text":"超越：它试图用静态细碎的规则控制动态生活系统，治理模型本身不适配现实流动性。"}]},
  // 第四批：Γ-N01 ~ Γ-P12（24题）
  {"id":"Γ-N01","text":"他人要求你按统一节奏完成一组要检查的统一任务。但你知道自己真正的问题在另一个更需要真实修复的漏洞上。在这段有限时间里，你具体怎么处理？","options":[{"label":"A","text":"优先完成统一任务，保证可见合规。"},{"label":"B","text":"先完成必要检查部分，再转向真实漏洞。"},{"label":"C","text":"直接处理真实漏洞，承担偏离代价。"},{"label":"D","text":"在两边反复切换，只维持最低推进。"}]},
  {"id":"Γ-N02","text":"一个与你有甩不掉的关系的人，反复制造慢性消耗。如果你不说，关系表面可以继续稳定；如果你说清楚，消耗会下降，但关系可能短期变尴尬。当类似情况再次发生时，你具体怎么处理？","options":[{"label":"A","text":"先配合对方，自己调整位置或节奏，尽量减少影响。"},{"label":"B","text":"保留关系互动，但设置替代机制或固定规则，减少反复消耗。"},{"label":"C","text":"直接说明影响并提出边界，接受关系短期降温。"},{"label":"D","text":"不说明原因，逐渐减少互动或降低回应，用撤退降低消耗。"}]},
  {"id":"Γ-N03","text":"一个对你有影响力的人或系统，对你给出强烈外部评价。如果你吸收它，短期可以降低冲突；如果你拒绝它，可能会继续面对关系压力和评价压力。你能做到自己说了算吗？面对这类评价持续进入时，你具体怎么处理？","options":[{"label":"A","text":"接受评价，把它当成最重要的风险信号，通过补偿行动证明自己。"},{"label":"B","text":"先降低冲突，把评价拆成可改部分和不能吸收的部分，只针对可改项行动。"},{"label":"C","text":"只承认具体事实，不接受对方把评价扩大成自我定义，承担后续压力。"},{"label":"D","text":"暂时停止处理评价内容，从互动中撤出，进入低带宽恢复或延迟处理。"}]},
  {"id":"Γ-N04","text":"外部系统要求你按统一格式完成一项任务，这就是走过场。但如果改用更有效的方式，实际效率更高，却可能被认为不合规。面对这项必须交付的任务，你具体怎么处理？","options":[{"label":"A","text":"按要求完整完成格式，优先保证检查时合规。"},{"label":"B","text":"保留必要格式，对低效重复部分简化，把精力转向真实有效内容。"},{"label":"C","text":"采用自己判断中更有效的方式替代格式，承担不合规评价。"},{"label":"D","text":"只保留能通过检查的表面部分，其他内容最低限度处理。"}]},
  {"id":"Γ-N05","text":"你所在的圈子里的眼光开始持续关注你，且评价标准并不一致。如果你降低可见度，短期可以减少被盯；如果你直接指出问题，可能被持续针对；如果你走另一条路，需要额外消耗。当你再次被这个评价系统贴标签时，你具体怎么处理？","options":[{"label":"A","text":"先降低动作和可见痕迹，避免继续被记录或放大。"},{"label":"B","text":"不扩大当下冲突，转向其他更稳定的评价源建立可见信用。"},{"label":"C","text":"指出评价标准不一致，要求按同一规则处理，并承担后续针对风险。"},{"label":"D","text":"不再主动处理这个系统里的标签，只维持最低限度参与，减少投入。"}]},
  {"id":"Γ-N06","text":"一个与你有重要关系的人，持续用情绪施压向你施压。如果你先安抚，对方情绪会更快降下来；如果你设边界，可能会面对冷战、指责或关系降温。你能区分责任边界吗？当这类情绪压力再次出现时，你具体怎么处理？","options":[{"label":"A","text":"先顺着对方情绪给出回应或承诺，让冲突尽快降下来，暂时按对方期待调整。"},{"label":"B","text":"先让情绪降温，再把可承担部分和不能变成自己责任的部分分开，只处理可修复部分。"},{"label":"C","text":"承认对方有情绪，但说明自己能承担的范围，停止继续接收超出边界的情绪输出。"},{"label":"D","text":"不继续争论，也不清晰说明边界，先从互动中撤出或降低回应，延后处理。"}]},
  {"id":"Γ-N07","text":"你所在的环境持续出现一些噪音。如果你全量吸收，会很容易内耗；如果你完全拒绝，也可能错过少量反馈。你能做到捡有用的听吗？当这类输入持续出现时，你具体怎么处理？","options":[{"label":"A","text":"把这些输入当成需要优先处理的风险信号，反复回想，调整表现以避免再次触发。"},{"label":"B","text":"只提取其中可验证、可改进的部分，对标签化或无法验证的内容不继续投入注意力。"},{"label":"C","text":"判断该输入源整体质量低，减少接触，不再把它作为调整自己的依据。"},{"label":"D","text":"这些杂音持续占用注意力，但没有形成具体修正点，接下来一段时间行动变慢或停滞。"}]},
  {"id":"Γ-N08","text":"一个问题已经存在，问题拖着下去会增加后续成本。完整解决它会消耗较多精力，但做一个最小修复动作是可行的。面对这个已经拖住你的问题，你具体怎么处理？","options":[{"label":"A","text":"先放到一边，等外部检查或截止点靠近时，再集中做能交代过去的部分。"},{"label":"B","text":"不要求一次解决全部，先完成一个最小可执行动作，让问题重新开始移动。"},{"label":"C","text":"暂停其他表面动作，直接处理自己判断中最关键的根部问题，承担短期不完整。"},{"label":"D","text":"暂时不继续看这个问题，转去做别的事或停下来，当下不形成具体修复动作。"}]},
  {"id":"Γ-N09","text":"你已经出现明显的身体报警，继续推进可以保住眼前任务和收益。但身体成本会继续累积。外部还有催命任务在推动。面对身体报警和催命任务同时存在，你具体怎么处理？","options":[{"label":"A","text":"继续按原任务推进，把疲劳或不适先压下去，优先保证眼前结果。"},{"label":"B","text":"保留任务主线，但调整节奏、动作或完成范围，让身体成本降到可承受范围。"},{"label":"C","text":"停止继续透支，减少或推迟一部分任务，接受短期评价或收益损失。"},{"label":"D","text":"继续试着撑一会儿，但状态已经影响行动，最后只能断续处理或低质量撑过当下。"}]},
  {"id":"Γ-N10","text":"你面对一套规则，其中存在一个规则漏洞。利用它可以省下成本、更容易过关，但它可能损害长期信任。面对这个规则漏洞，你具体怎么处理？","options":[{"label":"A","text":"按规则明文要求的最低标准完成，不额外补充没有被要求的部分。"},{"label":"B","text":"按规则完成，同时补充说明或边界，降低漏洞带来的长期风险。"},{"label":"C","text":"不用这个漏洞，按自己认为更一致的标准完成，接受短期成本上升。"},{"label":"D","text":"把结果处理成表面上过得去的样子，不主动说明关键缺口，先通过这次检查或交付。"}]},
  {"id":"Γ-N11","text":"你处在资源有限的环境里，面对有限资源的争夺。如果你先占住更多资源，自己会更安全；如果占位过多会挤压别人。你能设立公平边界吗？面对这类有限资源时，你具体怎么处理？","options":[{"label":"A","text":"优先把资源让出或与他人共享，避免冲突或显得自私，优先保全协作关系和外部评价。"},{"label":"B","text":"保留自己确实需要的部分，同时说清可共享部分、使用规则或归还方式。"},{"label":"C","text":"优先锁定自己系统必须的资源底盘，明确拒绝不合理的共享要求，即使引发关系摩擦。"},{"label":"D","text":"资源先按当下方便的方式放着或用着，边界不先说清，等别人提出问题时再临时调整。"}]},
  {"id":"Γ-N12","text":"你遇到一件让你停滞、挫败的事。叙事安慰可以让你短期稳定下来。但如果只停留在解释里，现实问题不会改变。你需要现实位移。当你开始反复解释这件事时，你具体怎么处理？","options":[{"label":"A","text":"顺着外界或他人的说法，接受那个能让自己舒服的解释和安慰，先在情绪上稳定下来。"},{"label":"B","text":"提取解释中能说服自己的部分暂时安抚情绪，但立刻把它转成一个能验证的小动作或观察点。"},{"label":"C","text":"拒绝吸收那些只能提供情绪价值的解释，强行切断叙事，直接根据内部判断做一个能改变现实的动作。"},{"label":"D","text":"反复解释和复盘，情绪能暂时缓解，但没有形成下一步验证或行动。"}]},
  {"id":"Γ-P01","text":"你突然获得了一段额外的自由资源。它可以用于即时恢复，短期更舒服；也可以投入长期结构，短期舒适下降但未来更稳。面对这段自由资源，你具体怎么处理？","options":[{"label":"A","text":"先用于休息、恢复或处理当下想做的事，暂时不绑定长期计划。"},{"label":"B","text":"留出一部分恢复状态，再把剩余部分固定投入一个长期结构。"},{"label":"C","text":"优先投入长期目标或底层结构，即使短期不够舒服也接受。"},{"label":"D","text":"在休息和投入之间反复犹豫，最后什么也没真正开始，资源在空转中消耗。"}]},
  {"id":"Γ-P02","text":"你因为某个表现获得了明显的外部认可。如果你追随认可，短期正反馈更强；如果你做自我校准，可能会放慢对外展示，但更利于长期路径稳定。面对这次认可，你具体怎么处理？","options":[{"label":"A","text":"继续沿着获得认可的方向投入，把更多资源放到能持续获得正反馈的行为上。"},{"label":"B","text":"接住认可带来的动力，但分析具体哪里有效，把可复用部分沉淀下来。"},{"label":"C","text":"不把认可作为主要方向依据，继续推进自己判断中更重要但短期不显眼的目标。"},{"label":"D","text":"既想继续追认可又觉得该自我校准，反复拉扯，哪个方向都没真正深入。"}]},
  {"id":"Γ-P03","text":"你和某个人目前处于低摩擦关系，相处很顺。但如果未来责任变重，缺少深层边界可能会制造隐性冲突。面对这段低摩擦关系，你具体怎么处理？","options":[{"label":"A","text":"继续按当前顺畅方式相处，不急着讨论责任、边界或未来摩擦点。"},{"label":"B","text":"保持轻松互动，但在自然时机说清一两个具体规则或协作边界。"},{"label":"C","text":"主动把重要边界、责任或未来冲突点谈清楚，接受气氛短暂变严肃。"},{"label":"D","text":"意识到该设边界但一直拖着没说，心里反复琢磨却没有行动。"}]},
  {"id":"Γ-P04","text":"你突然获得了一段不被打扰的时间。它可以用于恢复放松，短期更轻松；也可以用于深度修复长期短板，短期不一定舒服但长期更稳。面对这段不被打扰的时间，你具体怎么处理？","options":[{"label":"A","text":"先用于休息、恢复或处理轻任务，暂时不进入高消耗的深层修复。"},{"label":"B","text":"先用一小段时间恢复状态，再把剩余时间投入一个明确的长期短板。"},{"label":"C","text":"直接处理最长期、最底层、最容易被平时拖掉的问题，接受短期不轻松。"},{"label":"D","text":"在该休息和该做事之间反复拉扯，最后完整时间在碎片化消耗中过去。"}]},
  {"id":"Γ-P05","text":"你获得了更大的新增权限。如果先使用权限，推进会更快；如果先建立责任结构，推进会变慢但结构更稳。面对这份新增权限，你具体怎么处理？","options":[{"label":"A","text":"先按自己的判断直接调用权限，把资源或流程调到更方便推进的方向。"},{"label":"B","text":"使用权限推进关键事项，同时说明资源分配、责任边界和反馈方式。"},{"label":"C","text":"先暂停直接调用权限，把边界、责任、反馈和退出条件说清楚，再开始调度。"},{"label":"D","text":"一边想快速推进一边又担心后续混乱，反复纠结如何开始，权限被搁置消耗。"}]},
  {"id":"Γ-P06","text":"你持续获得很高的高评价输入。如果你全量吸收，短期状态更强；如果你筛选吸收，保持内核稳定，兴奋感会降低但内核更稳。面对这些持续进入的高评价，你具体怎么处理？","options":[{"label":"A","text":"接受这些高评价，把它们当成自己方向和能力已经被充分证明的信号。"},{"label":"B","text":"接住好评带来的动力，但只提取其中可验证、可复用的部分来校准能力和路径。"},{"label":"C","text":"不把高评价作为主要自我判断依据，继续按内部标准检查能力、路径和问题。"},{"label":"D","text":"被好评推着越来越关注外部反馈，但隐隐觉得自己正在被期待绑架，左右为难。"}]},
  {"id":"Γ-P07","text":"你突然拥有了一部分冗余的资源。它可以用于当下减压，短期更舒服；也可以投入让自己更高效，短期余量减少但长期结构更稳。面对这部分冗余资源，你具体怎么处理？","options":[{"label":"A","text":"先用于改善当前状态、降低近期压力或增加安全感，暂时不做复杂升级。"},{"label":"B","text":"保留一部分作为安全缓冲，再把剩余部分投入一个能降低未来成本的系统改进。"},{"label":"C","text":"优先投入会降低未来运行成本的系统升级，即使短期余量变少也接受。"},{"label":"D","text":"想改善现状又想升级系统，反复权衡后资源在犹豫中消耗，两边都没推进。"}]},
  {"id":"Γ-P08","text":"你和某个人或某段关系正在关系升温。如果顺着升温走，关系会更快变近；如果保留自我边界，关系更可持续，但对方可能短期觉得你不够投入。面对这段正在升温的关系，你具体怎么处理？","options":[{"label":"A","text":"顺着关系变近的节奏，增加互动和共享，个人时间或节奏先跟着关系需要调整。"},{"label":"B","text":"继续增加亲近和共享，但说清一两个具体边界，例如独处时间、工作或学习时段或回应节奏。"},{"label":"C","text":"不让关系升温扩大到所有生活区域，明确保留自己的时间、空间或决策边界。"},{"label":"D","text":"心里清楚需要设边界但行动上一直顺着走，总想着下次再说，边界始终没落地。"}]},
  {"id":"Γ-P09","text":"你刚刚获得一次成功反馈。如果继续沿用成功做法，短期推进更顺；如果做能力沉淀，短期兴奋感下降但更容易形成可迁移能力。面对这次成功反馈，你具体怎么处理？","options":[{"label":"A","text":"继续沿用这次有效的做法，暂时不急着拆解哪些因素能长期复用。"},{"label":"B","text":"复盘哪些动作、条件或能力真正起作用，并把可复用部分记录下来。"},{"label":"C","text":"用另一个小场景验证关键做法是否可迁移，如果不能迁移就调整判断。"},{"label":"D","text":"沉浸在成功的兴奋感里不断回放、展示，但没有真正拆解或验证可迁移的部分。"}]},
  {"id":"Γ-P10","text":"你获得了一条低成本通道。如果你使用通道，短期效率更高；如果训练深层能力，短期结果慢一些，但长期更稳。面对这条低成本通道，你具体怎么处理？","options":[{"label":"A","text":"先使用这条现成通道完成任务，让结果更快出来，底层能力之后再补。"},{"label":"B","text":"使用通道完成主要任务，同时留出一部分时间拆解原理或练习一个底层能力。"},{"label":"C","text":"不主要依赖通道，先自己拆原理、练基础或补关键能力，接受结果慢一些。"},{"label":"D","text":"一边用通道觉得省力，一边又担心能力退化，来回纠结但没改变使用习惯。"}]},

  {"id":"Γ-P12","text":"你突然对一件事产生了很强的意义打开。如果只停留在愿景里，现实不会变化；如果做现实落地，愿景会被压缩成具体成本和验证压力。面对这份打开的意义感，你具体怎么处理？","options":[{"label":"A","text":"先继续整理愿景、价值和想象，让自己获得更强的动力和确认感。"},{"label":"B","text":"把意义拆成一个阶段目标、一个最小验证动作和需要调用的资源。"},{"label":"C","text":"不继续扩写愿景，先做一个能验证这份意义是否成立的现实动作。"},{"label":"D","text":"不断扩展愿景和表达，但具体目标、验证动作和资源安排始终不清楚，纯叙事空转。"}]},
  // 第五批：ε-01 ~ ε-16（16题）

  {"id":"ε-05","text":"如果今天突然多出一个麻烦变量，比如计划被打断、要求变化或小冲突出现，我的心理系统更像：","options":[{"label":"A","text":"很可能直接失控、停住或想切断所有事情。"},{"label":"B","text":"能表面撑住，但内在已经接近警戒线。"},{"label":"C","text":"有压力，但可以纳入现有机制正常消化。"},{"label":"D","text":"能拆解变量，重新安排优先级。"},{"label":"E","text":"可以把它当成可利用变量，顺势重组局面。"}]},

  {"id":"ε-08","text":"当我正在做事却被打断时，我的心理恢复更接近：","options":[{"label":"A","text":"很容易直接断线，原来的事也很难再接上。"},{"label":"B","text":"会明显烦躁，需要较久才能重新进入状态。"},{"label":"C","text":"会受影响，但还能回到原任务。"},{"label":"D","text":"能较快重排节奏，继续推进。"},{"label":"E","text":"可以顺手把打断变量纳入整体安排，反而推进得更清楚。"}]},
  {"id":"ε-09","text":"我此刻面对外界接触时，第一底色更接近：","options":[{"label":"A","text":"很容易感到被冒犯、被攻击或被消耗。"},{"label":"B","text":"有排斥感，不太想接触人或事。"},{"label":"C","text":"中性，只是接收和处理信息。"},{"label":"D","text":"基本平稳，能给外界一点理解空间。"},{"label":"E","text":"有明显善意，愿意主动释放支持或共情。"}]},
  {"id":"ε-10","text":"如果有人现在向我提出一个不算严重、但有点打扰的请求，我的第一反应更像：","options":[{"label":"A","text":"觉得对方在消耗我、压迫我或冒犯我。"},{"label":"B","text":"有烦躁感，想尽快拒绝或结束。"},{"label":"C","text":"中性判断，看请求是否合理。"},{"label":"D","text":"能理解对方为什么来找我，再决定边界。"},{"label":"E","text":"愿意主动提供一点支持，甚至多想一步怎么帮。"}]},
  {"id":"ε-11","text":"当别人做出一个模糊行为，比如没有及时回复、语气一般、临时改变安排，我更容易：","options":[{"label":"A","text":"先理解成针对、轻视或恶意。"},{"label":"B","text":"倾向于觉得对方很烦或不可靠。"},{"label":"C","text":"暂时不下判断，等更多信息。"},{"label":"D","text":"会先给一个中性或温和解释。"},{"label":"E","text":"会主动考虑对方是否也有压力或困难。"}]},

  {"id":"ε-13","text":"我此刻对行动的倾向更接近：","options":[{"label":"A","text":"想切断、逃离、掀桌或结束连接。"},{"label":"B","text":"只想退回最小安全区，不想新增任何动作。"},{"label":"C","text":"按原计划维持，不主动扩张也不主动改变。"},{"label":"D","text":"想修补、优化或推进一个具体问题。"},{"label":"E","text":"很想扩大行动范围，建立新结构、新秩序或新局面。"}]},
  {"id":"ε-14","text":"如果现在给我一个没有人强迫的自由行动窗口，我更可能：","options":[{"label":"A","text":"直接远离当前任务、关系或环境。"},{"label":"B","text":"什么都不新增，先保安全和安静。"},{"label":"C","text":"按惯性做原来的事。"},{"label":"D","text":"用它修补一个具体问题。"},{"label":"E","text":"用它发起一个更大的计划或扩张动作。"}]},

  {"id":"ε-16","text":"面向接下来24小时，我的行动欲望更接近：","options":[{"label":"A","text":"想退出、断开、停止被任何事情牵引。"},{"label":"B","text":"只想维持最低运转，避免新增负荷。"},{"label":"C","text":"正常完成已有事项即可。"},{"label":"D","text":"想主动推进一个具体目标或修复一个问题。"},{"label":"E","text":"想明显扩张行动范围，启动更大的计划或结构。"}]}

// ==================== 完全整合的前端渲染 + 计分引擎 ====================
(function() {
  var userAnswers = {};
    // 恢复上次未提交的答案
  var savedAnswers = localStorage.getItem('careerTestAnswers');
  if (savedAnswers) {
      try { userAnswers = JSON.parse(savedAnswers); } catch(e) {}
  }
  var total = ALL_QUESTIONS.length;
var LAYERS = [
    { start: 1,  end: 20, name: '核心身份', total: 20, icon: '🌱' },
    { start: 21, end: 25, name: '代价结算', total: 5,  icon: '⚖️' },
    { start: 26, end: 31, name: '归因分析', total: 6,  icon: '🔍' },
    { start: 32, end: 55, name: '反馈代谢', total: 24, icon: '🔄' },
    { start: 56, end: 71, name: '能量状态', total: 16, icon: '🔋' }
];
  
  // ── 关键词提示功能（两步安全替换法，杜绝嵌套污染）──
function addTooltips(text) {
    var sortedKeys = Object.keys(TOOLTIPS).sort(function(a, b) { return b.length - a.length; });
    
    // 建立占位符与关键词的映射
    var placeholderMap = {};
    var index = 0;
    
    // 第一步：将每个关键词替换为纯数字占位符（不含任何中文或关键词文本）
    sortedKeys.forEach(function(key) {
        var escapedKey = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        var regex = new RegExp(escapedKey, 'g');
        var placeholder = '%%KWPLACEHOLDER_' + index + '%%';
        placeholderMap[placeholder] = key;
        text = text.replace(regex, placeholder);
        index++;
    });
    
    // 第二步：将所有占位符替换为安全的 span 标签
    Object.keys(placeholderMap).forEach(function(placeholder) {
        var key = placeholderMap[placeholder];
        while (text.indexOf(placeholder) !== -1) {
            text = text.replace(placeholder, '<span class="keyword-tip" data-key="' + key.replace(/"/g, '&quot;') + '" title="点击查看提示">' + key + '</span>');
        }
    });
    
    return text;
}
  // ── 渲染所有题目（带关键词高亮 + 半透明限制条件）──
function renderQuestions() {
    var html = "";
    ALL_QUESTIONS.forEach(function(q, i) {
        var no = i + 1;
        var questionText = addTooltips(q.text.replace(/\n/g, '<br>'));
        var opts = q.options.map(function(o) {
            var parts = o.text.split('||');
            var mainText = addTooltips(parts[0]);
            var cautionHtml = parts.length > 1 ? '<span class="caution">' + addTooltips(parts[1]) + '</span>' : '';
            return '<label class="option" data-qid="' + q.id + '" data-val="' + o.label + '"><input type="radio" name="' + q.id + '" value="' + o.label + '"><strong>' + o.label + '.</strong> ' + mainText + cautionHtml + '</label>';
        }).join("");
        html += '<div class="card" data-qid="' + q.id + '"><div class="card-num">题目 ' + no +' / ' + total + '</div><div class="card-text">' + questionText + '</div>' + opts + '</div>';
    });
    document.getElementById("quizList").innerHTML = html;
// 恢复已选答案的选中状态
    for (var qid in userAnswers) {
        var val = userAnswers[qid];
        var opt = document.querySelector('.option[data-qid="' + qid + '"][data-val="' + val + '"]');
        if (opt) {
            opt.classList.add('selected');
            opt.querySelector('input').checked = true;
        }
    }
    // 绑定选项点击事件
    document.querySelectorAll(".option").forEach(function(lbl) {
        lbl.onclick = function(e) {
    // 如果点击的目标是关键词提示元素，则不处理选项选中
    if (e.target.classList && e.target.classList.contains('keyword-tip')) {
        return;
    }
    var qid = this.dataset.qid;
    var val = this.dataset.val;
            document.querySelectorAll('.option[data-qid="' + qid + '"]').forEach(function(o) { o.classList.remove("selected"); });
            this.classList.add("selected");
            this.querySelector("input").checked = true;
            userAnswers[qid] = val;
            updateProgress();
        };
    });
}

// 全局关键词点击代理，彻底避免 HTML 属性注入
document.addEventListener('click', function(e) {
    if (e.target.classList.contains('keyword-tip')) {
        var key = e.target.getAttribute('data-key');
        if (key && TOOLTIPS[key]) {
            alert(TOOLTIPS[key]);
        }
        e.stopPropagation();
    }
});
  // ── 进度条更新（复用心理学测试设计）──
function updateProgress() {
    var answered = Object.keys(userAnswers).length;
    var pct = Math.round((answered / total) * 100);
    document.getElementById("progressBarFill").style.width = pct + "%";
    document.getElementById("progressText").innerText = answered + " / " + total;
    var btn = document.getElementById("btnSubmit");
    if (answered < total) {
        btn.classList.add("btn-pending");   // 未答完时加一个灰色样式
    } else {
        btn.classList.remove("btn-pending"); // 答完恢复
    }

    // ── 层级进度更新 ──
    var currentLayerIndex = LAYERS.length - 1;
    for (var i = 0; i < ALL_QUESTIONS.length; i++) {
        if (!userAnswers[ALL_QUESTIONS[i].id]) {
            var currentQNo = i + 1;
            for (var j = 0; j < LAYERS.length; j++) {
                if (currentQNo >= LAYERS[j].start && currentQNo <= LAYERS[j].end) {
                    currentLayerIndex = j; break;
                }
            }
            break;
        }
    }
    var layer = LAYERS[currentLayerIndex];
    var layerAnswered = 0;
    for (var k = layer.start - 1; k < layer.end; k++) {
        if (userAnswers[ALL_QUESTIONS[k].id]) layerAnswered++;
    }
    document.getElementById("layerInfo").innerHTML =
        '<span class="layer-tag">' + layer.icon + ' 第' + (currentLayerIndex + 1) + '层 · ' + layer.name + '</span>' +
        '<span class="layer-progress">' + layerAnswered + '/' + layer.total + '</span>';
     // 自动保存答案
    localStorage.setItem('careerTestAnswers', JSON.stringify(userAnswers));
}
  // ── 提交 & 计分引擎（完全保留您原版的逻辑）──
  document.getElementById("btnSubmit").onclick = function() {
    // 漏题检查：若未答完，则定位跳转
var answeredCount = Object.keys(userAnswers).length;
if (answeredCount < total) {
    alert('您还有 ' + (total - answeredCount) + ' 道题未答，正在为您定位到第一道漏题。');

    // 找到第一个未回答的题目id
    var firstMissingQid = null;
