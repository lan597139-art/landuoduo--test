<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>职业性格测试</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "PingFang SC","Microsoft YaHei",sans-serif; background:#f0f2f5; color:#333; }
    .container { max-width:750px; margin:0 auto; padding:20px; }
    .header { text-align:center; padding:30px 20px; background:#fff; border-radius:12px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .header h1 { font-size:28px; margin-bottom:10px; }
    .header p { color:#666; font-size:14px; }
    .btn { display:inline-block; padding:12px 32px; background:#4a6cf7; color:#fff; border:none; border-radius:8px; font-size:16px; cursor:pointer; transition:all .2s; }
    .btn:hover { background:#3b5de7; }
    .btn:disabled { background:#bbb; cursor:not-allowed; }
    .card { background:#fff; border-radius:10px; padding:20px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.04); }
    .card-num { font-size:13px; color:#999; margin-bottom:8px; }
    .card-text { font-size:16px; margin-bottom:12px; line-height:1.6; }
    .option { display:block; padding:10px 14px; margin:6px 0; border:1.5px solid #e0e0e0; border-radius:8px; cursor:pointer; transition:all .15s; }
    .option:hover { border-color:#4a6cf7; background:#f6f8ff; }
    .option.selected { border-color:#4a6cf7; background:#eef1ff; }
    .option input { display:none; }
    .submit-wrap { text-align:center; margin:20px 0; }
    .report { background:#fff; border-radius:12px; padding:24px; margin-top:20px; box-shadow:0 2px 8px rgba(0,0,0,.06); display:none; }
    .report h2 { font-size:20px; margin:20px 0 10px; border-bottom:2px solid #4a6cf7; padding-bottom:6px; }
    .report h2:first-child { margin-top:0; }
    .report p { margin:8px 0; line-height:1.7; }
    .progress-wrap { background:#e0e0e0; border-radius:6px; height:8px; margin:20px 0; position:sticky; top:10px; z-index:10; }
    .progress-bar { height:100%; border-radius:6px; background:#4a6cf7; width:0%; transition:width .3s; }
  </style>
</head>
<body>

<div class="container">
  <div class="header" id="headerBox">
    <h1>职业性格测试</h1>
    <p>了解你的心智动力结构、压力弹性与代谢模式<br>共71题，预计用时15-20分钟</p>
    <button class="btn" id="btnStart" style="margin-top:16px;">开始测试</button>
  </div>

  <div id="quizArea" style="display:none;">
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div id="quizList"></div>
    <div class="submit-wrap"><button class="btn" id="btnSubmit" disabled>提交答案</button></div>
  </div>

  <div class="report" id="reportBox"></div>
</div>

<script>
// ==================== 题库 (71题) ====================
var ALL_QUESTIONS = [
  // ... 这里是你全部的71道题目数据，因长度限制此处省略，请务必保留你之前完整的数据 ...
];
// 注意：上面这行“...”仅表示省略，实际代码中请保留你之前那完整的71道题数据。

// ==================== 前端渲染 + 计分引擎（完整字典版） ====================
(function() {
  var userAnswers = {};
  var total = ALL_QUESTIONS.length;

  document.getElementById("btnStart").onclick = function() {
    document.getElementById("headerBox").style.display = "none";
    document.getElementById("quizArea").style.display = "block";
    renderQuestions();
  };

  function renderQuestions() {
    var html = "";
    ALL_QUESTIONS.forEach(function(q, i) {
      var no = i + 1;
      var opts = q.options.map(function(o) {
        return '<label class="option" data-qid="' + q.id + '" data-val="' + o.label + '"><input type="radio" name="' + q.id + '" value="' + o.label + '"><strong>' + o.label + '.</strong> ' + o.text + '</label>';
      }).join("");
      html += '<div class="card"><div class="card-num">题目 ' + no + ' / ' + total + '</div><div class="card-text">' + q.text + '</div>' + opts + '</div>';
    });
    document.getElementById("quizList").innerHTML = html;

    document.querySelectorAll(".option").forEach(function(lbl) {
      lbl.onclick = function() {
        var qid = this.dataset.qid;
        var val = this.dataset.val;
        document.querySelectorAll('.option[data-qid="' + qid + '"]').forEach(function(o) { o.classList.remove("selected"); });
        this.classList.add("selected");
        this.querySelector("input").checked = true;
        userAnswers[qid] = val;
        updateProgress();
      };
    });
  }

  function updateProgress() {
    var answered = Object.keys(userAnswers).length;
    var pct = Math.round((answered / total) * 100);
    document.getElementById("progressBar").style.width = pct + "%";
    document.getElementById("btnSubmit").disabled = (answered < total);
  }

  document.getElementById("btnSubmit").onclick = function() {
    // --- 初始化计分池 ---
    var S_pool = { O:0, V:0, D:0, E:0, T:0 };
    var N_pool = { PN:0, AN:0, RN:0, IN:0, MN:0, FN:0 };
    var F_pool = { SS:0, DS:0, SN:0, DN:0, Ch:0 };
    var Sigma  = { s0:0, s1:0, s2s:0, s2c:0 };
    var SL_pool = { O:0, V:0, D:0, E:0, T:0 };
    var G_neg = { A:0, B:0, C:0, D:0 };
    var G_pos = { A:0, B:0, C:0, D:0 };
    var eps = [];

    ALL_QUESTIONS.forEach(function(q) {
      var val = userAnswers[q.id];
      if (!val) return;
      var id = q.id;

      if (id.startsWith("S-C")) { var m={A:"O",B:"V",C:"D",D:"E",E:"T"}; if(m[val]) S_pool[m[val]]+=2; }
      else if (id.startsWith("N-C")) { var m={A:"PN",B:"AN",C:"RN",D:"IN",E:"MN",F:"FN"}; if(m[val]) N_pool[m[val]]+=2; }
      else if (/^C0[1-4]$/.test(id)) { var m={A:"O",B:"V",C:"D",D:"E",E:"T"}; if(m[val]) S_pool[m[val]]+=2; }
      else if (/^F0[1-4]$/.test(id)) {
        var fMap = {F01:{A:{SN:2,SS:2},B:{SN:2,DS:2},C:{DN:2,SS:2},D:{DN:2,DS:2},E:{Ch:2}},F02:{A:{SS:2},B:{DS:2},C:{DS:1,SS:1},D:{DS:2},E:{Ch:2}},F03:{A:{SN:2},B:{DN:2},C:{DN:1,Ch:1},D:{DN:1,Ch:1},E:{Ch:2}},F04:{A:{SS:2,SN:2},B:{DS:2,SN:2},C:{SS:2,DN:2},D:{DS:2,DN:2},E:{Ch:2}}};
        if (fMap[id] && fMap[id][val]) { var a=fMap[id][val]; F_pool.SS+=a.SS||0; F_pool.DS+=a.DS||0; F_pool.SN+=a.SN||0; F_pool.DN+=a.DN||0; F_pool.Ch+=a.Ch||0; }
      }
      else if (id.startsWith("st-")) { var m={A:"s0",B:"s1",C:"s2s",D:"s2c"}; if(m[val]) Sigma[m[val]]++; }
      else if (id.startsWith("SL-")) { var m={A:"V",B:"D",C:"O",D:"E",E:"T"}; if(m[val]) SL_pool[m[val]]+=2; }
      else if (id.startsWith("Γ-N")) { var m={A:"A",B:"B",C:"C",D:"D"}; if(m[val]) G_neg[m[val]]++; }
      else if (id.startsWith("Γ-P")) { var m={A:"A",B:"B",C:"C",D:"D"}; if(m[val]) G_pos[m[val]]++; }
      else if (id.startsWith("ε-")) { var s={A:1,B:2,C:3,D:4,E:5}; if(s[val]) eps.push(s[val]); }
    });

    // --- 结算逻辑 ---
    var sArr = Object.entries(S_pool).sort((a,b)=>b[1]-a[1]);
    var S1 = sArr[0][0], S2 = sArr.length>1 && sArr[1][1]>0 ? sArr[1][0] : null;
    var nArr = Object.entries(N_pool).sort((a,b)=>b[1]-a[1]);
    var N1 = nArr[0][0], N2 = nArr.length>1 && nArr[1][1]>0 ? nArr[1][0] : null;
    var dualS = F_pool.DS >= F_pool.SS && F_pool.DS > F_pool.Ch;
    var dualN = F_pool.DN >= F_pool.SN && F_pool.DN > F_pool.Ch;
    var sigArr = [Sigma.s0, Sigma.s1, Sigma.s2s, Sigma.s2c];
    var sigMax = Math.max(...sigArr);
    var sigDom = sigArr[0]===sigMax?"σ0":sigArr[1]===sigMax?"σ1":sigArr[2]===sigMax?"σ2_switch":"σ2_collapse";
    var L1 = Object.entries(SL_pool).sort((a,b)=>b[1]-a[1])[0][0];
    
    function getMetaLabel(c) {
      var m = Math.max(c.A,c.B,c.C,c.D);
      var dom = c.D===m?"空转主导":c.C===m?"内源主导":c.B===m?"灰度主导":"外源主导";
      var arr = Object.entries(c).sort((a,b)=>b[1]-a[1]);
      if (arr.length>1 && arr[1][1]>=3 && arr[1][1]<m) {
        var aux = arr[1][0]==="C"?"内源辅助":arr[1][0]==="B"?"灰度辅助":arr[1][0]==="A"?"外源辅助":"空转倾向";
        return dom + " · " + aux;
      }
      return dom;
    }
    var metaNeg = getMetaLabel(G_neg);
    var metaPos = getMetaLabel(G_pos);
    var loadPool=0, stressPool=0, emotionPool=0, motivePool=0;
    for(var i=0; i<eps.length; i++) {
      if(i<4) loadPool+=eps[i];
      else if(i<8) stressPool+=eps[i];
      else if(i<12) emotionPool+=eps[i];
      else motivePool+=eps[i];
    }
    var epsTotal = loadPool+stressPool+emotionPool+motivePool;
    var epsZone = epsTotal<=28?"🔴 红区":epsTotal<=44?"🟠 橙区":epsTotal<=60?"🟢 绿区":epsTotal<=72?"🔵 蓝区":"🟣 紫区";

    // --- 字典与报告生成（严格按照文档，一字不差） ---
    var eName = {O:"结构引擎",V:"锚定引擎",D:"动力引擎",E:"扩张引擎",T:"超越引擎"};
    var nName = {PN:"身体/空间/资源",AN:"成长/能力/路径",RN:"关系/亲密/协作",IN:"群体/评价/位置",MN:"意义/信念/目标",FN:"机制/流程/系统"};
    var eDesc = {
      O:"你的一生都在追求秩序对混乱的物理统治。你不满足于简单的顺从，而是致力于亲手打造一个精密、可预测且严丝合缝的闭环世界，将一切不确定性彻底驯服为可控的铁律。为此能够牺牲短期灵活度；承担前期繁琐的搭建成本；忍受他人的不守规矩。",
      V:"你是系统在动荡与变局中的最后支点。你重视历史连接与安全底座，当外部环境陷入失控与悬空时，你负责守住那一分归属感与最后的安全防线，是动荡中为众人提供灵魂依托的最后防线。为此你能够牺牲扩张速度；承受长期的维持性内耗；承担拖后腿的沉没成本。",
      D:"你拒绝平庸的温吞维持，生命力在强力的碰撞中才达到巅峰。你像一个拒绝后退的破局者，擅长在僵局中制造剧烈的系统位移，通过直面阻力和对抗，强行点燃停滞事物的引擎，推动一切跨越障碍。为此你能够担高强度冲突；承受关系紧张；消耗大量体能与情绪。",
      E:"你对已知的存量版图毫无眷恋，嗅觉永远锚定在未知的增量边界。你像一个不停开启新接口的捕猎者，永远在嗅探外部的新机会与新连接，持续扩大系统做功的吞吐量与影响力上限。为此你能够承担资源失控的风险；承受精力被极度拉散；忍受基本盘的不稳定。",
      T:"你并不住在现成的规则里，你住在逻辑之上的云端。你习惯抽离一切现实表象的约束，直击核心的第一性原理；你从不盲从现有的结论，而是热衷于从地基处重新定义这个世界的最高解释权。为此你能够短期孤独与不被理解；慢回报；为了正确结构牺牲短期世俗舒适。"
    };
    var nDesc = {
      PN:"你的力量必须降落在物理底盘（作息、健康、现金流、物资及空间秩序）上才能真正生效。你是一个现实世界的建造者，你并不相信虚无的承诺，只在乎那些看得见、摸得着、能被绝对掌控的物质安全与空间秩序。因此你拒绝纯虚拟、纯概念、无任何实物落地的空转地带。",
      AN:"你的力量必须降落在个人演化（技能训练、职业履历、项目经验及试错路径）上才能真正生效。你将人生看作一场永不停歇的升级游戏，每一次做功都在为自己的能力版图增砖添瓦，致力于将自我打造成一个不可替代的进化体。因此你拒绝机械重复、一眼望到头、毫无成长空间的流水线。",
      RN:"你的力量必须降落于人际连接（同伴、伴侣、合伙人及长期契约）上才能真正生效。你是一个灵魂与契约的编织者，你的影响力通过他人的信任、回应与深度协作来传递，在人与人的共振中实现价值的最大化。因此你拒绝纯粹冰冷的数据核算、绝对理性的杀伐决断区。",
      IN:"你的力量必须降落在社会网络（组织占位、圈层话语权、公众评价及身份标签）上才能真正生效。你擅长在错综复杂的社会洋流中导航，通过夺取核心位置与塑造群体评价，将个人的姓名转化为一种具备统治力的符号与重权。因此你拒绝无人问津、极度封闭、无需任何社交背书的孤岛。",
      MN:"你的力量必须降落在精神范式（人生愿景、价值信仰、底层观念及宏大叙事）上才能真正生效。你是一个火种的守护者，只在那些关于“意义”与“终极目标”的高海拔地带做功，通过对价值底座的修筑来决定现实世界的走向。因此你拒绝毫无意义的官僚内耗、每天朝令夕改的糊涂账区。",
      FN:"你的力量必须降落在抽象架构（商业模型、协作规则、工具链及反馈闭环）上才能真正生效。你是一个逻辑的工程师，擅长将复杂的现实编码为隐形的机制，通过对反馈闭环的极致精准操作，确保整个世界像钟表一样分秒不差地运行。因此你拒绝毫无规则、纯靠人情世故和拍脑袋做决定的混沌区。"
    };
    
    // 心腹标签判定
    var confidant = "";
    var S_has = (e)=>(S1===e || S2===e);
    var N_has = (s)=>(N1===s || N2===s);
    if ((S_has("O")||S_has("T")) && (N_has("FN")||N_has("MN")||N_has("AN"))) confidant = "谋臣型心腹";
    else if ((S_has("O")||S_has("D")) && (N_has("FN")||N_has("AN")||N_has("PN"))) confidant = "执行型心腹";
    else if ((S_has("D")||S_has("E")) && (N_has("IN")||N_has("PN")||N_has("AN"))) confidant = "开疆型心腹";
    else if ((S_has("V")||S_has("O")) && (N_has("RN")||N_has("PN")||N_has("FN"))) confidant = "维稳型心腹";
    else if ((S_has("T")||S_has("E")) && (N_has("MN")||N_has("IN")||N_has("RN"))) confidant = "布道型心腹";
    else confidant = "系统型心腹";

    var confText = {
      "谋臣型心腹":"你最核心的价值在于提供超越现状的判断力，系统应当授予你全局诊断与长期战略规划的重权。为了确保逻辑的准确性，必须为你提供完整的信息透明度。应避免将你置于追求极速变现或高压社交应酬的环境中，以免损耗你的战略带宽。你会被谨慎的深用，并制衡全责。",
      "执行型心腹":"你是确保目标从概念转化为现实的关键，应授权你负责流程落地与交付闭环。为了发挥你的最高效率，系统必须搭配明确的目标指示与验收标准。禁止将你置于高度无序的环境中，你需要清晰的规则边界来完成高标准的交付。你会被即插即用般的深用。",
      "开疆型心腹":"你是打破存量僵局的利刃，适合授权你进行市场突破、资源置换与外部圈层扩张。由于你的做功方式通常具有破坏性，系统需配套强力的风控审计工具作为支撑。不宜将你放置在需要长期精细化维稳的岗位，那会抑制你的爆发力。你会被半核心地位使用，并接受强力的风控监管。",
      "维稳型心腹":"你是系统抵御风险的防火墙，应授权你负责底盘维护、人际关系调停与风险兜底。为了确保你的稳定性，系统必须给予你足够的资源缓冲与心理余量。严禁要求你发起具有高风险的破坏性创新，以免动摇你的防御核心。你会被深用，置于后方核心。",
      "布道型心腹":"你是组织共识与影响力的构建核心，适合授权你负责文化建设、愿景解释与外部影响力构建。你擅长赋予行动以意义感，但系统需同步防范你的愿景构思与现实成本脱节。禁止将你锁死在低维、机械重复的流水线作业中，那将是对你认知带宽的极大浪费。你会被视为外围/影响力圈核心。",
      "系统型心腹":"你是组织机制的底层设计者，适合授权你负责流程架构、系统搭建与知识体系建设。你的价值在于将散乱的经验编码为可复用的机制。系统需为你提供足够的抽象空间和长周期项目。禁止将你置于短期杂活、纯人情场或无授权背锅的环境中，那将直接瓦解你的结构化能力。"
    };

    // 职业方向 (基于S1判定)
    var careerMap = {
      "T": {dir:"战略、研究、咨询、架构、顶层设计",pos:"战略顾问、管理咨询、行业研究、政策研究、产品战略、创始人参谋、组织诊断",unsuit:"纯执行、强应酬、低信息透明、只背锅无决策权"},
      "O": {dir:"风控、合规、财务、审计、规则、边界管理",pos:"法务、合规、风控、财务审核、内控、质量管理、流程审核",unsuit:"灰区套利、高速扩张、规则模糊但要求背责"},
      "D": {dir:"改革、危机处理、突击项目、竞争突破",pos:"改革项目负责人、危机公关、销售冲锋、增长突击、问题项目救火",unsuit:"长期低刺激维护、细水长流陪伴、纯规则文书岗"},
      "E": {dir:"商务、增长、市场、渠道、人脉、资源整合",pos:"BD、销售负责人、渠道经理、融资助理、商务拓展、增长负责人",unsuit:"核心机密无制衡、高权限低监管、长期纯后台"},
      "V": {dir:"关系维护、用户陪伴、社群、服务、内部稳定",pos:"HRBP、员工关系、客户成功、社群运营、心理陪伴型服务",unsuit:"高权力决策、复杂利益分配、强对抗谈判、长期单向消耗"}
    };
    var career = careerMap[S1] || careerMap["T"];

    // 完整版报告拼接
    var report = "";
    report += '<h2>🔧 你的核心驱动力</h2>';
    report += '<p><strong>主引擎：' + eName[S1] + '</strong></p><p>' + eDesc[S1] + '</p>';
    if (S2) report += '<p><strong>副引擎：' + eName[S2] + '</strong></p><p>' + eDesc[S2] + '</p>';
    
    report += '<h2>🌐 你的力量主战场</h2>';

    report += '<h2>🔍 你的危机归因本能</h2>';
    var logicText = {
      O:"面对危机，你最容易将问题的根源归咎于规则的模糊与流程的断裂。在你看来，如果系统失灵，必然是因为权责边界不再清晰，或者是反馈闭环在某个环节失去了效力。因此，你会优先着手重新梳理责任的边界，通过建立不容置疑的新规则并锁死执行闭环，从地基处稳住摇晃的系统。与此同时，你最容易忽略参与者真实的情绪承载力以及非理性的动能消耗。在极端高压下，你极易表现出“只管流程进度，不管系统死活”的冷酷，导致系统缓冲空间彻底崩溃。这种认知视角赋予了你迅速发现流程漏洞、一眼看出谁没尽责、哪里的闭环断了的优势。但潜在的风险在于，当别人需要当下的情绪安抚、安全感确认与被倾听时，你可能已经跳到了“这个系统哪里错了”的冷峻诊断中。",
      V:"面对危机，你最容易将问题的根源归咎于安全感的丧失与关系的过度紧绷。你认为当一个环境变得令人窒息，必然是因为底层失去了容错的缓冲以及相互支撑的底座。因此，你会优先致力于重建信任的底座，先恢复一个熟悉且安全的软环境，给予系统足够的喘息余量，让一切重回正轨。与此同时，你最容易忽略客观效率的停滞以及必要硬性规则的缺失。在极端高压下，你极易为了维持表面的安全与关系而选择无限的妥协，任由系统陷入低效的空转。这种认知视角赋予了你敏锐察觉系统不稳定因素、提前感知到谁的心态崩了、哪里缺乏兜底的优势。但潜在的风险在于，当别人需要清晰的指令标准、公平的责任划分与明确的反馈时，你可能还在纠结于维持表面的温情。",
      D:"面对危机，你最容易将问题的根源归咎于动能的停滞与对真实冲突的回避。你认为系统的腐朽通常始于温吞的维持，是因为缺乏打破僵局的勇气才导致了整体的僵化。因此，你会优先采取动作去直接打破僵局，通过人为制造变量或利用高压冲开阻力，让停滞的活水重新流动，在碰撞中寻得生机。与此同时，你最容易忽略长期的系统维护成本以及他人的承受极限。在极端高压下，你可能陷入破坏性的推进逻辑中，往往只顾着冲锋陷阵而无力善后，导致规则被践踏且动能不可持续。这种认知视角赋予了你极具破局魄力、能在所有人都和稀泥时直接切中要害推动位移的优势。但潜在的风险在于，当别人需要喘息的空间、缓冲的余地与降低物理对抗强度时，你可能依然在不计代价地要求冲锋。",
      E:"面对危机，你最容易将问题的根因看成输入的贫瘠与视角的封闭。你认为系统之所以枯竭，是因为样本量不足或选择面太窄，由于拒绝引入外部的增量才陷入了存量的死循环。因此，你会优先寻找全新的资源渠道，引入外部变量与第三方视角，通过扩大可用的资源盘来化解当下的困境。与此同时，你最容易忽略内部现有资源的消化率以及核心目标的深度聚焦。在极端高压下，你极易陷入盲目的扩张之中，导致主线任务因过度发散而失控，空有广度而缺乏深度执行的闭环。这种认知视角赋予了你极其开阔的视野、能在别人死磕存量时瞬间找到外部破局增量的优势。但潜在的风险在于，当别人需要内部资源的消化、稳定感以及对当下成果的确认时，你可能已经把目光投向了下一个新增量。",
      T:"面对危机，你最容易将问题的根源看成底层逻辑的错误或系统目标的虚无。在你看来，最致命的失败通常源于手段错当成目的，或者是在一个完全错误的框架下进行徒劳的努力。因此，你会优先采取“剥离表象”的动作，重新定义问题并抽离现有框架，通过重构第一性原理来校准航向，确保系统在本质意义上是成立的。与此同时，你最容易忽略现实的紧迫性以及具体落地的琐碎细节。在极端高压下，你极易陷入宏大叙事的幻象中，对眼前的物理世界与基础情绪维护采取悬置态度，导致理念与现实彻底脱节。这种认知视角赋予了你很快看见别人看不见的结构漏洞、一眼剥离表面现象直击本质的优势。但潜在的风险在于，当别人需要解决眼前的具体麻烦、落地琐事与立刻见效的反馈时，你可能还在纠结底层模型。"
    };
    report += '<p><strong>你的第一归因倾向：' + eName[L1] + '视角</strong></p>';

    report += '<h2>🔄 外部规则/内部规则代谢协议</h2>';
    var metaNegFull = {
      "内源主导":"你是个“自带干粮”的系统，稳定性全靠内心的那杆秤。外界的评价、规矩或是人情绑架，很难真正穿透你的内核，你只认逻辑，不认脸色。面对不合理的强压、甩锅或越界，你会选择毫不犹豫地正面迎击。你敢于承担不合群的代价，明确划定边界、要求规则对等，绝不接受不明不白的委屈和情绪剥削。",
      "灰度主导":"你是个极聪明的“超级转化炉”。你既不盲目硬刚，也不委屈顺从，而是擅长把外界的压强和规则，悄悄转译成自己建设底盘的燃料，在和光同尘中完成系统升级。面对不合理的强压，你很会“打太极”。你不会直接掀桌子，而是先做一部分表面功夫交差，然后把真正的精力用来修补你认为重要的核心漏洞，在规则边缘给自己抠出余地。",

    };
    var metaPosFull = {
      "内源主导":"你是个“自带干粮”的系统，稳定性全靠内心的那杆秤。外界的评价、规矩或是人情绑架，很难真正穿透你的内核，你只认逻辑，不认脸色。越是面对巨大的诱惑和夸奖，你反而越警觉。你宁可走得慢一点、错过一些风口，也要死死守住自己的核心底盘和边界，绝不被外界的“大饼”和高帽子忽悠瘸了。",
      "灰度主导":"你是个极聪明的“超级转化炉”。你既不盲目硬刚，也不委屈顺从，而是擅长把外界的压强和规则，悄悄转译成自己建设底盘的燃料，在和光同尘中完成系统升级。面对好机会和夸奖，你懂得见好就收。你会接住这些动力，但马上会把它们拆解成阶段性的目标和风控线，确保这些“好运气”能沉淀为真正可复用的能力。",

      "🟠 橙区":"你现在的状态就像开启了“省电模式”。你只能沿着惯性勉强维持最基本的日常运转，对外界的信号非常敏感且极度缺乏耐心，任何多出来的麻烦都会让你觉得难以忍受。如果现在继续给你加压，系统很快会过载报错，你会直接甩锅或者因为情绪崩盘而彻底断线。",
      "🟢 绿区":"你现在的状态处于正常的“收支平衡”。你既不亢奋也不抗拒，能够非常客观地就事论事。现在的你拥有标准的算力带宽，能稳定地输出你原本该有的能力水平。如果长期在高压下得不到正向反馈，你会很快退化到橙区的防御状态，开始斤斤计较自己的付出和回报。",
      "🔵 蓝区":"你现在的状态简直是“电量满格”。系统运转非常丝滑，你不仅能轻松搞定自己的分内事，甚至还有余力去帮别人修补漏洞。你现在的抗压和抗干扰能力都处于巅峰状态。只要能给你对应的价值激励，你就能保持很长时间的高效率输出，是一个非常完美的攻坚期。",

    };
    var drainFullText = {

      "Stress":"长期无反馈的黑盒环境与反复无常的修改意见会逐渐消耗你的稳定性，最终引发系统性失控。",
      "Emotion":"无意义的情绪摩擦与持续的人际交互正在剧烈消耗你仅存的余额，任何形式的社交对话都可能让你瞬间爆炸。",

    };
    var poolArr = [loadPool, stressPool, emotionPool, motivePool];
