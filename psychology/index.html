        .q-number { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; background: var(--blue-500); color: #fff; font-weight: 700; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }

        .forced-choice .q-number { background: var(--purple-500); }
        .forced-choice.answered { border-color: var(--emerald-500); border-left: 4px solid var(--emerald-500); }
        .btn-submit { display: block; width: 100%; max-width: 400px; margin: 30px auto; padding: 14px; background: var(--blue-600); color: #fff; font-weight: 700; border: none; border-radius: 99px; cursor: pointer; font-size: 1.05rem; letter-spacing: 0.4px; box-shadow: var(--shadow-md); transition: 0.2s; text-align: center; }
        .btn-submit:hover { background: var(--blue-700); transform: translateY(-1px); }
        .btn-submit:disabled { background: var(--gray-300); cursor: not-allowed; transform: none; }
        .report-container { display: none; margin-top: 30px; }
        .report-container.visible { display: block; }
        .report-section { background: var(--white); border: 2px solid var(--blue-200); border-radius: var(--radius-lg); padding: 28px 22px; margin-bottom: 18px; box-shadow: var(--shadow); }

        .report-section p { margin-bottom: 10px; line-height: 1.7; }
        .highlight { background: #fefce8; border-left: 4px solid var(--amber-400); padding: 10px 14px; border-radius: 0 var(--radius) var(--radius) 0; margin: 10px 0; }
        .insight-box { background: var(--blue-100); border: 1px solid var(--blue-200); border-radius: var(--radius); padding: 14px 16px; margin: 10px 0; }

        .matrix-table th, .matrix-table td { border: 1px solid var(--gray-200); padding: 8px 6px; text-align: center; }
        .matrix-table th { background: var(--blue-100); color: var(--blue-800); font-weight: 700; }
        .state-buried { background: #fee2e2; color: #991b1b; font-weight: 600; }

        .report-section ul li { padding: 6px 0 6px 24px; position: relative; }

            const sel=answers[q.id]; const cls=sel!==undefined?'card answered':'card';
            let opts=''; freqOpts.forEach((o,i)=>opts+=`<li><label><input type="radio" name="q_${q.id}" value="${i}" ${sel===i?'checked':''}><span>${o}</span></label></li>`);
            return `<div class="${cls}" id="card_${q.id}"><div class="q-header"><span class="q-number">${q.id}</span><div class="q-meta"><span class="q-engine-sandbox">${q.engineLabel} · ${q.sandboxLabel}</span><span class="q-text">${q.text}</span></div></div><ul class="options-list">${opts}</ul></div>`;
        }
        function renderForcedCard(q){
            const sel=answers[q.id]; const cls=sel!==undefined?'card forced-choice answered':'card forced-choice';
            let opts=''; q.options.forEach((o,i)=>opts+=`<li><label><input type="radio" name="q_${q.id}" value="${i}" ${sel===i?'checked':''}><span>${o}</span></label></li>`);
            return `<div class="${cls}" id="card_${q.id}"><div class="q-header"><span class="q-number">${q.id}</span><div class="q-meta"><span class="q-engine-sandbox">迫选 · ${q.code}｜${q.sandboxLabel}</span><span class="q-text">${q.text}</span></div></div><ul class="options-list">${opts}</ul></div>`;
        }
        function onChange(e){
            const qId=parseInt(e.target.name.replace('q_','')); answers[qId]=parseInt(e.target.value);
            document.getElementById('card_'+qId).classList.add('answered'); updateProgress();
        }
        function updateProgress(){
            const cnt=Object.keys(answers).length;
            document.getElementById('progressBar').style.width=Math.round(cnt/totalQ*100)+'%';
            document.getElementById('progressText').textContent=cnt+'/'+totalQ;
            document.getElementById('sectionLabel').textContent=cnt<90?'频率选择':cnt<totalQ?'迫选·深度探测':'✅ 全部完成';
            const btn=document.getElementById('btnSubmit'); btn.disabled=cnt<totalQ;
            btn.textContent=cnt<totalQ?`🪴 还需回答 ${totalQ-cnt} 题才能查看报告`:'🪴 提交全部答案，查看生命种子报告';
        }

        function submitAll(){
            if(Object.keys(answers).length<totalQ) return;
            document.getElementById('btnSubmit').style.display='none';
            generateReport();
            document.getElementById('reportContainer').classList.add('visible');
            document.getElementById('reportContainer').scrollIntoView({behavior:'smooth'});
        }

        function generateReport(){
            const matrix={}; for(const e of ['O','V','D','E','T']){ matrix[e]={}; for(const s of sandboxes) matrix[e][s]=0; }
            frequencyQuestions.forEach(q=>{ if(answers[q.id]!==undefined) matrix[q.engine][q.sandbox]+=(answers[q.id]+1); });
            const seedState=s=>s>=13?'繁茂':s>=10?'生长':s>=6?'卷缩':'被掩埋';
            const stateCls={'被掩埋':'state-buried','卷缩':'state-shrinking','生长':'state-growing','繁茂':'state-lush'};
            const engineTot={}; for(const e of Object.keys(matrix)) engineTot[e]=Object.values(matrix[e]).reduce((a,b)=>a+b,0);
            const sbTot={}; for(const s of sandboxes) sbTot[s]=Object.keys(matrix).reduce((a,e)=>a+matrix[e][s],0);
            const engRank=[...Object.keys(engineTot)].sort((a,b)=>engineTot[b]-engineTot[a]);
            const sbRank=[...sandboxes].sort((a,b)=>sbTot[b]-sbTot[a]);
            const strong=engRank[0], weak=engRank[4], topSb=sbRank[0];
            const lushCnt={}, buriedCnt={}; for(const e of Object.keys(matrix)){ lushCnt[e]=0; buriedCnt[e]=0; for(const s of sandboxes){ const v=matrix[e][s]; if(v>=13)lushCnt[e]++; if(v>=3&&v<=5)buriedCnt[e]++; } }
            const mostInj=[...Object.keys(matrix)].sort((a,b)=>buriedCnt[b]-buriedCnt[a])[0];

            let html='';
            html+=`<div class="report-section"><h2>🪴 第一层报告：现象与体感</h2><p><strong>最繁茂引擎：${engineNames[strong]}</strong>，在 ${lushCnt[strong]} 个沙盒繁茂。${(s1Desc[strong][lushCnt[strong]>=4?0:lushCnt[strong]>=3?1:2])}</p><p><strong>最卷缩引擎：${engineNames[weak]}</strong>，${buriedCnt[weak]} 处被掩埋。</p><p><strong>受创最深：${engineNames[mostInj]}</strong>——${injuredDesc[mostInj]}</p><p><strong>主沙盒：${sbNames[topSb]}（${sbFull[topSb]}）</strong>，总分 ${sbTot[topSb]}。</p></div>`;

            html+=`<div class="report-section"><h3>🪴 种子状态矩阵</h3><table class="matrix-table"><thead><tr><th>引擎</th><th>PN 物理底盘</th><th>AN 能力进化</th><th>RN 深度连接</th><th>IN 社会舞台</th><th>MN 意义导航</th><th>FN 系统运转</th><th>总分</th></tr></thead><tbody>`;
            for(const e of Object.keys(matrix)){
                html+=`<tr><td><strong>${engineNames[e]}</strong></td>`;
                for(const s of sandboxes){ const v=matrix[e][s],st=seedState(v); html+=`<td class="${stateCls[st]}">${v}（${st}）</td>`; }
                html+=`<td><strong>${engineTot[e]}</strong></td></tr>`;
            }
            html+=`<tr style="background:#f0f4f8;font-weight:700"><td>沙盒总分</td>${sandboxes.map(s=>`<td>${sbTot[s]}</td>`).join('')}<td>-</td></tr></tbody></table></div>`;

            html+=`<div class="report-section"><h3>🪴 排序</h3><p><strong>沙盒：</strong>${sbRank.map((s,i)=>`${i+1}.${sbNames[s]}(${sbTot[s]})`).join(' · ')}</p><p><strong>引擎：</strong>${engRank.map((e,i)=>`${i+1}.${engineNames[e]}(${engineTot[e]})`).join(' · ')}</p></div>`;

            // 能量体感
            const highSb=sbRank[0], lowSb=sbRank[5];
            html+=`<div class="report-section"><h3>🪴 能量分布</h3><p>${sbFeelHigh[highSb] || ''} · 而 ${sbFeelLow[lowSb] || ''}。</p></div>`;

            // 荒芜区
            const barren=sandboxes.filter(s=>Object.keys(matrix).filter(e=>matrix[e][s]>=3&&matrix[e][s]<=5).length>=3);
            if(barren.length) html+=`<div class="report-section"><h3>🪴 荒芜区</h3>${barren.map(s=>`<p>在<strong>${sbNames[s]}</strong>上多颗种子被掩埋，消耗最大。</p>`).join('')}</div>`;

            // 第二层
            html+=`<div class="report-section"><h2>🪴 第二层报告：因果溯源</h2><p>最强引擎 <strong>${engineNames[strong]} (${elements[strong]})</strong> 驱动整个系统。</p>`;
            const beike=keMap[strong], keWo=Object.keys(keMap).find(k=>keMap[k]===strong);
            if(beike&&engineTot[beike]<engineTot[strong]*0.85) html+=`<p>🪴 <strong>${engineNames[strong]}克${engineNames[beike]}</strong>：核心驱动在消耗${engineNames[beike]}的底盘功能。</p>`;
            if(keWo&&engineTot[keWo]<engineTot[strong]*0.85) html+=`<p>🪴 <strong>${engineNames[keWo]}克${engineNames[strong]}</strong>：约束力量不足，核心驱动缺乏收束。</p>`;
            html+=`<p class="highlight">🪴 这不是病理。这是你的系统在极端条件下的最优解。</p></div>`;

            // 第三层
            html+=`<div class="report-section"><h2>🪴 第三层报告：结构映射</h2>`;
            const lushN=[], buriedN=[];
            for(const e of Object.keys(matrix)) for(const s of sandboxes){ if(matrix[e][s]>=13)lushN.push({e,s}); if(matrix[e][s]>=3&&matrix[e][s]<=5)buriedN.push({e,s}); }
            if(lushN.length&&buriedN.length){
                const a=lushN[0], b=buriedN[0];
                html+=`<p><strong>${sbNames[a.s]}上${engineNames[a.e]}的繁茂 × ${sbNames[b.s]}上${engineNames[b.e]}的被掩埋</strong>：功能互补与张力。</p>`;
            }
            html+=`<p class="highlight">🪴 追问是自我保护的方式，结构是自我容身的堡垒，抽离是避免误读的策略。</p></div>`;

            document.getElementById('reportContainer').innerHTML = html;
        }

        renderAll();
    })();
</script>
</body>
</html>
