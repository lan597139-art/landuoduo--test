<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生命种子探测 - 心理测试</title>
    <style>
        :root {
            --bg: #f5f0eb;
            --card-bg: #fffef9;
            --text: #2c2416;
            --text-secondary: #5c4b2e;
            --border: #d4c5a9;
            --accent: #8b5e3c;
            --accent-light: #c9a87c;
            --option-hover: #f0e6d8;
            --selected: #e8d5b8;
            --shadow: 0 2px 12px rgba(60, 30, 10, 0.08);
            --radius: 10px;
            --transition: 0.2s ease;
            --font-main: 'Noto Serif SC', 'STSong', 'Songti SC', 'SimSun', 'KaiTi', serif;
            --font-ui: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 60px;
        }

        .container {
            max-width: 780px;
            width: 100%;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 40px 20px 32px;
            position: relative;
        }
        .header .icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }
        .header h1 {
            font-family: var(--font-main);
            font-size: 28px;
            font-weight: 700;
            color: #3d2b14;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }
        .header .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 0.06em;
        }
        .header .divider {
            width: 60px;
            height: 2px;
            background: var(--accent-light);
            margin: 16px auto 0;
            border-radius: 1px;
        }

        /* Progress */
        .progress-wrap {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .progress-wrap .phase-badge {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.05em;
            background: var(--accent);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .progress-bar-outer {
            flex: 1;
            min-width: 120px;
            height: 8px;
            background: #e8ddd0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #c9a87c, #8b5e3c);
            border-radius: 4px;
            transition: width 0.4s ease;
        }
        .progress-text {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            font-weight: 500;
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 24px;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: 0 4px 20px rgba(60, 30, 10, 0.12);
        }
        .card .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .card .question-number {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 4px;
        }
        .card .question-text {
            font-family: var(--font-main);
            font-size: 16px;
            font-weight: 500;
            color: #3d2b14;
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .card .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .card .option-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border: 1.5px solid #e0d5c2;
            border-radius: 8px;
            cursor: pointer;
            background: #fdfaf5;
            transition: all var(--transition);
            font-size: 14px;
            color: #4a3820;
            text-align: left;
            font-family: var(--font-ui);
            line-height: 1.5;
        }
        .card .option-btn:hover {
            background: var(--option-hover);
            border-color: var(--accent-light);
        }
        .card .option-btn.selected {
            background: var(--selected);
            border-color: var(--accent);
            font-weight: 600;
            color: #3d2b14;
            box-shadow: inset 0 0 0 1px rgba(139, 94, 60, 0.25);
        }
        .card .option-btn .opt-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e8ddd0;
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
            color: #5c4b2e;
            transition: all var(--transition);
        }
        .card .option-btn.selected .opt-letter {
            background: var(--accent);
            color: #fff;
        }

        /* Section header */
        .section-header {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 20px 4px 8px;
            margin-bottom: 4px;
            text-align: left;
        }
        .section-header h2 {
            font-family: var(--font-main);
            font-size: 20px;
            font-weight: 700;
            color: #3d2b14;
            letter-spacing: 0.03em;
        }
        .section-header .engine-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 24px 0;
        }
        .btn {
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: all var(--transition);
            border: 2px solid transparent;
            font-family: var(--font-ui);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-primary:hover {
            background: #6d4528;
            border-color: #6d4528;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: transparent;
            color: var(--accent);
            border-color: var(--accent-light);
        }
        .btn-secondary:hover {
            background: var(--option-hover);
        }
        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Results */
        .results-area {
            display: none;
        }
        .results-area.visible {
            display: block;
        }
        .result-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .result-card h3 {
            font-family: var(--font-main);
            font-size: 18px;
            color: #3d2b14;
            margin-bottom: 12px;
            letter-spacing: 0.03em;
        }
        .result-card .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin: 10px 0;
        }
        .result-card .matrix-table th,
        .result-card .matrix-table td {
            border: 1px solid #d4c5a9;
            padding: 8px 10px;
            text-align: center;
            vertical-align: middle;
        }
        .result-card .matrix-table th {
            background: #f5ede0;
            font-weight: 700;
            color: #3d2b14;
            font-size: 12px;
            letter-spacing: 0.04em;
        }
        .result-card .matrix-table td {
            background: #fdfaf5;
            font-weight: 500;
        }
        .result-card .matrix-table .cell-buried {
            background: #fce4e4;
            color: #8b1a1a;
            font-weight: 700;
        }
        .result-card .matrix-table .cell-shriveled {
            background: #fdf0d5;
            color: #6b4a0a;
        }
        .result-card .matrix-table .cell-growing {
            background: #e0f0e0;
            color: #1a4a1a;
        }
        .result-card .matrix-table .cell-luxuriant {
            background: #c8e8c8;
            color: #0d3d0d;
            font-weight: 700;
        }
        .report-text {
            font-family: var(--font-main);
            font-size: 15px;
            line-height: 1.8;
            color: #3d2b14;
            white-space: pre-wrap;
            padding: 12px 0;
        }
        .report-text .highlight {
            color: var(--accent);
            font-weight: 700;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card {
                padding: 18px 14px;
            }
            .card .question-text {
                font-size: 15px;
            }
            .card .option-btn {
                font-size: 13px;
                padding: 10px 12px;
            }
            .header h1 {
                font-size: 22px;
            }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #3d2b14;
            color: #fdfaf5;
            padding: 10px 22px;
            border-radius: 24px;
            font-size: 13px;
            letter-spacing: 0.03em;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Header -->
        <div class="header">
            <span class="icon">🌱</span>
            <h1>生命种子探测</h1>
            <p class="subtitle">8号 · 90题频率量表 + 9号 · 18题迫选</p>
            <div class="divider"></div>
        </div>

        <!-- Progress -->
        <div class="progress-wrap" id="progressWrap">
            <span class="phase-badge" id="phaseBadge">8号测试</span>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progressBar" style="width: 0%;"></div>
            </div>
            <span class="progress-text" id="progressText">0 / 108</span>
        </div>

        <!-- Questions Container -->
        <div id="questionsContainer"></div>

        <!-- Navigation Buttons -->
        <div class="btn-row" id="navButtons">
            <button class="btn btn-secondary" id="btnPrev" disabled>← 上一题</button>
            <button class="btn btn-primary" id="btnNext">下一题 →</button>
        </div>
        <div class="btn-row" id="submitRow" style="display:none;">
            <button class="btn btn-primary" id="btnSubmit" style="font-size:16px; padding:14px 40px;">
                📊 提交并查看报告
            </button>
        </div>

        <!-- Results Area -->
        <div class="results-area" id="resultsArea">
            <div class="result-card" id="resultMatrixCard">
                <h3>📋 8号矩阵 · 引擎×沙盒 得分表</h3>
                <div style="overflow-x:auto;">
                    <table class="matrix-table" id="matrixTable"></table>
                </div>
                <p style="font-size:12px;color:#888;margin-top:8px;">
                    颜色说明：<span style="background:#c8e8c8;padding:2px 8px;border-radius:3px;">繁茂13-15</span>
                    <span style="background:#e0f0e0;padding:2px 8px;border-radius:3px;">生长10-12</span>
                    <span style="background:#fdf0d5;padding:2px 8px;border-radius:3px;">卷缩6-9</span>
                    <span style="background:#fce4e4;padding:2px 8px;border-radius:3px;">被掩埋3-5</span>
                </p>
            </div>
            <div class="result-card" id="resultReportCard">
                <h3>📝 第一层报告（部分）</h3>
                <div class="report-text" id="reportText"></div>
            </div>
            <div class="btn-row">
                <button class="btn btn-secondary" id="btnRestart">🔄 重新测试</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ==================== 数据定义 ====================

            // 引擎定义
            const ENGINES = {
                'O': { label: 'O-结构引擎', fullLabel: 'O-金-收束（结构）', element: '金', shortKey: 'O' },
                'V': { label: 'V-锚定引擎', fullLabel: 'V-土-承载（锚定）', element: '土', shortKey: 'V' },
                'D': { label: 'D-动力引擎', fullLabel: 'D-火-突破（动力）', element: '火', shortKey: 'D' },
                'E': { label: 'E-扩张引擎', fullLabel: 'E-水-漫延（扩张）', element: '水', shortKey: 'E' },
                'T': { label: 'T-超越引擎', fullLabel: 'T-木-穿透（超越）', element: '木', shortKey: 'T' }
            };

            const ENGINE_ORDER = ['O', 'V', 'D', 'E', 'T'];

            // 沙盒定义
            const SANDBOXES = {
                'PN': { label: 'PN-身体/空间/资源', shortLabel: 'PN 物理底盘', order: 0 },
                'AN': { label: 'AN-成长/能力/路径', shortLabel: 'AN 能力进化', order: 1 },
                'RN': { label: 'RN-关系/亲密/协作', shortLabel: 'RN 深度连接', order: 2 },
                'IN': { label: 'IN-群体/评价/位置', shortLabel: 'IN 社会舞台', order: 3 },
                'MN': { label: 'MN-意义/信念/目标', shortLabel: 'MN 意义导航', order: 4 },
                'FN': { label: 'FN-机制/流程/系统', shortLabel: 'FN 系统运转', order: 5 }
            };

            const SANDBOX_ORDER = ['PN', 'AN', 'RN', 'IN', 'MN', 'FN'];

            // 五行映射
            const ENGINE_ELEMENT = { 'O': '金', 'V': '土', 'D': '火', 'E': '水', 'T': '木' };
            const ELEMENT_ENGINE = { '金': 'O', '土': 'V', '火': 'D', '水': 'E', '木': 'T' };

            // 五行生克关系
            const SHENG_MAP = { '木': '火', '火': '土', '土': '金', '金': '水', '水': '木' }; // 生谁
            const KE_MAP = { '木': '土', '土': '水', '水': '火', '火': '金', '金': '木' }; // 克谁
            const BEI_SHENG_MAP = { '火': '木', '土': '火', '金': '土', '水': '金', '木': '水' }; // 被谁生
            const BEI_KE_MAP = { '土': '木', '水': '土', '火': '水', '金': '火', '木': '金' }; // 被谁克

            // ==================== 8号测试题目数据 ====================
            // 结构：8号题目按 [引擎][沙盒] 组织，每个定位点3道题
            // 为紧凑存储，使用扁平数组，每道题记录：引擎、沙盒、题号、题目文本

            const QUESTIONS_8 = [];

            // O-结构引擎 题目
            const O_questions = {
                'PN': [
                    '我能清晰感知自己身体的边界——什么时候该休息、什么时候还能继续。',
                    '我对钱、物资、生活空间有明确的规划和控制感。',
                    '当身体发出疲惫信号时，我能按自己定的规则停下来，而不是被外部压力推着继续。'
                ],
                'AN': [
                    '我对自己的成长路径有清晰的阶段性规划。',
                    '我能按计划推进学习或能力提升，每一步都清楚自己在做什么。',
                    '复盘自己的进步和不足时，我能客观地看到规律，而不是笼统地觉得自己不够好。'
                ],
                'RN': [
                    '在关系中，我清楚自己的边界在哪里——什么是我的责任，什么是对方的。',
                    '当关系中出现模糊地带时，我能够主动澄清规则或分工。',
                    '我能按照自己设定的互动规则维护一段长期关系，不觉得被消耗。'
                ],
                'IN': [
                    '我在群体中清楚自己的角色和定位，不乱位。',
                    '面对群体中的隐性规则，我能看透并找到自己的行动边界。',
                    '我能用清晰的规则保护自己，不被群体评价裹挟。'
                ],
                'MN': [
                    '我有一套自洽的信念体系来指导自己的选择。',
                    '当现实反馈和原有信念冲突时，我能重新调整框架而不崩溃。',
                    '我的目标和行动之间有一条清晰的逻辑链——我知道自己为什么在做这件事。'
                ],
                'FN': [
                    '我能够为自己建立有效的工作或生活习惯系统。',
                    '我建立的流程或规则，能稳定运行而不需要反复重建。',
                    '当旧系统失效时，我能快速迭代出新的机制。'
                ]
            };

            // V-锚定引擎 题目
            const V_questions = {
                'PN': [
                    '我的身体让我感到安全和踏实，不是负担。',
                    '我在自己的居住空间里感到安稳和归属。',
                    '我对自己的物质生活有稳定的安全感，不担心突然失去。'
                ],
                'AN': [
                    '我对自己正在走的路有一种持续的确认感——不摇摆、不漂移。',
                    '即使成长速度不如预期，我仍然感到自己在正确的方向上。',
                    '回顾过去几年的积累，我确信这些东西属于我、不会消失。'
                ],
                'RN': [
                    '我至少有一个让我感到安全、可以依赖的人。',
                    '在重要关系中，我相信对方不会轻易离开或伤害我。',
                    '当我需要支持时，我知道可以向谁寻求帮助。'
                ],
                'IN': [
                    '我在某个群体中有稳定的归属感。',
                    '即使不被所有人喜欢，我仍感到自己在群体中有立足之地。',
                    '我不需要通过讨好来维持自己在群体中的位置。'
                ],
                'MN': [
                    '我内心有一个稳定的价值锚点，让我觉得自己的人生有方向。',
                    '即使外部世界变化很快，我仍然相信某些东西是值得坚守的。',
                    '我没有感到自己在意义的海洋里漂泊——我有自己的坐标。'
                ],
                'FN': [
                    '我依赖的日常习惯或系统让我感到踏实和安心。',
                    '即使遇到意外，我知道自己的常规系统能兜住大部分日常运转。',
                    '我不需要用尽意志力来维持基本的生活秩序——它们已经变成了稳定的习惯。'
                ]
            };

            // D-动力引擎 题目
            const D_questions = {
                'PN': [
                    '当我需要行动时，身体能给我足够的能量支撑。',
                    '我能主动调整身体状态——累了就休息，恢复后就行动，节奏在我手里。',
                    '面对体力上的挑战，我不害怕，甚至愿意试试自己能走多远。'
                ],
                'AN': [
                    '遇到能力瓶颈时，我有推开它的冲动和能量。',
                    '我能主动向更难的目标发起冲刺，不需要别人催促。',
                    '即使在长期没有正反馈的阶段，我仍然保持着推进的动能。'
                ],
                'RN': [
                    '当关系中出现沉默或僵局时，我愿意主动打破它。',
                    '我能推动一段关系向更真实、更深入的方向发展。',
                    '在关系中遇到冲突时，我不会立刻想逃——我能在这个张力中站住。'
                ],
                'IN': [
                    '在群体中，我有表达自己立场和争取位置的冲动。',
                    '当群体方向走偏时，我愿意提出不同意见。',
                    '面对群体中的竞争或挑战，我不会退缩。'
                ],
                'MN': [
                    '我对过时的信念有质疑和打破的冲动。',
                    '我能主动重写自己已经不再相信的目标，而不是停在原地。',
                    '当旧意义崩塌后，我有动力去寻找新的意义，而不是陷入虚无。'
                ],
                'FN': [
                    '当旧流程不再适用时，我有推倒重来的魄力。',
                    '我能主动发起系统层面的变革，而不是被动修补。',
                    '面对低效或僵化的机制，我有推动重构的行动力。'
                ]
            };

            // E-扩张引擎 题目
            const E_questions = {
                'PN': [
                    '我对自己能获得更多物质资源有信心。',
                    '我能够主动扩大自己的生活空间或资源边界。',
                    '面对新的资源机会时，我不会因为害怕失控而退缩。'
                ],
                'AN': [
                    '我对新的技能、知识或成长方向保持好奇和尝试的冲动。',
                    '我能够在多个成长方向之间找到平衡，不觉得必须只选一条路。',
                    '面对一个新领域，我愿意投入时间去探索，即使短期内没有成果。'

            /**

            // 1. 8号计分规则
            function computeEngineSandboxScore(engine, sandbox) {
                const scores = answers8[engine][sandbox];
                let sum = 0;
                for (let i = 0; i < 3; i++) {
                    if (scores[i] !== null) {
                        sum += scores[i];
                    }
                }
                return sum; // 范围3-15
            }

            function getSeedStatus(totalScore) {
                if (totalScore >= 3 && totalScore <= 5) return '被掩埋';
                if (totalScore >= 6 && totalScore <= 9) return '卷缩';
                if (totalScore >= 10 && totalScore <= 12) return '生长';
                if (totalScore >= 13 && totalScore <= 15) return '繁茂';
                return '未知';
            }

            // 构建8号矩阵
            function buildMatrix8() {
                const matrix = {}; // { engine: { sandbox: { total, status } } }
                for (const eng of ENGINE_ORDER) {
                    matrix[eng] = {};
                    for (const sb of SANDBOX_ORDER) {
                        const total = computeEngineSandboxScore(eng, sb);
                        matrix[eng][sb] = {
                            total: total,
                            status: getSeedStatus(total)
                        };
                    }
                }
                return matrix;
            }

            // 2. 9号选项映射
            function getQ1EngineMapping(q9Id) {
                const q = QUESTIONS_9.find(q => q.id === q9Id);
                if (!q || !q.mapping) return null;
                const selectedIndex = answers9[q9Id];
                if (selectedIndex === null) return null;
                return q.mapping[selectedIndex] || null;
            }

            function getQ2TraumaType(q9Id) {
                const q = QUESTIONS_9.find(q => q.id === q9Id);
                if (!q || !q.traumaMapping) return null;
                const selectedIndex = answers9[q9Id];
                if (selectedIndex === null) return null;
                return q.traumaMapping[selectedIndex] || null;
            }

            function getQ3FearType(q9Id) {
                const q = QUESTIONS_9.find(q => q.id === q9Id);
                if (!q || !q.fearMapping) return null;
                const selectedIndex = answers9[q9Id];
                if (selectedIndex === null) return null;
                return q.fearMapping[selectedIndex] || null;
            }

            // 3. 矩阵聚合变量
            function computeAggregates(matrix) {
                // 引擎总分
                const engineTotals = {};
                for (const eng of ENGINE_ORDER) {
                    let sum = 0;
                    for (const sb of SANDBOX_ORDER) {
                        sum += matrix[eng][sb].total;
                    }
                    engineTotals[eng] = sum;
                }

                // 沙盒总分
                const sandboxTotals = {};
                for (const sb of SANDBOX_ORDER) {
                    let sum = 0;
                    for (const eng of ENGINE_ORDER) {
                        sum += matrix[eng][sb].total;
                    }
                    sandboxTotals[sb] = sum;
                }

                // S1: 引擎总分最高者
                let strongestEngine = ENGINE_ORDER[0];
                let highestEngineTotal = engineTotals[ENGINE_ORDER[0]];
                for (const eng of ENGINE_ORDER) {
                    if (engineTotals[eng] > highestEngineTotal) {
                        highestEngineTotal = engineTotals[eng];
                        strongestEngine = eng;
                    }
                }

                // 繁茂沙盒数量（最强引擎）
                let luxuriantCountStrongest = 0;
                for (const sb of SANDBOX_ORDER) {
                    if (matrix[strongestEngine][sb].status === '繁茂') {
                        luxuriantCountStrongest++;
                    }
                }

                // S1_neglect: 引擎总分最低且至少有一个沙盒被掩埋
                let neglectedEngine = null;
                let lowestTotal = Infinity;
                for (const eng of ENGINE_ORDER) {
                    let hasBuried = false;
                    for (const sb of SANDBOX_ORDER) {
                        if (matrix[eng][sb].status === '被掩埋') {
                            hasBuried = true;
                            break;
                        }
                    }
                    if (hasBuried && engineTotals[eng] < lowestTotal) {
                        lowestTotal = engineTotals[eng];
                        neglectedEngine = eng;
                    }
                }
                // 如果没有被掩埋的引擎，取总分最低的
                if (!neglectedEngine) {
                    for (const eng of ENGINE_ORDER) {
                        if (engineTotals[eng] < lowestTotal) {
                            lowestTotal = engineTotals[eng];
                            neglectedEngine = eng;
                        }
                    }
                }

                // 被掩埋沙盒数量（neglected engine）
                let neglectedBuriedCount = 0;
                if (neglectedEngine) {
                    for (const sb of SANDBOX_ORDER) {
                        if (matrix[neglectedEngine][sb].status === '被掩埋') {
                            neglectedBuriedCount++;
                        }
                    }
                }

                // S1_mostinjured: 被掩埋沙盒数量最多的引擎
                let mostInjuredEngine = ENGINE_ORDER[0];
                let mostInjuredCount = 0;
                for (const eng of ENGINE_ORDER) {
                    let buriedCount = 0;
                    for (const sb of SANDBOX_ORDER) {
                        if (matrix[eng][sb].status === '被掩埋') {
                            buriedCount++;
                        }
                    }
                    if (buriedCount > mostInjuredCount) {
                        mostInjuredCount = buriedCount;
                        mostInjuredEngine = eng;
                    }
                }

                // N1: 沙盒总分最高者
                let highestSandbox = SANDBOX_ORDER[0];
                let highestSandboxTotal = sandboxTotals[SANDBOX_ORDER[0]];
                for (const sb of SANDBOX_ORDER) {
                    if (sandboxTotals[sb] > highestSandboxTotal) {
                        highestSandboxTotal = sandboxTotals[sb];
                        highestSandbox = sb;
                    }
                }

                return {
                    engineTotals,
                    sandboxTotals,
                    strongestEngine,
                    luxuriantCountStrongest,
                    neglectedEngine,
                    neglectedBuriedCount,
                    mostInjuredEngine,
                    mostInjuredCount,
                    highestSandbox,
                    highestSandboxTotal,
                    matrix
                };
            }

                    if (matrix[neglectedEngine][sb].status === '被掩埋') {
                        buriedSandboxes.push({ sandbox: sb, total: matrix[neglectedEngine][sb].total });
                    }
                }
                // 按沙盒总分从低到高排列
                buriedSandboxes.sort((a, b) => a.total - b.total);
                const descDict = NEGLECT_DESCRIPTIONS[neglectedEngine] || {};
                const lines = buriedSandboxes.map(item => descDict[item.sandbox] || '');

            function buildMatrixTable(matrix, aggregates) {
                let html = '<thead><tr><th>引擎 \\ 沙盒</th>';
                for (const sb of SANDBOX_ORDER) {
                    html += '<th>' + SANDBOXES[sb].shortLabel + '</th>';
                }
                html += '<th>引擎总分</th></tr></thead><tbody>';

                for (const eng of ENGINE_ORDER) {
                    html += '<tr><td style="font-weight:700;">' + ENGINES[eng].fullLabel + '</td>';
                    for (const sb of SANDBOX_ORDER) {
                        const cell = matrix[eng][sb];
                        let cellClass = '';
                        if (cell.status === '被掩埋') cellClass = 'cell-buried';
                        else if (cell.status === '卷缩') cellClass = 'cell-shriveled';
                        else if (cell.status === '生长') cellClass = 'cell-growing';
                        else if (cell.status === '繁茂') cellClass = 'cell-luxuriant';
                        html += '<td class="' + cellClass + '">' + cell.total + '<br><small>' + cell.status +
                            '</small></td>';
                    }
                    html += '<td style="font-weight:700;">' + aggregates.engineTotals[eng] + '</td></tr>';
                }

                // 沙盒总分行
                html += '<tr style="font-weight:700;background:#f5ede0;"><td>沙盒总分</td>';
                for (const sb of SANDBOX_ORDER) {
                    html += '<td>' + aggregates.sandboxTotals[sb] + '</td>';
                }
                html += '<td></td></tr>';

                html += '</tbody>';
                matrixTable.innerHTML = html;
            }

            function buildReportText(matrix, aggregates) {
                let report = '';

                // S1 最强引擎描述
                const s1Desc = getS1Description(aggregates.strongestEngine, aggregates.luxuriantCountStrongest);
                report += '【最强引擎】\n';
                report += '引擎：' + ENGINES[aggregates.strongestEngine].fullLabel + '（五行属' + ENGINE_ELEMENT[
                    aggregates.strongestEngine] + '）\n';
                report += '繁茂沙盒数：' + aggregates.luxuriantCountStrongest + '\n';
                report += '描述：' + s1Desc + '\n\n';

                // S1 被忽视引擎描述
                report += '【被忽视引擎】\n';
                if (aggregates.neglectedEngine) {
                    report += '引擎：' + ENGINES[aggregates.neglectedEngine].fullLabel + '（五行属' + ENGINE_ELEMENT[
                        aggregates.neglectedEngine] + '）\n';
                    report += '被掩埋沙盒数：' + aggregates.neglectedBuriedCount + '\n';
                    const neglectDesc = buildNeglectDescription(matrix, aggregates.neglectedEngine);
                    report += '描述：\n' + neglectDesc + '\n\n';
                } else {
                    report += '（未检测到明确的被忽视引擎）\n\n';
                }

                // S1 受伤最深引擎描述
                report += '【受伤最深引擎】\n';
                report += '引擎：' + ENGINES[aggregates.mostInjuredEngine].fullLabel + '\n';
                report += '被掩埋沙盒数：' + aggregates.mostInjuredCount + '\n';
                report += '描述：' + getMostInjuredDescription(aggregates.mostInjuredEngine) + '\n\n';

                // N1 最强沙盒
                report += '【最强沙盒】\n';
                report += '沙盒：' + SANDBOXES[aggregates.highestSandbox].shortLabel + '\n';
                report += '总分：' + aggregates.highestSandboxTotal + '\n\n';

                // 引擎总分排名
                report += '【引擎总分排名】\n';
                const engineRanking = ENGINE_ORDER.slice().sort((a, b) => aggregates.engineTotals[b] - aggregates
                .engineTotals[a]);
                for (let i = 0; i < engineRanking.length; i++) {
                    const eng = engineRanking[i];
                    report += (i + 1) + '. ' + ENGINES[eng].fullLabel + '：' + aggregates.engineTotals[eng] + '分\n';
                }
                report += '\n';

                // 沙盒总分排名
                report += '【沙盒总分排名】\n';
                const sandboxRanking = SANDBOX_ORDER.slice().sort((a, b) => aggregates.sandboxTotals[b] - aggregates
                    .sandboxTotals[a]);
                for (let i = 0; i < sandboxRanking.length; i++) {
                    const sb = sandboxRanking[i];
                    report += (i + 1) + '. ' + SANDBOXES[sb].shortLabel + '：' + aggregates.sandboxTotals[sb] + '分\n';
                }
                report += '\n';
                report += '（注：以上为第一层报告的前半部分。完整报告包含第一层全部固定文本字典、第二层五行生克因果链、第三层结构映射及第四层恐惧禁区映射，将在后续批次中逐步完善。）\n';

                reportText.textContent = report;
            }

            // ==================== 初始化 ====================
            function init() {
                currentQuestionGlobalIndex = 0;
                resultsArea.classList.remove('visible');
                navButtonsRow.style.display = 'flex';
                submitRow.style.display = 'none';
                btnNext.style.display = 'inline-block';
                updateProgress();
                renderCurrentQuestion();
            }

            // 键盘导航
            document.addEventListener('keydown', (e) => {
                if (resultsArea.classList.contains('visible')) return;
                if (e.key === 'ArrowLeft' && !btnPrev.disabled) {
                    btnPrev.click();
                } else if (e.key === 'ArrowRight' && btnNext.style.display !== 'none') {
                    btnNext.click();
                } else if (e.key >= '1' && e.key <= '5') {
                    const idx = parseInt(e.key) - 1;
                    const qData = getCurrentQuestionData();
                    if (qData.type === '8') {
                        setCurrentAnswer(idx + 1);
                    } else {
                        setCurrentAnswer(idx);
                    }
                    // 自动跳下一题
                    if (currentQuestionGlobalIndex < TOTAL_QUESTIONS - 1) {
                        setTimeout(() => goToQuestion(currentQuestionGlobalIndex + 1), 200);
                    }
                }
            });

            init();
        })();
    </script>
</body>
</html>
