<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生命种子探测——迫选结构试题</title>
    <style>
        :root {
            --blue: #4A7FB5;
            --blue-light: #6B9FD2;
            --blue-border: #3D6D9E;
            --blue-bg: #f5f8fc;
            --white: #ffffff;
            --text: #2c3e50;
            --text-secondary: #5a6c7d;
            --gold: #c9a962;
            --red-soft: #c0392b;
            --green-soft: #5d8c6b;
            --gray-light: #eef2f7;
            --shadow: 0 2px 12px rgba(61, 109, 158, 0.10);
            --shadow-lg: 0 6px 28px rgba(61, 109, 158, 0.14);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', -apple-system, sans-serif;
            background: #f0f4f8;
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* 顶部导航进度条 */
        .progress-bar-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--white);
            border-bottom: 3px solid var(--blue-border);
            padding: 14px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .progress-bar-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .progress-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--blue-border);
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        .progress-icons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }
        .progress-icon {
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            opacity: 0.45;
            filter: grayscale(0.7);
            user-select: none;
        }
        .progress-icon.answered {
            opacity: 1;
            filter: grayscale(0);
            animation: popIn 0.35s ease-out;
        }
        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0.3;
            }
            60% {
                transform: scale(1.25);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .progress-count {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            font-weight: 500;
        }

        /* 主容器 */
        .main-container {
            max-width: 820px;
            margin: 0 auto;
            padding: 20px 16px 60px;
        }

        /* 介绍卡片 */
        .intro-card {
            background: var(--white);
            border: 2px solid var(--blue-border);
            border-radius: var(--radius);
            padding: 28px 26px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        .intro-card h1 {
            font-size: 1.6rem;
            color: var(--blue-border);
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .intro-card .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .intro-card .instruction {
            background: var(--blue-bg);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            font-size: 0.9rem;
            color: var(--text);
            line-height: 1.6;
            border-left: 5px solid var(--blue-light);
        }
        .intro-card .instruction strong {
            color: var(--blue-border);
        }

        /* 题目卡片 */
        .question-card {
            background: var(--white);
            border: 2px solid #d0dbe8;
            border-radius: var(--radius);
            padding: 22px 22px 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            scroll-margin-top: 100px;
            position: relative;
        }
        .question-card.answered-card {
            border-color: var(--blue-light);
            box-shadow: 0 2px 16px rgba(74, 127, 181, 0.12);
        }
        .question-card.current-card {
            border-color: var(--blue-border);
            box-shadow: 0 4px 20px rgba(61, 109, 158, 0.18);
            animation: pulseBorder 2s ease-in-out infinite;
        }
        @keyframes pulseBorder {
            0%,
            100% {
                border-color: var(--blue-border);
            }
            50% {
                border-color: #5c93c9;
            }
        }
        .q-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .q-number {
            display: inline-block;
            background: var(--blue-border);
            color: #fff;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .q-domain {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .q-text {
            font-weight: 600;
            font-size: 1.02rem;
            color: var(--text);
            margin-bottom: 14px;
            line-height: 1.6;
        }
        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .option-item {
            cursor: pointer;
            padding: 11px 14px 11px 38px;
            border-radius: var(--radius-sm);
            border: 1.5px solid #e4eaf1;
            background: #fafbfc;
            transition: var(--transition);
            position: relative;
            font-size: 0.9rem;
            line-height: 1.55;
            color: var(--text);
            user-select: none;
        }
        .option-item:hover {
            background: #eef5fb;
            border-color: var(--blue-light);
            box-shadow: 0 1px 4px rgba(74, 127, 181, 0.08);
        }
        .option-item.selected {
            background: #e3f0fa;
            border-color: var(--blue-border);
            font-weight: 500;
            box-shadow: 0 1px 6px rgba(61, 109, 158, 0.15);
            color: #1a3a54;
        }
        .option-radio {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #c4cfda;
            background: #fff;
            flex-shrink: 0;
            transition: var(--transition);
            pointer-events: none;
        }
        .option-item.selected .option-radio {
            border-color: var(--blue-border);
            background: var(--blue-border);
            box-shadow: inset 0 0 0 4px #fff;
        }
        .option-letter {
            font-weight: 700;
            margin-right: 6px;
            color: var(--blue-border);
            font-size: 0.85rem;
        }
        .option-item.selected .option-letter {
            color: #1a3a54;
        }

        /* 提交按钮 */
        .submit-section {
            text-align: center;
            margin-top: 20px;
            padding: 16px 0 30px;
        }
        .btn-submit {
            background: var(--blue-border);
            color: #fff;
            border: none;
            padding: 14px 44px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: var(--transition);
            box-shadow: 0 4px 14px rgba(61, 109, 158, 0.3);
        }
        .btn-submit:hover {
            background: #2f5c89;
            box-shadow: 0 6px 20px rgba(61, 109, 158, 0.4);
            transform: translateY(-1px);
        }
        .btn-submit:disabled {
            background: #b0c5d8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .btn-submit:disabled:hover {
            background: #b0c5d8;
            transform: none;
            box-shadow: none;
        }
        .incomplete-warning {
            color: #c0392b;
            font-size: 0.85rem;
            margin-top: 6px;
            display: none;
        }
        .incomplete-warning.show {
            display: block;
        }

        /* 报告区域 */
        .report-container {
            display: none;
            background: var(--white);
            border: 2px solid var(--blue-border);
            border-radius: var(--radius);
            padding: 30px 26px;
            box-shadow: var(--shadow-lg);
            margin-top: 20px;
            line-height: 1.8;
        }
        .report-container.show {
            display: block;
        }
        .report-container h2 {
            font-size: 1.4rem;
            color: var(--blue-border);
            margin: 28px 0 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e8eef5;
            letter-spacing: 0.5px;
        }
        .report-container h2:first-child {
            margin-top: 0;
        }
        .report-container h3 {
            font-size: 1.1rem;
            color: #3d5f80;
            margin: 20px 0 8px;
            font-weight: 700;
        }
        .report-container h4 {
            font-size: 0.95rem;
            color: #4a6d8c;
            margin: 14px 0 6px;
            font-weight: 600;
        }
        .report-container p {
            margin: 8px 0;
            text-indent: 0;
            color: var(--text);
            line-height: 1.8;
        }
        .report-container .highlight-block {
            background: var(--blue-bg);
            border-left: 5px solid var(--blue-light);
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            margin: 14px 0;
            line-height: 1.8;
        }
        .report-container .insight-block {
            background: #fdf8f0;
            border-left: 5px solid var(--gold);
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            margin: 14px 0;
            line-height: 1.8;
        }
        .report-container .warn-block {
            background: #fef6f5;
            border-left: 5px solid var(--red-soft);
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            margin: 14px 0;
            line-height: 1.8;
        }
        .report-container .section-divider {
            border: none;
            border-top: 1px dashed #d8e2ed;
            margin: 22px 0;
        }
        .report-container .tag {
            display: inline-block;
            background: var(--blue-border);
            color: #fff;
            padding: 3px 10px;
            border-radius: 14px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            margin: 2px 3px;
        }
        .report-container .tag-wood {
            background: #6b8c5c;
        }
        .report-container .tag-metal {
            background: #7b8ea0;
        }
        .report-container .tag-fire {
            background: #c06c4a;
        }
        .report-container .tag-earth {
            background: #b8936b;
        }
        .report-container .tag-water {
            background: #5b8aaa;
        }
        .report-container .matrix-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 0.82rem;
            overflow-x: auto;
            display: block;
        }
        .report-container .matrix-table th,
        .report-container .matrix-table td {
            border: 1px solid #dce6f0;
            padding: 7px 8px;
            text-align: center;
            white-space: nowrap;
        }
        .report-container .matrix-table th {
            background: #eef4f9;
            font-weight: 700;
            color: var(--blue-border);
            font-size: 0.75rem;
        }
        .report-container .matrix-table td {
            background: #fafcfd;
        }
        .report-container .matrix-table .state-fanmao {
            color: #2d6a3f;
            font-weight: 700;
        }
        .report-container .matrix-table .state-shengzhang {
            color: #4a8c5c;
        }
        .report-container .matrix-table .state-juansuo {
            color: #b8860b;
        }
        .report-container .matrix-table .state-beiyanmai {
            color: #c0392b;
            font-weight: 600;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .q-text {
                font-size: 0.9rem;
            }
            .option-item {
                font-size: 0.82rem;
                padding: 10px 10px 10px 32px;
            }
            .option-radio {
                width: 17px;
                height: 17px;
                left: 8px;
            }
            .question-card {
                padding: 16px 12px 14px;
            }
            .report-container {
                padding: 18px 12px;
            }
            .progress-icons {
                gap: 2px;
            }
            .progress-icon {
                font-size: 1rem;
            }
            .btn-submit {
                padding: 12px 30px;
                font-size: 0.95rem;
            }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c4cfda;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a0b4c4;
        }

        /* 打印 */
        @media print {
            .progress-bar-wrapper {
                position: relative;
                box-shadow: none;
            }
            .btn-submit {
                display: none;
            }
            .question-card {
                break-inside: avoid;
                box-shadow: none;
            }
            body {
                background: #fff;
            }
        }
    </style>
</head>
<body>

    <!-- 顶部进度条 -->
    <div class="progress-bar-wrapper" id="progressBarWrapper">
        <div class="progress-bar-inner">
            <span class="progress-title">🪴 生命种子探测</span>
            <span class="progress-icons" id="progressIcons"></span>
            <span class="progress-count" id="progressCount">0 / 18 题已答</span>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="main-container" id="mainContainer">

        <!-- 介绍卡片 -->
        <div class="intro-card" id="introCard">
            <h1>🪴 生命种子探测</h1>
            <p class="subtitle">迫选结构试题 · 18道题 · 6个现实域 × 3层探测</p>
            <div class="instruction">
                <strong>作答说明：</strong>每题选择一个最接近你<strong>近一年真实感受</strong>的选项。如果有多个接近的，选那个让你<strong>最不想承认</strong>的——那往往是正确答案。<br>
                本测试探测你在<strong>身体/资源、成长/能力、关系/亲密、群体/评价、意义/信念、机制/系统</strong>六个现实域中，五种驱动力的种子状态。
            </div>
        </div>

        <!-- 题目区域 -->
        <div id="questionsContainer"></div>

        <!-- 提交按钮 -->
        <div class="submit-section" id="submitSection">
            <button class="btn-submit" id="btnSubmit" disabled onclick="submitAll()">提交全部答案，生成报告</button>
            <p class="incomplete-warning" id="incompleteWarning">⚠️ 请完成所有18道题后再提交</p>
        </div>

        <!-- 报告区域 -->
        <div class="report-container" id="reportContainer"></div>
    </div>

    <script>
        (function() {
            // ==================== 题目数据：18道迫选题，完整保留原文 ====================
            const questionsData = [
                // ---- PN 身体/空间/资源 ----
                {
                    id: 'PN-1',
                    domain: '身体/空间/资源',
                    domainShort: 'PN',
                    qType: 'Q1',
                    text: 'PN-1｜身体/空间/资源——你最依赖什么来稳住自己？',
                    options: [
                        'A. 靠在最熟悉的环境里待着，这里有我需要的安全感',
                        'B. 靠自己把一切都整理好、按计划来——秩序让我感到踏实',
                        'C. 靠手里的资源足够多、余地足够大——有后路就不慌',
                        'D. 靠能随时调整状态、说动就能动起来的能力',
                        'E. 靠跳出身体感受，从更高处看一切——这具身体只是载体'
                    ]
                }, {
                    id: 'PN-2',
                    domain: '身体/空间/资源',
                    domainShort: 'PN',
                    qType: 'Q2',
                    text: 'PN-2｜身体/空间/资源——你最难忍受什么？',
                    options: [
                        'A. 身体和精力的透支——那之后我对消耗变得格外警惕',
                        'B. 资源突然缩减——经历过一次不安全之后，我对储备特别在意',
                        'C. 身体被困住动不了——那让我感觉像被活埋',
                        'D. 长期处于"不太够"但没崩溃的灰色状态——慢性消耗比一次爆发更折磨',
                        'E. 身体被过度关注——我不太愿意把注意力放在身体感受上'
                    ]
                }, {
                    id: 'PN-3',
                    domain: '身体/空间/资源',
                    domainShort: 'PN',
                    qType: 'Q3',
                    text: 'PN-3｜身体/空间/资源——当身体报警时，你更倾向怎么做？',
                    options: [
                        'A. 先停一下，回到一个安全的地方缓一缓',
                        'B. 硬撑着把事情做完，然后按计划休息',
                        'C. 继续推进——还有机会和空间等着我去打开',
                        'D. 越累越冲——撞过去就能突破极限',
                        'E. 不太关注它——身体不舒服的时候，我就把注意力转移到思考上'
                    ]
                },
                // ---- AN 成长/能力/路径 ----
                {
                    id: 'AN-1',
                    domain: '成长/能力/路径',
                    domainShort: 'AN',
                    qType: 'Q1',
                    text: 'AN-1｜成长/能力/路径——你在成长中最依赖什么？',
                    options: [
                        'A. 一个稳定的方向和身份锚点——让我知道自己一直在积累',
                        'B. 清晰的规划和阶段目标——每一步都踏在预定的轨道上',
                        'C. 不断有新的机会和可能性打开——让我看到更大的版图',
                        'D. 持续突破瓶颈的快感——冲不过去的东西让我兴奋',
                        'E. 跳出来重新定义"成长"本身——不被旧路径锁死'
                    ]
                }, {
                    id: 'AN-2',
                    domain: '成长/能力/路径',
                    domainShort: 'AN',
                    qType: 'Q2',
                    text: 'AN-2｜成长/能力/路径——你经历过什么让你不再信任原有的成长方式？',
                    options: [
                        'A. 沿着别人设定的路努力了很久，突然觉得这些没意义了',
                        'B. 花了很多时间提升某个能力，但发现它解决不了我真正在意的问题',
                        'C. 遇到了一个很大的失败或挫折，在那之后我重新定义了成长',
                        'D. 长期卡在一个地方，怎么都突破不了——对"变强"这件事失去了确定感',
                        'E. 我似乎从未认真相信过任何一条成长路径'
                    ]
                }, {
                    id: 'AN-3',
                    domain: '成长/能力/路径',
                    domainShort: 'AN',
                    qType: 'Q3',
                    text: 'AN-3｜成长/能力/路径——你最不想面对什么？',
                    options: [
                        'A. 发现自己一直走的路可能是错的，需要重新选择',
                        'B. 计划被打乱——没有清晰路径的时候我会感到焦虑',
                        'C. 只需要精耕一个方向的时候——我害怕错过了更多的可能性',
                        'D. 成长太慢了——我需要感受到明显的进展',
                        'E. 所有人都说这条路好，但我内心知道它不适合我'
                    ]
                },
                // ---- RN 关系/亲密/协作 ----
                {
                    id: 'RN-1',
                    domain: '关系/亲密/协作',
                    domainShort: 'RN',
                    qType: 'Q1',
                    text: 'RN-1｜关系/亲密/协作——你在关系中最依赖什么？',
                    options: [
                        'A. 对方稳定的回应和陪伴——让我感到有安全底座',
                        'B. 清晰的边界和分工——让我知道什么是我的、什么是对方的',
                        'C. 关系能带来更多的连接和资源——让我的世界变得更大',
                        'D. 能推动关系变化的冲动——冲突和张力让我感觉自己还活着',
                        'E. 跳出情绪看清关系的底层模式——不被绑定'
                    ]
                }, {
                    id: 'RN-2',
                    domain: '关系/亲密/协作',
                    domainShort: 'RN',
                    qType: 'Q2',
                    text: 'RN-2｜关系/亲密/协作——你经历过什么让你对"信任"变得谨慎？',
                    options: [
                        'A. 被过度索取或消耗——之后我对别人掏心掏肺的意愿明显降低了',
                        'B. 被辜负过信任——之后我的信任门槛明显变高了',
                        'C. 在协作中承担了太多责任却得不到对等的回报——之后我更倾向一个人做',
                        'D. 在关系中被拖慢或干扰——一个人更高效',
                        'E. 我本来就不太投入关系，所以谈不上变得更谨慎'
                    ]
                }, {
                    id: 'RN-3',
                    domain: '关系/亲密/协作',
                    domainShort: 'RN',
                    qType: 'Q3',
                    text: 'RN-3｜关系/亲密/协作——你最不敢在关系中做什么？',
                    options: [
                        'A. 让对方看到我真实的需要——我怕被拒绝',

                    span.textContent = '🌱';
                    span.title = q.id;
                    span.dataset.index = idx;
                    span.addEventListener('click', () => {

                        if (card) {

                            card.classList.add('current-card');
                            setTimeout(() => card.classList.remove('current-card'), 2000);
                        }
                    });
                    progressIcons.appendChild(span);
                });

            function updateProgressIcons() {
                const icons = progressIcons.querySelectorAll('.progress-icon');
                icons.forEach((icon, idx) => {
                    const qId = questionsData[idx].id;

                        icon.textContent = '🪴';
                        icon.classList.add('answered');

                        icon.textContent = '🌱';
                        icon.classList.remove('answered');
                    }
                });
                const answeredCount = Object.keys(userAnswers).length;
                progressCount.textContent = answeredCount + ' / ' + totalQuestions + ' 题已答';
                btnSubmit.disabled = answeredCount < totalQuestions;
                if (answeredCount < totalQuestions) {

                questionsContainer.innerHTML = '';

                    card.className = 'question-card';
                    card.id = 'qCard-' + idx;
                    if (userAnswers[q.id] !== undefined) {
                        card.classList.add('answered-card');
                    }

                    const header = document.createElement('div');
                    header.className = 'q-header';
                    const numSpan = document.createElement('span');
                    numSpan.className = 'q-number';
                    numSpan.textContent = q.id;
                    const domainSpan = document.createElement('span');
                    domainSpan.className = 'q-domain';
                    domainSpan.textContent = q.domain + ' · ' + q.qType;
                    header.appendChild(numSpan);
                    header.appendChild(domainSpan);

                    const qText = document.createElement('div');
                    qText.className = 'q-text';
                    qText.textContent = q.text;

                    const optionsList = document.createElement('div');
                    optionsList.className = 'options-list';

                    q.options.forEach((optText, optIdx) => {
                        const optItem = document.createElement('div');
                        optItem.className = 'option-item';
                        if (userAnswers[q.id] === optIdx) {
                            optItem.classList.add('selected');
                        }
                        const radio = document.createElement('span');
                        radio.className = 'option-radio';
                        const letterSpan = document.createElement('span');
                        letterSpan.className = 'option-letter';
                        letterSpan.textContent = String.fromCharCode(65 + optIdx) + '.';

                        });

                });

                html += '<div class="highlight-block"><p>' + substitutionInsights.join('<br>') + '</p></div>';

                html += '<p>这意味着：<strong>你不会在曾经受伤的地方继续使用原来的驱动力。</strong>代偿的本质——在受伤的沙盒上，你把驱动力从"参与"切换成了"防御"。</p>';

                html += '<div class="section-divider"></div>';
                html += '<h3>五行生克初步分析</h3>';
                const engEl = engineElement[strongestEngine];
                html += '<p>你的最强引擎<strong>' + engineNames[strongestEngine] + '</strong>（五行属<strong>' + engEl +
                    '</strong>）在多个沙盒中占据主导。这意味着：</p>';

                const elementInsights = {
                    '木': '追问本质的冲动持续活跃，你不断穿透表象、重构意义。但这可能松动安全底盘的土壤——过度追问让"踏实感"难以扎根。',
                    '金': '规则意识和边界守护极为突出，你善于建立清晰的流程和结构。但过度收束可能让扩张的冲动被压抑，创新和连接受到限制。',
                    '火': '行动力和破局冲动充沛，你不停推动变化、打破僵局。但快速冲锋可能让规则和边界被践踏，结构来不及重建。',
                    '土': '安全感和承载能力深厚，你能在动荡中守住底盘。但过度守成可能让扩张的欲望被堤坝困住，新机会难以进入。',
                    '水': '扩张冲动和连接欲望活跃，你对新机会保持敏锐。但多元方向可能分散行动力，让深度突破变得困难。'
                };
                html += '<div class="insight-block"><p>' + (elementInsights[engEl] || '') + '</p></div>';

                // 恐惧与五行对应
                html += '<div class="section-divider"></div>';
                html += '<h3>恐惧禁区与五行格局</h3>';
                html += '<p>你在深度探测中暴露的最深恐惧——<strong>"' + topFear + '"</strong>——与你的五行生克格局直接对应。这不是病理，这是你的系统在极端条件下的最优解。</p>';

                html += '<div class="warn-block"><p>每一处繁茂，都是对一处凋零的回应。看懂这场资源改道，就是看懂了你的系统在历史中做出的所有妥协。</p></div>';

                // 第三层报告
                html += '<h2>🗺️ 第三层报告：结构映射</h2>';
                html += '<p>以下呈现你系统中值得注意的结构呼应——两个不同沙盒上的驱动力状态被并置在一起，形成功能组合。它们可能互相强化，也可能互相抵消，请结合自身经验判断。</p>';

                // 基于Q1数据生成结构映射
                let mappingPairs = [];
                const allSandboxes = ['PN', 'AN', 'RN', 'IN', 'MN', 'FN'];
                for (let i = 0; i < allSandboxes.length; i++) {
                    for (let j = i + 1; j < allSandboxes.length; j++) {
                        const engA = q1SandboxEngine[allSandboxes[i]];
                        const engB = q1SandboxEngine[allSandboxes[j]];
                        if (engA && engB && engA === engB) {
                            mappingPairs.push({
                                sbA: allSandboxes[i],
                                sbB: allSandboxes[j],
                                eng: engA,
                                type: '同引擎异沙盒'
                            });
                        }
                    }
                }

                if (mappingPairs.length > 0) {
                    // 取前3组
                    const displayPairs = mappingPairs.slice(0, 3);
                    displayPairs.forEach(pair => {
                        html += '<div class="highlight-block">';
                        html += '<p><strong>' + sandboxShortNames[pair.sbA] + '</strong>上<strong>' +
                            engineShortNames[pair.eng] + '</strong>的高度活跃 × <strong>' + sandboxShortNames[
                                pair.sbB] + '</strong>上<strong>' + engineShortNames[pair.eng] +
                            '</strong>的高度活跃。</p>';
                        html += '<p>你把<strong>' + engineShortNames[pair.eng] + '</strong>的驱动力同时用在了<strong>' +
                            sandboxShortNames[pair.sbA] + '</strong>和<strong>' + sandboxShortNames[pair
                                .sbB] + '</strong>上。同一种驱动力在不同领域形成了功能上的互补或张力。</p>';
                        html += '</div>';
                    });
                } else {
                    html += '<div class="highlight-block"><p>各沙盒的驱动力分布较为分散，未检测到明显的同引擎跨域集中模式。你的系统可能在不同领域灵活调用不同的驱动力。</p></div>';
                }

                // 额外：跨引擎结构呼应
                html += '<div class="section-divider"></div>';
                html += '<h4>跨引擎结构呼应</h4>';
                const engPairs = [
                    { a: 'PN', b: 'FN', desc: '身体底盘与系统运转之间的呼应——底层硬件基座的能量状态，会向上传导到系统搭建的稳定性。' },
                    { a: 'RN', b: 'IN', desc: '关系连接与群体归属之间的呼应——点到点的信任和面到面的归属，构成了连接层的完整图谱。' },
                    { a: 'AN', b: 'MN', desc: '成长路径与意义导航之间的呼应——你往哪里走，决定了你相信什么值得走。' },
                ];
                engPairs.forEach(pair => {
                    const engA = q1SandboxEngine[pair.a];
                    const engB = q1SandboxEngine[pair.b];
                    if (engA && engB) {
                        html += '<div class="insight-block"><p><strong>' + sandboxShortNames[pair.a] +
                            '</strong>（依赖' + engineShortNames[engA] + '）与<strong>' + sandboxShortNames[
                                pair.b] + '</strong>（依赖' + engineShortNames[engB] + '）：' + pair.desc +
                            '</p></div>';
                    }
                });

                // 结尾
                html += '<div class="section-divider"></div>';
                html += '<div class="insight-block">';
                html += '<p>🪴 <strong>总结：</strong>这不是病理。这是你的系统在极端条件下的最优解。';
                const endMap = {
                    'T': '追问是自我保护的方式，结构是自我容身的堡垒，抽离是避免误读的策略。',
                    'O': '规则是自我保护的方式，闭环是自我容身的堡垒，边界是避免消耗的策略。',
                    'D': '冲锋是自我保护的方式，突破是自我容身的堡垒，冲击是避免停滞的策略。',
                    'V': '守护是自我保护的方式，承载是自我容身的堡垒，兜底是避免崩塌的策略。',
                    'E': '突围是自我保护的方式，连接是自我容身的堡垒，渗透是避免封闭的策略。'
                };
                html += (endMap[strongestEngine] || '') + '</p>';
                html += '<p>每一处繁茂，都是对一处凋零的回应。看懂这场资源改道，就是看懂了你的系统在历史中做出的所有妥协。</p>';
                html += '</div>';

                reportContainer.innerHTML = html;
            }

            // ==================== 初始化 ====================
            function init() {
                buildProgressIcons();
                renderAllQuestions();
                updateProgressIcons();
                // 初始状态下报告隐藏
                reportContainer.classList.remove('show');
                document.getElementById('submitSection').style.display = 'block';
                document.getElementById('introCard').style.display = 'block';
                questionsContainer.style.display = 'block';
            }

            // 暴露提交函数到全局
            window.submitAll = submitAll;

            init();
        })();
    </script>
</body>
</html>
