    function attachRadioEvents() {

                answers.freq[q.id] = e.target.value;
                updateProgress();
                const card = document.querySelector(`.q-card[data-qid="freq_${q.id}"]`);
                if(card) card.classList.remove('missing');
            }));
        });
        forcedQuestions.forEach(fq => {
            const radios = document.querySelectorAll(`input[name="forced_${fq.id}"]`);
            radios.forEach(r => r.addEventListener('change', (e) => {
                answers.forced[fq.id] = e.target.value;

        });

        let chainHtml = `<h3>五、⛓️ 因果链与层级流动分析</h3>
        <p><strong>基础设定</strong><br>生循环：T🌲→ D🔥→ V⛰️→ O💎→ E🌊→ T🌲<br>克循环：T🌲→ V⛰️→ E🌊→ D🔥→ O💎→ T🌲</p>
        <p><strong>引擎旺衰判定</strong><br>旺（总分≥65 或 繁茂≥3）：${wangList.join(', ') || '无'}<br>衰（总分&lt;35 或 至少1个被掩埋）：${shuaiList.join(', ') || '无'}<br>健康校验（无被掩埋）：${healthyList.join(', ') || '无'}</p>
        <p><strong>触发的因果链</strong></p>${chainText.map(c=>`<p>${c}</p>`).join('')}`;
        
        // 恐惧禁区
        let fearMap = { 'A':'失去依托/被拒绝/崩塌','B':'混乱/失控/被裹挟','C':'错过/被取代/不够大','D':'无力/被困/被压制','E':'不真实/表演/偏离本质' };
        let fearHtml = `<h3>六、😨 恐惧禁区映射（Q3汇总）</h3><table><thead><tr><th>沙盒</th><th>Q3选项</th><th>恐惧含义</th></tr></thead><tbody>`;
        for(let s of sandboxes) {
            let q3 = forcedQuestions.find(f => f.sandbox===s && f.qtype==='Q3');
            let opt = answers.forced[q3?.id] || '—';
            fearHtml += `<tr><td>${sandboxFull[s]}</td><td>${opt}</td><td>${fearMap[opt] || '未选'}</td></tr>`;
        }
        fearHtml += `</tbody></table>`;
        
        // 总览矩阵表格（带颜色）
        let matrixHtml = `<h3>一、🌡️ 总览矩阵</h3><h4>引擎 × 沙盒 热度图</h4><table><thead><tr><th>项目\\沙盒</th><th>PN</th><th>AN</th><th>RN</th><th>IN</th><th>MN</th><th>FN</th><th>总分</th></tr></thead><tbody>`;
        for(let e of engines) {
            matrixHtml += `<tr><td style="font-weight:600">${engineFull[e]}</td>`;
            for(let s of sandboxes) {
                let sc = engineScores[e][s] || 0;
                let st = seedStatus[e][s];
                let colorClass = st==='繁茂'?'status-bloom':(st==='生长'?'status-grow':(st==='卷缩'?'status-shrink':'status-buried'));
                matrixHtml += `<td class="${colorClass}">${sc}<br>${st}</td>`;
            }
            matrixHtml += `<td><strong>${engineTotals[e]}</strong></td></tr>`;
        }
        matrixHtml += `<tr style="background:#f5f9ff;"><td style="font-weight:600">沙盒总分</td>`;
        for(let s of sandboxes) matrixHtml += `<td><strong>${sandboxTotals[s]}</strong></td>`;
        matrixHtml += `<td>——</td></tr></tbody></table>`;
        
        let statsHtml = `<div class="stat-badge">🌳 繁茂：${countFM}个 🌱 生长：${countSZ}个 🐚 卷缩：${countJS}个 🪦 被掩埋：${countBYM}个</div>
        <div><strong>🧩 综合判定</strong> ${verdict}</div>`;
        
        return matrixHtml + statsHtml + engineBodyHtml + sandboxBodyHtml + forcedRecords + chainHtml + fearHtml;
    }
    
    document.getElementById('submitReport').addEventListener('click', () => {
        let totalQ = freqQuestions.length + forcedQuestions.length;
        let answeredCount = 0;
        freqQuestions.forEach(q => { if(answers.freq[q.id]) answeredCount++; });
        forcedQuestions.forEach(fq => { if(answers.forced[fq.id]) answeredCount++; });
        if(answeredCount !== totalQ) {
            alert(`您还有 ${totalQ - answeredCount} 道题未答，已为您定位到第一道未答题。`);
            scrollToFirstMissing();
            return;
        }
        const fullReport = generateFullReport();
        document.getElementById('reportHtml').innerHTML = fullReport;
        document.getElementById('reportSection').style.display = 'block';
        window.scrollTo({ top: document.getElementById('reportSection').offsetTop - 30, behavior: 'smooth' });
    });
    
    document.getElementById('resetAll').addEventListener('click', () => {
        answers = { freq: {}, forced: {} };
        renderAllQuestions();
        document.getElementById('reportSection').style.display = 'none';
        updateProgress();
    });
    
    renderAllQuestions();
</script>
</body>
</html>
