<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>生命种子探测 · 完整心理测试</title>

        :root {
            --blue: #4A7FB5;
            --blue-border: #3D6D9E;

            --white: #ffffff;
            --text: #2c3e50;
            --text-secondary: #5a6c7d;
            --gold: #c9a962;
            --red-soft: #c0392b;
            --shadow: 0 2px 12px rgba(61, 109, 158, 0.08);

            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, sans-serif;

        }

            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .header-inner {
            max-width: 960px; margin: 0 auto; display: flex; align-items: center;

        }
        .logo-title {
            font-weight: 700; font-size: 1.1rem; color: var(--blue-border);
            letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px;
        }
        .tab-switcher {
            display: flex; gap: 4px; background: #eef2f8; border-radius: 24px; padding: 3px;
        }
        .tab-btn {
            padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
            background: transparent; border: none; cursor: pointer; color: #5f7388;
            transition: var(--transition); white-space: nowrap;
        }
        .tab-btn.active {
            background: var(--white); color: var(--blue-border); box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .progress-wrap {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }
        .progress-icons { display: flex; gap: 2px; flex-wrap: wrap; max-height: 30px; overflow-y: auto; }
        .progress-dot {
            font-size: 0.7rem; cursor: pointer; opacity: 0.35; filter: grayscale(0.8);
            transition: var(--transition);
        }
        .progress-dot.answered { opacity: 1; filter: grayscale(0); color: var(--blue-border); font-weight: bold; }
        .progress-count { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; }

        .main-container {
            max-width: 920px; margin: 0 auto; padding: 18px 14px 50px;
        }
        .test-panel { display: none; }
        .test-panel.active { display: block; }

        .intro-card {
            background: var(--white); border: 2px solid var(--blue-border);
            border-radius: var(--radius); padding: 22px 20px; margin-bottom: 18px; box-shadow: var(--shadow);
        }
        .intro-card h2 { font-size: 1.3rem; color: var(--blue-border); margin-bottom: 6px; }
        .intro-card .instruction {
            background: var(--blue-bg); border-radius: var(--radius-sm); padding: 12px 16px;
            font-size: 0.85rem; line-height: 1.6; border-left: 5px solid #6b9fd2;
        }

        .question-card {
            background: var(--white); border: 2px solid #e0e8f0; border-radius: var(--radius);
            padding: 16px 16px 12px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            scroll-margin-top: 90px; transition: border 0.25s;
        }
        .question-card.answered-card { border-color: #b8d2ea; }
        .q-header {
            display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap;
        }
        .q-tag {
            display: inline-block; background: var(--blue); color: #fff; font-weight: 600;
            font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; letter-spacing: 0.3px;
        }
        .q-domain { font-size: 0.72rem; color: #4a6d8c; font-weight: 600; }
        .q-index { font-size: 0.7rem; color: #8a9aa8; }
        .q-text {
            font-weight: 500; font-size: 0.9rem; color: var(--text); margin-bottom: 10px;
            line-height: 1.55; word-break: break-word;
        }
        .options-row, .options-list {
            display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
        }
        .options-list { flex-direction: column; gap: 5px; }
        .option-btn, .option-item {
            cursor: pointer; padding: 6px 14px; border-radius: 20px;
            border: 1.5px solid #dce4f0; background: #fafcfd; font-size: 0.78rem;
            transition: var(--transition); user-select: none; white-space: nowrap; color: var(--text);
        }
        .option-item {
            border-radius: var(--radius-sm); padding: 8px 10px 8px 32px; position: relative;
            white-space: normal; line-height: 1.45;
        }
        .option-radio {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            width: 16px; height: 16px; border-radius: 50%; border: 2px solid #c4cfda;
            background: #fff; pointer-events: none;
        }
        .option-item.selected .option-radio {
            border-color: var(--blue-border); background: var(--blue-border);
            box-shadow: inset 0 0 0 4px #fff;
        }
        .option-btn.selected, .option-item.selected {
            background: #e2effa; border-color: var(--blue-border); font-weight: 600;
            color: #1a3a54; box-shadow: 0 1px 6px rgba(61,109,158,0.18);
        }
        .option-btn:hover, .option-item:hover { background: #eef5fb; border-color: #6b9fd2; }

        .submit-area { text-align: center; margin: 16px 0 30px; }
        .btn {
            background: var(--blue-border); color: #fff; border: none; padding: 12px 38px;
            font-size: 0.95rem; font-weight: 700; border-radius: 30px; cursor: pointer;
            letter-spacing: 0.6px; transition: var(--transition); box-shadow: 0 4px 14px rgba(61,109,158,0.25);
        }
        .btn:hover { background: #2f5c89; box-shadow: 0 6px 18px rgba(61,109,158,0.35); transform: translateY(-1px); }
        .btn:disabled { background: #b0c5d8; cursor: not-allowed; box-shadow: none; transform: none; }
        .warning-text { color: #c0392b; font-size: 0.78rem; margin-top: 4px; display: none; }
        .warning-text.show { display: block; }

        .report-box {
            display: none; background: var(--white); border: 2px solid var(--blue-border);
            border-radius: var(--radius); padding: 24px 20px; box-shadow: var(--shadow-lg);
            margin-top: 16px; line-height: 1.8;
        }
        .report-box.show { display: block; }
        .report-box h2 { font-size: 1.25rem; color: var(--blue-border); margin: 20px 0 8px; }
        .report-box h3 { font-size: 1rem; color: #3d5f80; margin: 14px 0 4px; }
        .highlight, .insight {
            padding: 12px 16px; border-radius: 6px; margin: 10px 0; line-height: 1.7;
        }
        .highlight { background: #f5f8fc; border-left: 4px solid #6b9fd2; }
        .insight { background: #fdf8f0; border-left: 4px solid var(--gold); }
        .matrix-table {
            width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.75rem;
            overflow-x: auto; display: block;
        }
        .matrix-table th, .matrix-table td {
            border: 1px solid #dce6f0; padding: 5px 6px; text-align: center; white-space: nowrap;
        }
        .matrix-table th { background: #eef4f9; font-weight: 700; color: var(--blue-border); }

        @media (max-width: 640px) {
            .option-btn { font-size: 0.7rem; padding: 5px 10px; }
            .option-item { font-size: 0.75rem; padding-left: 28px; }
            .q-text { font-size: 0.82rem; }
            .header-inner { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>

    // 全局状态
    const answers90 = {};   // { fullId: 1-5 }

    // DOM元素

    const panel18 = document.getElementById('panel18');
    const questions90Div = document.getElementById('questions90');
    const questions18Div = document.getElementById('questions18');
    const report90Div = document.getElementById('report90');
    const report18Div = document.getElementById('report18');
    const btn90 = document.getElementById('btnSubmit90');
    const btn18 = document.getElementById('btnSubmit18');
    const warn90 = document.getElementById('warn90');
    const warn18 = document.getElementById('warn18');
    const globalProgress = document.getElementById('globalProgress');

    // Tab切换
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            const tab = btn.dataset.tab;
            if (tab === '90') { panel90.classList.add('active'); panel18.classList.remove('active'); }
            else { panel18.classList.add('active'); panel90.classList.remove('active'); }
            updateGlobalProgress();
        });
    });

    // 渲染90题
    function render90() {
        questions90Div.innerHTML = '';
        questions90List.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = 'q90-'+idx;
            const header = document.createElement('div');
            header.className = 'q-header';
            header.innerHTML = `<span class="q-tag">${q.engine}</span><span class="q-domain">${q.sandbox}</span><span class="q-index">#${idx+1}</span>`;
            const qText = document.createElement('div');
            qText.className = 'q-text';
            qText.textContent = q.text;
            const optionsRow = document.createElement('div');
            optionsRow.className = 'options-row';
            ['A','B','C','D','E'].forEach((lbl, oi) => {
                const btn = document.createElement('span');
                btn.className = 'option-btn';
                btn.textContent = lbl;
                if (answers90[q.fullId] === oi+1) btn.classList.add('selected');
                btn.addEventListener('click', () => {
                    answers90[q.fullId] = oi+1;
                    optionsRow.querySelectorAll('.option-btn').forEach((b,i) => b.classList.toggle('selected', i===oi));
                    card.classList.add('answered-card');
                    update90Progress();
                });
                optionsRow.appendChild(btn);
            });
            card.appendChild(header);
            card.appendChild(qText);
            card.appendChild(optionsRow);
            questions90Div.appendChild(card);
        });
    }

    // 渲染18题
    function render18() {
        questions18Div.innerHTML = '';
        questions18List.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = 'q18-'+idx;
            const header = document.createElement('div');
            header.className = 'q-header';
            header.innerHTML = `<span class="q-tag">${q.id}</span><span class="q-domain">${q.domain} · ${q.qtype}</span>`;
            const qText = document.createElement('div');
            qText.className = 'q-text';
            qText.textContent = q.text;
            const optionsList = document.createElement('div');
            optionsList.className = 'options-list';
            q.options.forEach((opt, oi) => {
                const item = document.createElement('div');
                item.className = 'option-item';
                const radio = document.createElement('span');
                radio.className = 'option-radio';
                item.appendChild(radio);
                item.appendChild(document.createTextNode(opt));
                if (answers18[q.id] === oi) item.classList.add('selected');
                item.addEventListener('click', () => {
                    answers18[q.id] = oi;
                    optionsList.querySelectorAll('.option-item').forEach((it,i) => it.classList.toggle('selected', i===oi));
                    card.classList.add('answered-card');
                    update18Progress();
                });
                optionsList.appendChild(item);
            });
            card.appendChild(header);
            card.appendChild(qText);
            card.appendChild(optionsList);
            questions18Div.appendChild(card);
        });
    }

    function update90Progress() {
        const answered = Object.keys(answers90).length;
        btn90.disabled = answered < 90;
        warn90.classList.toggle('show', answered < 90);
        updateGlobalProgress();
    }
    function update18Progress() {
        const answered = Object.keys(answers18).length;
        btn18.disabled = answered < 18;
        warn18.classList.toggle('show', answered < 18);
        updateGlobalProgress();
    }
    function updateGlobalProgress() {
        const a90 = Object.keys(answers90).length;
        const a18 = Object.keys(answers18).length;
        const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
        if (activeTab === '90') globalProgress.textContent = `90题：${a90}/90 已答`;
        else globalProgress.textContent = `18题：${a18}/18 已答`;
    }

    // 提交90题
    function submit90() {
        if (Object.keys(answers90).length < 90) {
            warn90.classList.add('show');
            return;
        }
        const locusScores = {};
        questions90List.forEach(q => {
            const key = q.engineId+'-'+q.sandboxId || q.fullId.slice(0,-1);
            if (!locusScores[key]) locusScores[key] = 0;
            locusScores[key] += answers90[q.fullId] || 1;
        });
        let html = '<h2>🪴 90题种子状态报告</h2>';
        html += '<p>每个定位点3题总分（3-15），状态：13-15繁茂 | 10-12生长 | 6-9卷缩 | 3-5被掩埋</p>';
        html += '<table class="matrix-table"><thead><tr><th>引擎</th>';
        sandboxes90.forEach(s => html += '<th>'+s.short+'</th>');
        html += '<th>总分</th></tr></thead><tbody>';
        engines90.forEach(eng => {
            html += '<tr><td><strong>'+eng.short+'</strong></td>';
            let total = 0;
            sandboxes90.forEach(sb => {
                const key = eng.id+'-'+sb.id;
                const sc = locusScores[key] || 0; total += sc;
                html += `<td>${sc}</td>`;
            });
            html += `<td><strong>${total}</strong></td></tr>`;
        });
        html += '</tbody></table>';
        report90Div.innerHTML = html;
        report90Div.classList.add('show');
        report90Div.scrollIntoView({behavior:'smooth'});
    }

    // 提交18题
    function submit18() {
        if (Object.keys(answers18).length < 18) {
            warn18.classList.add('show');
            return;
        }
        const q1Map = {0:'V-土-承载',1:'O-金-收束',2:'E-水-漫延',3:'D-火-突破',4:'T-木-穿透'};
        let html = '<h2>🎯 18题迫选结构报告</h2>';
        html += '<h3>各沙盒最依赖驱动力 (Q1)</h3>';
        const q1Questions = questions18List.filter(q=>q.qtype==='Q1');
        q1Questions.forEach(q=>{
            const ans = answers18[q.id];
            if (ans !== undefined) {
                html += `<p><strong>${q.id.split('-')[0]}</strong>：依赖 ${q1Map[ans] || '未知'}（选${String.fromCharCode(65+ans)}）</p>`;
            }
        });
        html += '<div class="insight"><p>代偿模式分析：你不会在曾经受伤的地方继续使用原来的驱动力。在受伤的沙盒上，你把驱动力从“参与”切换成了“防御”。</p></div>';
        report18Div.innerHTML = html;
        report18Div.classList.add('show');
        report18Div.scrollIntoView({behavior:'smooth'});
    }

    btn90.addEventListener('click', submit90);
    btn18.addEventListener('click', submit18);

    // 初始化
    render90();
    render18();
    updateGlobalProgress();
})();
