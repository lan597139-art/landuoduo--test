<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>心灵地图 · 五行驱动力与沙盒生态探测 | 完整版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #eef2ff; font-family: sans-serif; padding: 24px 20px; color: #0f172a; }
        @media (prefers-color-scheme: dark) {
            html, body, .app-container { background: #121212 !important; color: #f8fafc !important; }
            .top-bar { background: #1c1c1e !important; border-bottom: 1px solid #333336 !important; }
            .section, .q-card, .report-area, textarea { background: #1c1c1e !important; border-color: #333336 !important; }
            .options label { background: #2c2c2e !important; color: #cbd5e1 !important; }
        }
        .app-container { max-width: 1400px; margin: 0 auto; background: #ffffff; border: 2px solid #1e4bd2; border-radius: 28px; padding: 24px 28px; }
        .top-bar { position: sticky; top: 0; z-index: 100; background: #ffffff; border-bottom: 2px solid #1e4bd2; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; color: #1e3a8a; }
        .progress-box { background: #eef2ff; padding: 6px 16px; border-radius: 60px; font-weight: 600; color: #1e4bd2; }
        .section { margin: 32px 0; border: 1px solid #bfd9ff; border-radius: 24px; overflow: hidden; }
        .section-header { background: #f0f5ff; padding: 14px 22px; }
        .questions-grid { padding: 16px 20px; display: flex; flex-direction: column; gap: 18px; }
        .q-card { border: 1px solid #d9e6ff; border-radius: 12px; padding: 16px; }
        .q-card.missing { border: 2px solid #e11d48; background-color: #fff0f2; }
        .q-title { font-weight: 700; color: #1e4bd2; background: #eef2ff; display: inline-block; padding: 2px 12px; border-radius: 30px; margin-bottom: 10px; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .options label { display: flex; align-items: center; gap: 10px; border: 1.5px solid #cbdff2; padding: 10px; border-radius: 8px; cursor: pointer; }
        .btn-primary { background: #1e4bd2; color: white; border: none; padding: 12px 36px; font-weight: 600; border-radius: 60px; cursor: pointer; }
        .btn-secondary { background: #f1f5f9; border: 1px solid #1e4bd2; color: #1e4bd2; padding: 12px 28px; border-radius: 60px; cursor: pointer; }
        .report-content table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .report-content th, .report-content td { border: 1px solid #bdd4ff; padding: 10px; text-align: center; }
        .status-bloom { background-color: rgba(144, 238, 144, 0.4); }
        .status-grow { background-color: rgba(173, 216, 230, 0.4); }
        .status-shrink { background-color: rgba(255, 255, 0, 0.3); }
        .status-buried { background-color: rgba(255, 99, 71, 0.3); }
    </style>
</head>
<body>
<div class="top-bar">
    <span class="logo">🧭 心灵地图 · 五行驱动力与沙盒生态探测</span>
    <div class="progress-box" id="progressDisplay">📋 进度 0 / 108</div>
</div>
<div class="app-container">
    <div id="questionsContainer"></div>
    <div class="action-buttons" style="display:flex; justify-content:center; gap:20px; margin:30px 0;">
        <button class="btn-primary" id="submitReport">✨ 生成心灵地图报告 ✨</button>
        <button class="btn-secondary" id="resetAll">🗑️ 清空所有答案</button>
    </div>
    <div id="reportSection" class="report-area" style="display: none; border-top:3px solid #1e4bd2; padding-top:20px;">
        <h2>📜 探测报告</h2>
        <div id="reportHtml" class="report-content"></div>
    </div>
</div>
<script>
    const explanations = {
        energy: { '繁茂': '🌳 繁茂\n能量高度活跃。', '生长': '🌱 生长\n能量处于健康稳态。', '卷缩': '🐚 卷缩\n能量收缩防御。', '被掩埋': '🪦 被掩埋\n能量完全断电。' },
        engines: { 'O-金-收束': '追求秩序与边界。', 'V-土-承载': '追求被看见与锚定。', 'D-火-突破': '追求变化与破局冲动。', 'E-水-漫延': '追求版图漫延与自由。', 'T-木-穿透': '追问底层逻辑与本质。' },
        sandboxes: { 'PN': '物理底盘', 'AN': '能力进化', 'RN': '关系网络', 'IN': '社会舞台', 'MN': '意义导航', 'FN': '系统运转' }
    };
    const engines = ['O','V','D','E','T'];
    const sandboxes = ['PN','AN','RN','IN','MN','FN'];
    const freqTexts = {
        'O_PN': ['我能清晰感知自己身体的边界','我对钱、物资、生活空间有明确规划','当身体发出疲惫信号时我能停下来'],
        'O_AN': ['我对自己的成长路径有清晰规划','我能按计划推进学习','复盘时我能客观看到规律'],
        'O_RN': ['关系中我清楚自己的边界','关系出现模糊时我能主动澄清规则','我能按自己设定互动维护长期关系'],
        'O_IN': ['群体中我清楚自己的角色','面对群体中隐性规则我能看透','我能用清晰规则保护自己'],
        'O_MN': ['我有一套自洽的信念体系','信念冲突时我能调整框架','我的目标和行动之间逻辑清晰'],
        'O_FN': ['我能建立有效生活习惯','建立的流程能稳定运行','旧系统失效时我能快速迭代'],
        'V_PN': ['我的身体让我感到安全踏实','居所空间让我感到安稳','物质生活有稳定安全感'],
        'V_AN': ['对走的路有持续确认感','速度慢仍感觉方向正确','确信过去的积累属于我'],
        'V_RN': ['有让我感到安全依赖的人','相信对方不会轻易离开','需要支持时知道向谁求助'],
        'V_IN': ['群体中有稳定归属感','群体中有立足之地','不需要通过讨好维持位置'],
        'V_MN': ['内心有稳定价值锚点','外部变化快仍坚坚守某些东西','未在意义海洋里漂泊'],
        'V_FN': ['依赖的习惯让我踏实安心','常规系统能兜住大部分日常','常规变成稳定习惯'],
        'D_PN': ['行动时身体给足够能量','能主动调整身体状态','面对体力挑战愿意尝试'],
        'D_AN': ['遇到瓶颈有推开的动能','能主动向更难目标突围','长期无反馈仍保持推进动能'],
        'D_RN': ['关系出现僵局愿意打破','能推动关系深入发展','冲突中能站得住'],
        'D_IN': ['群体中有争取位置的冲动','群体走偏愿意提不同意见','面对竞争不退缩'],
        'D_MN': ['对过时信念有质疑打破冲动','能主动重写目标','旧意义崩塌后有动力寻新意义'],
        'D_FN': ['旧流程不适用有推倒魄力','能主动发起系统变革','面对僵化机制有重构行动力'],
        'E_PN': ['有信心获得更多资源','主动扩大生活空间边界','不害怕资源失控'],
        'E_AN': ['对新技能保持好奇尝试','多个成长方向能平衡','愿意探索新领域'],
        'E_RN': ['主动认识新朋友扩大网络','能同时维护多段关系','善于连接不同人'],
        'E_IN': ['渴望进入更大影响力圈层','扩大群体话语权','面对高曝光不收缩'],
        'E_MN': ['希望理念影响更多人','传播价值观到更大范围','理念被接受感到充实'],
        'E_FN': ['能将系统复制到更大范围','规模扩张能保持机制稳定','方法能放大规模化'],
        'T_PN': ['跳出身体不适理解信号','限制中保持精神自由','提炼物质现实的底层规律'],
        'T_AN': ['失效时重新定义成长','跳出能力标准看本质','零散经验中提炼规律'],
        'T_RN': ['跳出情绪看清关系模式','纠结中抽离重新理解模式','提炼规律不从零开始'],
        'T_IN': ['跳出群体评价看权力结构','被裹挟时抽离看清背后议题','表面互动中看出深层结构'],
        'T_MN': ['崩溃时能从高维重构','跳出相信的东西审视它','个人经验升华人类处境理解'],
        'T_FN': ['抽象出底层机制第一性原理','模型层面诊断系统问题','提取跨域系统中共性洞察']
    };

    let freqQuestions = [];
    let qid = 0;
    for(let e of engines) {
        for(let s of sandboxes) {
            const key = `${e}_${s}`;
            const texts = freqTexts[key];
            for(let idx=0; idx<3; idx++) {
                freqQuestions.push({ id: qid++, type: 'freq', engine: e, sandbox: s, text: texts[idx], label: `${e}-${s}-${idx+1}` });
            }
        }
    }

    const forcedQuestions = [
        { id: 200, sandbox:'PN', qtype:'Q1', text:'你最依赖什么来稳住自己？', opts:['A. 靠在最熟悉的环境里待着','B. 靠自己按计划建立秩序','C. 靠手里的资源足够多有后路','D. 靠说动就能动起来的能力','E. 靠跳出身体感受从更高处看'] },
        { id: 201, sandbox:'PN', qtype:'Q2', text:'你最难忍受什么？', opts:['A. 身体和精力的透支','B. 资源突然缩减','C. 身体被困住动不了','D. 长期灰色状态慢性消耗','E. 身体被过度关注'] },
        { id: 202, sandbox:'PN', qtype:'Q3', text:'当身体报警时倾向怎么做？', opts:['A. 先停一下缓一缓','B. 硬撑完按计划休息','C. 继续推进开拓空间','D. 越累越冲撞过去','E. 转移注意力到思考上'] },
        { id: 203, sandbox:'AN', qtype:'Q1', text:'你在成长中最依赖什么？', opts:['A. 稳定方向身份锚点','B. 清晰规划和阶段目标','C. 看到更大的版图可能性','D. 持续突破瓶颈的快感','E. 重新定义成长本身'] },
        { id: 204, sandbox:'AN', qtype:'Q2', text:'什么让你不再信任原成长方式？', opts:['A. 沿着设定努力突然觉得无意义','B. 提升能力解决不了真正在意的问题','C. 重大挫折重新定义成长','D. 长期卡死失去确定感','E. 从未认真相信成长路径'] },
        { id: 205, sandbox:'AN', qtype:'Q3', text:'你最不想面对什么？', opts:['A. 发现路错重新选择','B. 路径打乱无序焦虑','C. 精耕单方向失去可能性','D. 进展太慢感觉不到成长','E. 知道路不适合内耗'] },
        { id: 206, sandbox:'RN', qtype:'Q1', text:'你在关系中最依赖什么？', opts:['A. 对方稳定回应陪伴','B. 清晰边界和分工','C. 关系带来连接资源','D. 冲突和张力的鲜活感','E. 看清底层模式不被绑定'] },
        { id: 207, sandbox:'RN', qtype:'Q2', text:'什么让你对信任变得谨慎？', opts:['A. 被过度索取消耗热情','B. 被辜负提高信任门槛','C. 担责收获低倾向单干','D. 被关系拖慢执行效率','E. 本来就不深投无所谓谨慎'] },
        { id: 208, sandbox:'RN', qtype:'Q3', text:'曾经你最不敢在关系中做什么？', opts:['A. 暴露真实需要怕被拒','B. 打破僵局担心变糟','C. 混乱时立规则显得冷','D. 依赖别人暴露弱点','E. 主动结束不滋养的关系'] },
        { id: 209, sandbox:'IN', qtype:'Q1', text:'你在群体中最依赖什么？', opts:['A. 稳定位置归属感','B. 清楚规则角色不乱位','C. 扩大话语可见度','D. 主动争取位置不吞没','E. 看透群体结构不被牵着走'] },
        { id: 210, sandbox:'IN', qtype:'Q2', text:'什么让你对群体退避？', opts:['A. 持续误解被贴错标签','B. 坚持立场付出代价','C. 规则不公退出竞争','D. 从不关心群体位置','E. 一直被看到无退避'] },
        { id: 211, sandbox:'IN', qtype:'Q3', text:'你在群体中最高怕什么？', opts:['A. 被孤立无人站身边','B. 失去自我判断标准','C. 位置话语权被取代','D. 被发现不完美的本真','E. 表达意见冲突升级'] },
        { id: 212, sandbox:'MN', qtype:'Q1', text:'你在意义中最依赖什么？', opts:['A. 长期确认自我认同锚点','B. 清晰自洽信念结构','C. 理念信念影响他人','D. 质疑打破旧信念','E. 高层重构意义精神自由'] },
        { id: 213, sandbox:'MN', qtype:'Q2', text:'什么对意义保持警觉？', opts:['A. 信过无法兑现保持距离','B. 环境氛围营造非真心','C. 看重能否现实落地','D. 从不相信宏大叙事','E. 信念坚定无需警觉'] },
        { id: 214, sandbox:'MN', qtype:'Q3', text:'在意义层面最不敢做什么？', opts:['A. 放弃原信念恐惧空窗','B. 诉说信仰怕被嘲笑','C. 投入太多不敢改向','D. 承认无信仰只是表演','E. 怕辜负期待拒绝外部'] },
        { id: 215, sandbox:'FN', qtype:'Q1', text:'你在系统中最依赖什么？', opts:['A. 固定习惯可依赖模板','B. 清晰流程反馈闭环','C. 可复制放大规模结构','D. 打破旧流程低效动力','E. 抽离理解底层获得高维'] },
        { id: 216, sandbox:'FN', qtype:'Q2', text:'什么让你不再信外部系统？', opts:['A. 外部失望自行搭空间','B. 遵守好系统并受益','C. 环境乱搭建安全闭环','D. 试建系统很难坚持','E. 未特别关注规则流程'] },
        { id: 217, sandbox:'FN', qtype:'Q3', text:'建系统时最怕发生什么？', opts:['A. 系统失效秩序崩塌','B. 规则太密作茧自缚','C. 规模失控超出承载','D. 丧失推倒重来勇气','E. 沉溺设计忽略落地执行'] }
    ];

    let answers = { freq: {}, forced: {} };
    let savedAnswers = localStorage.getItem('psychologyTestAnswers');
    if (savedAnswers) {
        try {
            let parsed = JSON.parse(savedAnswers);
            if (parsed.freq) answers.freq = parsed.freq;
            if (parsed.forced) answers.forced = parsed.forced;
        } catch(e) {}
    }

    const freqOptionTexts = { 'A': 'A. 从未有', 'B': 'B. 偶尔有', 'C': 'C. 有时有', 'D': 'D. 经常这样', 'E': 'E. 常态' };

    function renderAllQuestions() {
        let html = '';
        html += `<div class="section"><div class="section-header"><h2>🌱 生命种子探测</h2></div><div class="questions-grid">`;
        freqQuestions.forEach(q => {
            const ans = answers.freq[q.id] || '';
            html += `<div class="q-card ${ans === '' ? 'missing' : ''}" data-qid="freq_${q.id}">
                        <div class="q-title">${q.label}</div>
                        <div class="q-text">${q.text}</div>
                        <div class="options">
                            ${['A','B','C','D','E'].map(opt => `<label><input type="radio" name="freq_${q.id}" value="${opt}" ${ans===opt ? 'checked' : ''}> ${freqOptionTexts[opt]}</label>`).join('')}
                        </div>
                    </div>`;
        });
        html += `</div></div>`;
        html += `<div class="section"><div class="section-header"><h2>🔹 迫选结构题</h2></div><div class="questions-grid">`;
        forcedQuestions.forEach(fq => {
            const ans = answers.forced[fq.id] || '';
            html += `<div class="q-card ${ans === '' ? 'missing' : ''}" data-qid="forced_${fq.id}">
                        <div class="q-title">${fq.sandbox} · ${fq.qtype}</div>
                        <div class="q-text">${fq.text}</div>
                        <div class="options">
                            ${fq.opts.map((opt, idx) => { let letter = String.fromCharCode(65+idx); return `<label><input type="radio" name="forced_${fq.id}" value="${letter}" ${ans===letter ? 'checked' : ''}> ${opt}</label>`; }).join('')}
                        </div>
                    </div>`;
        });
        html += `</div></div>`;
        document.getElementById('questionsContainer').innerHTML = html;
        attachRadioEvents();
        updateProgress();
    }

    function attachRadioEvents() {
        document.querySelectorAll('input[type="radio"]').forEach(r => {
            r.addEventListener('change', (e) => {
                const name = e.target.name;
                const val = e.target.value;
                if(name.startsWith('freq_')) answers.freq[name.replace('freq_', '')] = val;
                if(name.startsWith('forced_')) answers.forced[name.replace('forced_', '')] = val;
                e.target.closest('.q-card').classList.remove('missing');
                updateProgress();
            });
        });
    }

    function updateProgress() {
        let answered = Object.keys(answers.freq).length + Object.keys(answers.forced).length;
        document.getElementById('progressDisplay').innerHTML = `📋 进度 ${answered} / 108`;
        localStorage.setItem('psychologyTestAnswers', JSON.stringify(answers));
    }

    function scrollToFirstMissing() {
        const first = document.querySelector('.q-card.missing');
        if(first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    let currentRecordId = null;

    document.getElementById('submitReport').addEventListener('click', () => {
        let totalQ = freqQuestions.length + forcedQuestions.length;
        let answeredCount = Object.keys(answers.freq).length + Object.keys(answers.forced).length;
        
        if(answeredCount !== totalQ) {
            alert('有题目未答，已为您自动定位。');
            scrollToFirstMissing();
            return;
        }

        const btn = document.getElementById("submitReport");
        btn.innerText = "⚡ 云端黑盒正在执行极化推演...";
        btn.disabled = true;

        fetch('/api/submit_psych', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: null, userAnswers: answers })
        })
        .then(async res => {
            if (!res.ok) {
                let txt = await res.text();
                throw new Error(`云端打包延迟或崩溃: ${res.status}`);
            }
            return res.json();
        })
        .then(resData => {
            currentRecordId = resData.recordId; 

            let topButtons = '<button id="btnDownloadReport" style="background:#1e4bd2; color:white; border:none; padding:10px 28px; border-radius:60px; cursor:pointer; margin-bottom:20px;">📥 保存报告（PDF）</button>';

            let feedbackHtml = `
            <div id="feedbackBox" style="margin-top:48px; padding:24px; background:rgba(30,75,210,0.04); border-radius:20px; border:2.5px dashed #1e4bd2;">
                <h3>🧭 动态体感反馈：</h3>
                <div style="margin:15px 0;"><label>1. 当下状态吻合度：</label>
                    <div id="starRating" style="font-size:1.6rem; cursor:pointer; letter-spacing:6px;"><span>☆</span><span>☆</span><span>☆</span><span>☆</span><span>☆</span></div>
                    <input type="hidden" id="ratingValue" value="0">
                </div>
                <div style="margin:15px 0;"><label>2. 现实卡点解释力槽点：</label>
                    <textarea id="feedbackComment" rows="3" style="width:100%; padding:12px; border-radius:12px; border:1px solid #cbd5e1;"></textarea>
                </div>
                <button id="btnSubmitFeedback" style="background:#1e4bd2; color:white; border:none; padding:10px 24px; border-radius:30px; cursor:pointer;">发送体感反馈</button>
                <p id="feedbackMsg" style="color:#10b981; display:none; margin-top:10px;">✓ 反馈落盘成功。</p>
            </div>`;

            document.getElementById('reportHtml').innerHTML = topButtons + resData.reportHtml + feedbackHtml;
            document.getElementById('reportSection').style.display = 'block';
            window.scrollTo({ top: document.getElementById('reportSection').offsetTop - 30, behavior: 'smooth' });

            btn.innerText = "✨ 生成心灵地图报告 ✨";
            btn.disabled = false;

            document.getElementById('btnDownloadReport').onclick = function() { window.print(); };

            const stars = document.querySelectorAll('#starRating span');
            stars.forEach((star, index) => {
                star.addEventListener('click', function() {
                    document.getElementById('ratingValue').value = index + 1;
                    stars.forEach((s, i) => { s.innerText = i <= index ? '★' : '☆'; s.style.color = i <= index ? '#fbbf24' : '#000'; });
                });
            });

            document.getElementById('btnSubmitFeedback').addEventListener('click', function() {
                let rating = document.getElementById('ratingValue').value;
                let comment = document.getElementById('feedbackComment').value;
                this.innerText = '同步中...';
                this.disabled = true;

                fetch('/api/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ recordId: currentRecordId, rating, comment })
                }).then(() => {
                    this.style.display = 'none';
                    document.getElementById('feedbackMsg').style.display = 'block';
                });
            });
        })
        .catch(err => {
            alert(err.message);
            btn.innerText = "✨ 生成心灵地图报告 ✨";
            btn.disabled = false;
        });
    });

    document.getElementById('resetAll').addEventListener('click', () => {
        answers = { freq: {}, forced: {} };
        renderAllQuestions();
        document.getElementById('reportSection').style.display = 'none';
        updateProgress();
    });

    renderAllQuestions();
</script>
</body>
</html>
